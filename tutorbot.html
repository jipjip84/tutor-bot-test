<script id="course-data" type="application/json">{"book": "Principles of Management (LibreTexts)", "weeks": [{"title": "Breaking Ground", "chapters": "Ch 1–2", "build": "Red Barn", "days": [{"title": "What managers do", "chapter": "Ch 1", "sections": ["1.1", "1.5"], "cards": [{"id": "W1D1-1", "section": "1.1", "term": "Management", "definition": "The art of getting things done through the efforts of other people. A manager's main challenge is solving problems creatively.", "farm": "The farm manager doesn't milk every cow. They make sure the milking gets done, and done well.", "art": "barn"}, {"id": "W1D1-2", "section": "1.5", "term": "P-O-L-C framework", "definition": "The four management functions: planning, organizing, leading and controlling. Credited to Henri Fayol, and tightly linked in daily practice.", "farm": "Plan the crop, organize the crew, lead them through harvest, then check yield against target.", "art": "almanac"}, {"id": "W1D1-3", "section": "1.5", "term": "Strategic, tactical, operational planning", "definition": "Strategic planning is long-range (3+ years) and organization-wide. Tactical planning (1–3 years) turns it into concrete means. Operational planning (under a year) sets the action steps.", "farm": "Strategic: go organic in five years. Tactical: convert the north fields over two seasons. Operational: spread compost on Tuesday.", "art": "almanac"}, {"id": "W1D1-4", "section": "1.5", "term": "Controlling", "definition": "Keeping performance on standard in three steps: set performance standards, compare actual performance against them, and take corrective action when needed.", "farm": "Target 170 bushels an acre, measure 140, then fix the irrigation.", "art": "chart"}]}, {"title": "Managers, roles and the triple bottom line", "chapter": "Ch 1", "sections": ["1.3", "1.6", "1.7"], "cards": [{"id": "W1D2-1", "section": "1.3", "term": "Line vs. staff manager", "definition": "A line manager runs a function that directly makes the product or service. A staff manager runs a supporting function such as finance or accounting.", "farm": "The harvest boss is line. The person keeping the farm's books is staff.", "art": "hands"}, {"id": "W1D2-2", "section": "1.3", "term": "Mintzberg's 10 managerial roles", "definition": "Interpersonal (figurehead, leader, liaison), informational (monitor, disseminator, spokesperson) and decisional (entrepreneur, disturbance handler, resource allocator, negotiator).", "farm": "In one morning the farmer greets the county inspector, reads grain prices, and haggles with the seed dealer.", "art": "vane"}, {"id": "W1D2-3", "section": "1.6", "term": "Triple bottom line", "definition": "Measuring business performance on social, environmental and economic results: people, planet, profit.", "farm": "A good year means fair wages for the crew, healthy soil, and money left over.", "art": "scale"}, {"id": "W1D2-4", "section": "1.7", "term": "Organizational citizenship behaviors (OCBs)", "definition": "Voluntary extra-role behaviors that help the organization but aren't formally rewarded, such as helping, sportsmanship and civic virtue.", "farm": "The hand who stays late to chase loose calves back in, unasked.", "art": "cow"}]}, {"title": "Personality at work", "chapter": "Ch 2", "sections": ["2.3"], "cards": [{"id": "W1D3-1", "section": "2.3", "term": "Big Five personality traits (OCEAN)", "definition": "Openness, conscientiousness, extraversion, agreeableness and neuroticism: five dimensions that explain much of how personalities differ.", "farm": "Every new seasonal picker brings a different mix of the five.", "art": "hands"}, {"id": "W1D3-2", "section": "2.3", "term": "Conscientiousness", "definition": "Being organized, systematic, punctual, achievement-oriented and dependable. The one trait that predicts job performance across all occupations.", "farm": "The worker who checks every water trough twice, every day.", "art": "water"}, {"id": "W1D3-3", "section": "2.3", "term": "Proactive personality", "definition": "An inclination to fix what's wrong, change things and take initiative rather than wait to be told.", "farm": "Spots a sagging fence post and resets it before the cattle find the gap.", "art": "fence"}, {"id": "W1D3-4", "section": "2.3", "term": "Self-efficacy", "definition": "Belief that you can perform a specific task successfully. Unlike broad traits it is task-specific, and it predicts performance.", "farm": "Confident on the tractor, nervous with a chainsaw: self-efficacy is per task.", "art": "tractor"}]}, {"title": "Perception and attitudes", "chapter": "Ch 2", "sections": ["2.4", "2.5", "2.6"], "cards": [{"id": "W1D4-1", "section": "2.4", "term": "Self-fulfilling prophecy", "definition": "When a stereotype leads you to act in a certain way, the other person responds in a way that confirms the stereotype.", "farm": "Treat the new hand as useless, give them only grunt work, and they never learn to drive the combine.", "art": "scarecrow"}, {"id": "W1D4-2", "section": "2.5", "term": "Organizational justice", "definition": "Perceived fairness at work: procedural (fair processes), distributive (fair rewards) and interactional (being treated with dignity).", "farm": "Bonus rules everyone can see, split fairly, explained respectfully.", "art": "scale"}, {"id": "W1D4-3", "section": "2.5", "term": "Psychological contract", "definition": "The unspoken understanding of what an employee will give the organization and what they'll get back.", "farm": "Work the long harvest weeks, and in return get a quiet winter and the farm's goodwill.", "art": "basket"}, {"id": "W1D4-4", "section": "2.6", "term": "Person-organization vs. person-job fit", "definition": "P-O fit is how well your values and goals match the organization's. P-J fit is how well your skills (KSAOs) match the job's demands.", "farm": "A great mechanic (job fit) who hates early mornings may never fit a dairy (organization fit).", "art": "barn"}]}, {"title": "Bringing in the sheaves: Ch 1–2", "chapter": "Ch 1–2", "sections": ["1.4", "1.6", "2.5", "2.7"], "cards": [{"id": "W1D5-1", "section": "1.4", "term": "Entrepreneurship", "definition": "Recognizing opportunities (needs, wants, problems) and using or creating resources to launch innovative, well-planned ventures.", "farm": "Seeing city demand for microgreens and turning a spare shed into a grow room.", "art": "seedling"}, {"id": "W1D5-2", "section": "1.6", "term": "Corporate social responsibility (CSR)", "definition": "Taking responsibility for your impact on customers, suppliers, employees, shareholders, communities and the environment, beyond what the law requires.", "farm": "Leaving a buffer strip along the creek even though no rule demands it.", "art": "rain"}, {"id": "W1D5-3", "section": "2.5", "term": "Job satisfaction", "definition": "The feelings people have toward their job; probably the most studied and most important work attitude.", "farm": "The milker who loves the calm of the 5am barn.", "art": "cow"}, {"id": "W1D5-4", "section": "2.7", "term": "Absenteeism and turnover", "definition": "Absenteeism is unscheduled absence; turnover is an employee leaving the organization. Both are costly.", "farm": "Losing two trained pickers mid-harvest costs more than their wages.", "art": "basket"}]}], "chapterNames": [{"num": 1, "title": "Introduction to Principles of Management"}, {"num": 2, "title": "Personality, Attitudes, and Work Behaviors"}], "scenarios": [{"q": "Your harvest boss's crew brings in the crop. Your bookkeeper's work supports it but never touches a plant. What describes the difference between their two roles?", "answer": "Line vs. staff manager", "why": "The harvest boss contributes directly to the product (line); the bookkeeper provides supporting inputs (staff)."}, {"q": "A new hire was told the job came with housing and winter work. In spring the owner drops both, and the hire feels betrayed even though nothing was written down.", "answer": "Psychological contract", "why": "The unwritten understanding of what each side gives and gets was broken."}, {"q": "Your annual report shows profit, soil health and how well the crew is paid, side by side.", "answer": "Triple bottom line", "why": "People, planet and profit are measured together."}]}, {"title": "Reading the Old Almanac", "chapters": "Ch 3–4", "build": "Hen Yard", "days": [{"title": "Classical roots of management", "chapter": "Ch 3", "sections": ["3.3"], "cards": [{"id": "W2D1-1", "section": "3.3", "term": "Scientific management", "definition": "Frederick Taylor's approach: study work scientifically (time-and-motion studies) to find the one best way to do each task.", "farm": "Timing three ways to pick strawberries and teaching everyone the fastest one.", "art": "gear"}, {"id": "W2D1-2", "section": "3.3", "term": "Administrative principles (Fayol)", "definition": "Henri Fayol's focus on the whole organization and the functions of management, with principles like unity of command, division of work and scalar chain.", "farm": "Each picker answers to one row boss, so orders never clash.", "art": "almanac"}, {"id": "W2D1-3", "section": "3.3", "term": "Bureaucracy (Weber)", "definition": "Max Weber's ideal organization: clear division of labour, hierarchy, written rules, and hiring and promotion by merit.", "farm": "A big grain co-op grades every farmer's wheat by the same written standard.", "art": "silo"}, {"id": "W2D1-4", "section": "3.3", "term": "Hawthorne studies", "definition": "Western Electric studies showing that social factors and management attention affect productivity. They launched the human relations movement.", "farm": "Milkers worked harder when the owner showed interest in them, not because of the new lights.", "art": "cow"}]}, {"title": "Modern views and global trends", "chapter": "Ch 3", "sections": ["3.3", "3.5"], "cards": [{"id": "W2D2-1", "section": "3.3", "term": "Theory X and Theory Y", "definition": "McGregor's two sets of assumptions. Theory X: workers dislike work and must be controlled. Theory Y: workers seek responsibility and direct themselves.", "farm": "A Theory Y farmer lets the crew design next year's crop rotation.", "art": "hands"}, {"id": "W2D2-2", "section": "3.3", "term": "Contingency theory", "definition": "There is no one best way to manage. The right approach depends on the situation: environment, technology, size.", "farm": "Irrigation plans for a desert vineyard and a rainy dairy pasture can't be the same.", "art": "rain"}, {"id": "W2D2-3", "section": "3.3", "term": "Systems theory", "definition": "The organization is an open system of related parts that takes inputs from its environment, transforms them, and produces outputs.", "farm": "Seed, water and labour go in; crops come out; soil health feeds back into next season.", "art": "wheat"}, {"id": "W2D2-4", "section": "3.5", "term": "Outsourcing and offshoring", "definition": "Outsourcing contracts work to another company. Offshoring moves work to another country, inside the firm or through a foreign provider.", "farm": "Hiring a custom harvester instead of buying a combine is outsourcing.", "art": "tractor"}]}, {"title": "Mission, vision and values", "chapter": "Ch 4", "sections": ["4.3", "4.5"], "cards": [{"id": "W2D3-1", "section": "4.3", "term": "Mission", "definition": "An organization's basic reason to exist: what it does, for whom, and how. It describes purpose in the present.", "farm": "\"Pasture-raised beef for families in our valley.\"", "art": "barn"}, {"id": "W2D3-2", "section": "4.3", "term": "Vision", "definition": "A future-facing statement of what the organization hopes to become. It should inspire and give direction.", "farm": "\"In ten years, every school lunch in the county uses our produce.\"", "art": "sun"}, {"id": "W2D3-3", "section": "4.3", "term": "Big hairy audacious goal (BHAG)", "definition": "Collins and Porras's term for a bold, long-term goal that energizes and focuses an organization.", "farm": "Becoming the first carbon-negative dairy in the state.", "art": "apple"}, {"id": "W2D3-4", "section": "4.5", "term": "Four types of creativity", "definition": "Imitation, variation, combination and transformation: increasingly novel ways to generate ideas.", "farm": "Copy a neighbour's farm stand, tweak it, add a pick-your-own patch, then reinvent it as a farm-stay.", "art": "seedling"}]}, {"title": "Stakeholders", "chapter": "Ch 4", "sections": ["4.6"], "cards": [{"id": "W2D4-1", "section": "4.6", "term": "Stakeholders", "definition": "Individuals or groups who affect or are affected by the organization: employees, customers, suppliers, investors, communities.", "farm": "Neighbours downstream of your runoff are stakeholders too.", "art": "hands"}, {"id": "W2D4-2", "section": "4.6", "term": "Stakeholder analysis", "definition": "Identifying stakeholders and assessing their interests and influence so their expectations shape mission, vision and strategy.", "farm": "Mapping who cares about your new hog barn: buyers, neighbours, the water board.", "art": "pig"}, {"id": "W2D4-3", "section": "4.6", "term": "Stakeholder power, legitimacy, urgency", "definition": "Three attributes for judging how much a stakeholder matters: ability to influence the firm, how appropriate their claim is, and how time-sensitive it is.", "farm": "The county regulator has power and legitimacy; a flood warning adds urgency.", "art": "vane"}, {"id": "W2D4-4", "section": "4.6", "term": "Primary vs. secondary stakeholders", "definition": "Primary stakeholders have a direct stake (employees, customers, owners). Secondary ones are indirectly affected (media, activists).", "farm": "Your grain buyer is primary; the local paper covering farm runoff is secondary.", "art": "market"}]}, {"title": "Bringing in the sheaves: Ch 3–4", "chapter": "Ch 3–4", "sections": ["3.6", "4.3", "4.7"], "cards": [{"id": "W2D5-1", "section": "3.6", "term": "Hofstede's cultural dimensions", "definition": "Ways national cultures differ: individualism/collectivism, power distance, uncertainty avoidance, masculinity/femininity, long-term orientation.", "farm": "In a collective village, the co-op decides together when to start harvest.", "art": "hands"}, {"id": "W2D5-2", "section": "3.6", "term": "Power distance", "definition": "How much a society accepts that power is unequally distributed in institutions and organizations.", "farm": "On some estates nobody questions the owner; on others the crew argues every call.", "art": "scale"}, {"id": "W2D5-3", "section": "4.3", "term": "Organizational values", "definition": "Shared principles and beliefs that guide behavior and decisions, often stated next to mission and vision.", "farm": "\"We never leave a gate open\" is a value everyone lives by.", "art": "fence"}, {"id": "W2D5-4", "section": "4.7", "term": "Crafting mission and vision statements", "definition": "Good statements are short, clear, memorable and inspiring, built with stakeholder input and shared across the organization.", "farm": "Short enough to paint on the side of the barn.", "art": "barn"}]}], "chapterNames": [{"num": 3, "title": "History, Globalization, and Values-Based Leadership"}, {"num": 4, "title": "Developing Mission, Vision, and Values"}], "scenarios": [{"q": "Your co-op grades every grower's wheat with the same written rules and promotes inspectors only on test scores.", "answer": "Bureaucracy (Weber)", "why": "Written rules, impersonal treatment and merit-based promotion are Weber's ideal bureaucracy."}, {"q": "The owner is sure the crew will slack off unless someone watches them every minute.", "answer": "Theory X and Theory Y", "why": "That's a Theory X assumption: workers dislike work and must be controlled."}, {"q": "Before building a hog barn, you list the neighbours, the water board and your buyers, and rate how much each could affect the project.", "answer": "Stakeholder analysis", "why": "Identifying stakeholders and weighing their interests and influence."}]}, {"title": "Planning the Planting", "chapters": "Ch 5–6", "build": "Tractor", "days": [{"title": "How strategies emerge", "chapter": "Ch 5", "sections": ["5.3", "5.4"], "cards": [{"id": "W3D1-1", "section": "5.3", "term": "Strategy formulation vs. implementation", "definition": "Formulation is choosing the strategy. Implementation is the actions and resources that put it into practice.", "farm": "Deciding to sell direct to restaurants vs. actually building the delivery route.", "art": "tractor"}, {"id": "W3D1-2", "section": "5.4", "term": "Intended strategy", "definition": "The strategy leaders plan and deliberately set out to pursue.", "farm": "The winter plan: 200 acres of corn.", "art": "almanac"}, {"id": "W3D1-3", "section": "5.4", "term": "Emergent strategy", "definition": "A strategy that arises unplanned, from a pattern of responses to unexpected opportunities and threats (Mintzberg).", "farm": "Drought kills the corn, sunflowers thrive, and you quietly become a sunflower farm.", "art": "sun"}, {"id": "W3D1-4", "section": "5.4", "term": "Realized strategy", "definition": "The strategy actually followed: the parts of the intended strategy that happened plus the emergent strategy.", "farm": "Half corn as planned, half sunflowers by accident: that's what you really did.", "art": "wheat"}]}, {"title": "Looking inside: resources and the value chain", "chapter": "Ch 5", "sections": ["5.5", "5.6"], "cards": [{"id": "W3D2-1", "section": "5.5", "term": "Strategy as trade-offs", "definition": "Porter's view that strategy means choosing what not to do. Trade-offs, discipline and focus build a unique position that's hard to copy.", "farm": "Saying no to commodity milk so you can focus on artisan cheese.", "art": "scale"}, {"id": "W3D2-2", "section": "5.5", "term": "Competitive advantage", "definition": "The ability to create more value or perform better than rivals, in a sustainable way.", "farm": "The only orchard in the region with a frost-proof heritage apple.", "art": "apple"}, {"id": "W3D2-3", "section": "5.6", "term": "VRIO/VRIS framework", "definition": "A resource gives sustained advantage if it is valuable, rare, hard to imitate, and not easily substituted.", "farm": "Rich river-bottom soil: valuable, rare, impossible to copy.", "art": "seedling"}, {"id": "W3D2-4", "section": "5.6", "term": "Value chain", "definition": "The primary and support activities through which a firm creates value. Used to find where cost or differentiation advantages come from.", "farm": "Seed, grow, harvest, pack, truck, sell, plus the books and repairs that support it all.", "art": "market"}]}, {"title": "Looking outside and the strategy diamond", "chapter": "Ch 5", "sections": ["5.7", "5.8"], "cards": [{"id": "W3D3-1", "section": "5.7", "term": "PESTEL analysis", "definition": "Examines the general environment's political, economic, social, technological, environmental and legal factors.", "farm": "Farm subsidies, interest rates, plant-based diets, drones, drought, labour law.", "art": "vane"}, {"id": "W3D3-2", "section": "5.7", "term": "Porter's five forces", "definition": "Industry analysis of rivalry, threat of new entrants, threat of substitutes, buyer power and supplier power.", "farm": "Three supermarket chains buy all the milk: buyer power squeezes the price.", "art": "market"}, {"id": "W3D3-3", "section": "5.8", "term": "Strategy diamond", "definition": "Hambrick and Fredrickson's five elements of a coherent strategy: arenas, vehicles, differentiators, staging and pacing, economic logic.", "farm": "Where we farm, how we expand, why buyers pick us, in what order, and how we make money.", "art": "almanac"}, {"id": "W3D3-4", "section": "5.8", "term": "Arenas and vehicles", "definition": "Arenas are where the firm is active (products, markets, geographies). Vehicles are how it gets there (internal growth, alliances, acquisitions).", "farm": "Arena: farmers' markets in three towns. Vehicle: partnering with a local bakery.", "art": "tractor"}]}, {"title": "Goals and objectives", "chapter": "Ch 6", "sections": ["6.3", "6.4", "6.5"], "cards": [{"id": "W3D4-1", "section": "6.3", "term": "Goals vs. objectives", "definition": "Goals are broad, longer-term outcome statements. Objectives are specific, measurable, time-bound targets that support them.", "farm": "Goal: become known for great eggs. Objective: 95% grade-A eggs by June.", "art": "chicken"}, {"id": "W3D4-2", "section": "6.3", "term": "Hierarchy of goals", "definition": "Goals cascade from mission and strategy down to units, departments and individuals so everything lines up.", "farm": "Farm goal, then dairy-barn goal, then each milker's daily target.", "art": "silo"}, {"id": "W3D4-3", "section": "6.4", "term": "Management by objectives (MBO)", "definition": "Drucker's process: managers and employees set objectives together, review progress, and reward based on results.", "farm": "The herd manager and owner agree to cut calf losses to 3% this year.", "art": "cow"}, {"id": "W3D4-4", "section": "6.5", "term": "Goal-setting theory", "definition": "Locke and Latham: specific, difficult goals with feedback lead to higher performance than vague or easy goals.", "farm": "\"Pick 40 crates by noon\" beats \"do your best\".", "art": "basket"}]}, {"title": "Bringing in the sheaves: Ch 5–6", "chapter": "Ch 5–6", "sections": ["5.7", "5.8", "6.4", "6.6"], "cards": [{"id": "W3D5-1", "section": "5.7", "term": "SWOT analysis", "definition": "A summary of internal strengths and weaknesses and external opportunities and threats.", "farm": "Strength: fertile soil. Threat: a new mega-farm in the next county.", "art": "scarecrow"}, {"id": "W3D5-2", "section": "5.8", "term": "Differentiators and economic logic", "definition": "Differentiators are how the firm wins in its arenas. Economic logic is how it earns returns, such as lowest cost or premium prices.", "farm": "Heritage pork chefs love (differentiator), sold at a premium (economic logic).", "art": "pig"}, {"id": "W3D5-3", "section": "6.4", "term": "Balanced scorecard", "definition": "Kaplan and Norton's framework measuring financial, customer, internal process, and learning and growth perspectives.", "farm": "Profit per acre, buyer happiness, harvest speed, and crew skills, side by side.", "art": "chart"}, {"id": "W3D5-4", "section": "6.6", "term": "360-degree feedback", "definition": "Appraisal using input from supervisors, peers, subordinates and sometimes customers, plus self-assessment.", "farm": "The foreman hears from the owner, the crew, and the chefs who buy the produce.", "art": "hands"}]}], "chapterNames": [{"num": 5, "title": "Strategizing"}, {"num": 6, "title": "Goals and Objectives"}], "scenarios": [{"q": "You planned 200 acres of corn. A drought pushed you into sunflowers, and sunflowers became your main crop.", "answer": "Emergent strategy", "why": "The strategy arose from responding to an unexpected event, not from the plan."}, {"q": "Your river-bottom soil is valuable, rare and impossible for any rival to copy.", "answer": "VRIO/VRIS framework", "why": "A resource that passes these tests can give a sustained advantage."}, {"q": "Instead of saying \"pick faster\", you set \"40 crates by noon\" and post the tally every hour.", "answer": "Goal-setting theory", "why": "Specific, difficult goals with feedback raise performance."}]}, {"title": "Raising the Barn", "chapters": "Ch 7–8", "build": "Grain Silo", "days": [{"title": "Building the structure", "chapter": "Ch 7", "sections": ["7.3"], "cards": [{"id": "W4D1-1", "section": "7.3", "term": "Organizational structure", "definition": "How an organization's activities are divided, coordinated and controlled, including who reports to whom.", "farm": "Who drives, who hauls, who runs the dryer, and who they all answer to.", "art": "barn"}, {"id": "W4D1-2", "section": "7.3", "term": "Formalization", "definition": "How far policies, procedures, job descriptions and rules are written down and spelled out.", "farm": "A laminated step-by-step milking hygiene checklist on the parlour wall.", "art": "almanac"}, {"id": "W4D1-3", "section": "7.3", "term": "Centralization", "definition": "How much decision-making authority sits at the top of the organization.", "farm": "Only the owner can decide when to start harvest: highly centralized.", "art": "vane"}, {"id": "W4D1-4", "section": "7.3", "term": "Hierarchical levels and span of control", "definition": "How many layers the structure has (tall vs. flat) and how many people report to one manager.", "farm": "One supervisor can handle 20 experienced pickers but only five new tractor drivers.", "art": "hands"}]}, {"title": "Shapes of organizations", "chapter": "Ch 7", "sections": ["7.3", "7.4"], "cards": [{"id": "W4D2-1", "section": "7.3", "term": "Mechanistic vs. organic structures", "definition": "Mechanistic: bureaucratic, centralized, formalized. Organic: flexible, decentralized, suited to changing environments.", "farm": "A big poultry plant vs. a start-up vertical farm.", "art": "gear"}, {"id": "W4D2-2", "section": "7.3", "term": "Functional vs. divisional structure", "definition": "Functional groups people by function (marketing, finance, operations). Divisional sets up self-contained units by product, customer or region.", "farm": "One farm with a crops team and a sales team, vs. separate dairy and orchard divisions.", "art": "silo"}, {"id": "W4D2-3", "section": "7.4", "term": "Matrix structure", "definition": "Combines functional and product or project lines so employees report to two managers.", "farm": "An agronomist reports to the crops manager and the new organic-conversion project lead.", "art": "fence"}, {"id": "W4D2-4", "section": "7.4", "term": "Boundaryless organization", "definition": "A structure that removes barriers between departments and with outside partners, often using temporary teams and networks.", "farm": "Neighbouring farms share one combine crew and swap labour at harvest.", "art": "tractor"}]}, {"title": "Managing change", "chapter": "Ch 7", "sections": ["7.5", "7.6"], "cards": [{"id": "W4D3-1", "section": "7.5", "term": "Resistance to change", "definition": "Reluctance to support change, from disrupted habits, personality, uncertainty, fear of failure or personal impact.", "farm": "\"We've always cut hay in June\" when switching to a new rotation.", "art": "scarecrow"}, {"id": "W4D3-2", "section": "7.6", "term": "Lewin's three-stage model", "definition": "Unfreeze current behaviors, change to new ones, then refreeze so the new behaviors stick.", "farm": "Show the crew why no-till matters, switch the drills, then make no-till the standard.", "art": "rain"}, {"id": "W4D3-3", "section": "7.6", "term": "Force field analysis", "definition": "Lewin's tool listing the forces driving change and the forces resisting it, so managers can strengthen one and weaken the other.", "farm": "Drivers: soil savings, subsidies. Resisters: old equipment, habit.", "art": "scale"}, {"id": "W4D3-4", "section": "7.6", "term": "Change agent", "definition": "The person who starts and manages a change effort, from inside or outside the organization.", "farm": "The young farmer back from ag college pushing for precision irrigation.", "art": "seedling"}]}, {"title": "Organizational culture", "chapter": "Ch 8", "sections": ["8.3", "8.4"], "cards": [{"id": "W4D4-1", "section": "8.3", "term": "Organizational culture", "definition": "Shared assumptions, values and beliefs that show people what behavior is appropriate in the organization.", "farm": "Nobody wrote it down, but everyone knows you help a neighbour bring in hay before rain.", "art": "barn"}, {"id": "W4D4-2", "section": "8.3", "term": "Levels of culture", "definition": "Schein's three layers: deep assumptions, espoused values and visible artifacts.", "farm": "The stewardship belief underneath, the \"care for the land\" motto, the old tractor kept polished by the gate.", "art": "apple"}, {"id": "W4D4-3", "section": "8.4", "term": "Strong culture", "definition": "Values that are widely shared and intensely held. A strong culture guides behavior and can help performance or block change.", "farm": "A family farm where every generation lives the same stewardship ethic.", "art": "house"}, {"id": "W4D4-4", "section": "8.4", "term": "Subcultures and countercultures", "definition": "Subcultures share values within a subgroup. Countercultures hold values that directly oppose the dominant culture.", "farm": "The night-calving crew has its own rhythms; the crew that skips biosecurity rules is a counterculture.", "art": "cow"}]}, {"title": "Bringing in the sheaves: Ch 7–8", "chapter": "Ch 7–8", "sections": ["7.3", "8.5"], "cards": [{"id": "W4D5-1", "section": "7.3", "term": "Departmentalization", "definition": "Grouping jobs into departments by function, product, geography or customer.", "farm": "Crops, livestock and the farm shop, each its own department.", "art": "market"}, {"id": "W4D5-2", "section": "8.5", "term": "Attraction-selection-attrition (ASA)", "definition": "Culture persists because people who fit are attracted, selected and retained, while poor fits leave.", "farm": "People who love early mornings apply to the dairy, and the night owls drift away.", "art": "sun"}, {"id": "W4D5-3", "section": "8.5", "term": "Onboarding (organizational socialization)", "definition": "How new employees learn the attitudes, knowledge, skills and behaviors needed to function in the organization.", "farm": "Day one: the safety walk around the bull pen and the harvest-supper tradition.", "art": "hands"}, {"id": "W4D5-4", "section": "8.5", "term": "Rituals, stories and symbols", "definition": "Cultural carriers that transmit values: ceremonies, legendary stories, logos, physical layout.", "farm": "The story of grandpa saving the herd in the '78 blizzard, told every winter.", "art": "almanac"}]}], "chapterNames": [{"num": 7, "title": "Organizational Structure and Change"}, {"num": 8, "title": "Organizational Culture"}], "scenarios": [{"q": "Your agronomist answers to both the crops manager and the organic-conversion project lead.", "answer": "Matrix structure", "why": "Reporting to two managers, one functional and one project, is a matrix."}, {"q": "Older hands keep saying \"we've always cut hay in June\" and drag their feet on the new rotation.", "answer": "Resistance to change", "why": "Habit and uncertainty make people reluctant to support change."}, {"q": "People who love dawn milking apply, get hired and stay. Night owls quit within months.", "answer": "Attraction-selection-attrition (ASA)", "why": "Culture sustains itself as fitting people are attracted and kept while poor fits leave."}]}, {"title": "Neighbours and Foremen", "chapters": "Ch 9–10", "build": "Dairy Herd", "days": [{"title": "The language of networks", "chapter": "Ch 9", "sections": ["9.3"], "cards": [{"id": "W5D1-1", "section": "9.3", "term": "Social network analysis (SNA)", "definition": "Mapping and measuring relationships and flows among people or groups to see how work and information really move.", "farm": "Drawing who calls whom when a cow gets sick reveals the real chain of help.", "art": "vane"}, {"id": "W5D1-2", "section": "9.3", "term": "Nodes and ties", "definition": "Nodes are the people or units in a network. Ties are the relationships linking them.", "farm": "Farms are nodes; shared equipment and phone calls are ties.", "art": "fence"}, {"id": "W5D1-3", "section": "9.3", "term": "Centrality", "definition": "How connected a person is, or how central they are to information flows in a network.", "farm": "The feed-store owner who knows every farmer in the county.", "art": "market"}, {"id": "W5D1-4", "section": "9.3", "term": "Strong vs. weak ties", "definition": "Strong ties are close, frequent relationships. Weak ties are casual acquaintances, and they often bring new information.", "farm": "Your brother helps every harvest (strong); a fair acquaintance tells you about a new grain buyer (weak).", "art": "hands"}]}, {"title": "Bridges and social capital", "chapter": "Ch 9", "sections": ["9.3", "9.4", "9.6"], "cards": [{"id": "W5D2-1", "section": "9.3", "term": "Structural holes", "definition": "Gaps between unconnected groups in a network. Whoever bridges them gains information and control.", "farm": "The organic growers and the restaurant owners don't know each other yet.", "art": "fence"}, {"id": "W5D2-2", "section": "9.3", "term": "Brokers (bridges)", "definition": "People who connect groups that otherwise aren't connected and control the information flowing between them.", "farm": "The farmers' market manager who introduces growers to chefs.", "art": "market"}, {"id": "W5D2-3", "section": "9.4", "term": "Social capital", "definition": "The value a person or organization gets from its network of relationships.", "farm": "When your barn burns, twenty neighbours show up with hammers.", "art": "barn"}, {"id": "W5D2-4", "section": "9.6", "term": "Personal, operational, strategic networks", "definition": "Personal: contacts outside work for development. Operational: people needed to get today's work done. Strategic: relationships that help with future priorities.", "farm": "Ag-college friends, your vet and mechanic, and the co-op board you want to join.", "art": "hands"}]}, {"title": "Who leads? Traits and behaviors", "chapter": "Ch 10", "sections": ["10.3", "10.4"], "cards": [{"id": "W5D3-1", "section": "10.3", "term": "Trait approaches to leadership", "definition": "Studying characteristics like intelligence, Big Five traits, self-esteem and integrity that relate to who emerges as leader and who leads well.", "farm": "The crew naturally follows the calm, honest one when the storm hits.", "art": "sun"}, {"id": "W5D3-2", "section": "10.4", "term": "Task-oriented (initiating structure)", "definition": "Leader behaviors that structure work: setting goals, clarifying expectations, monitoring performance.", "farm": "\"North field by 3pm, two trucks, check moisture every load.\"", "art": "chart"}, {"id": "W5D3-3", "section": "10.4", "term": "People-oriented (consideration)", "definition": "Leader behaviors showing concern for employees' feelings and well-being and treating them with respect.", "farm": "The foreman who brings cold drinks and asks about your sick kid.", "art": "hands"}, {"id": "W5D3-4", "section": "10.4", "term": "Authoritarian, democratic, laissez-faire", "definition": "Decision styles: deciding alone, involving employees, or leaving decisions to employees.", "farm": "Owner decides, crew votes, or \"you figure it out\".", "art": "scale"}]}, {"title": "Leadership depends on the field", "chapter": "Ch 10", "sections": ["10.5", "10.6"], "cards": [{"id": "W5D4-1", "section": "10.5", "term": "Fiedler's contingency theory", "definition": "Leader effectiveness depends on matching style (measured by LPC) to how favorable the situation is: leader-member relations, task structure, position power.", "farm": "A task-driven boss shines in a harvest emergency; a relationship-builder shines in a slow season.", "art": "rain"}, {"id": "W5D4-2", "section": "10.5", "term": "Situational leadership theory", "definition": "Hersey and Blanchard: leaders adapt their style (telling, selling, participating, delegating) to followers' readiness.", "farm": "Tell the new hand exactly how to hitch the trailer; delegate to the 20-year veteran.", "art": "tractor"}, {"id": "W5D4-3", "section": "10.5", "term": "Path-goal theory", "definition": "Leaders clarify the path to goals using directive, supportive, participative or achievement-oriented behavior suited to the employee and setting.", "farm": "Clearing the muddy lane so the trucks can actually reach the field.", "art": "fence"}, {"id": "W5D4-4", "section": "10.6", "term": "Transformational leadership", "definition": "Inspiring followers to exceed expectations through charisma, inspirational motivation, intellectual stimulation and individualized consideration.", "farm": "The farmer whose vision of a regenerative valley gets the whole crew excited.", "art": "sun"}]}, {"title": "Bringing in the sheaves: Ch 9–10", "chapter": "Ch 9–10", "sections": ["9.3", "10.6"], "cards": [{"id": "W5D5-1", "section": "9.3", "term": "Small-world (six degrees)", "definition": "Most people are linked to anyone else through a short chain of acquaintances.", "farm": "Your vet's cousin knows the buyer at the big grocery chain.", "art": "vane"}, {"id": "W5D5-2", "section": "10.6", "term": "Transactional leadership", "definition": "Leadership based on exchanges, using contingent rewards and management by exception.", "farm": "Bonus per crate picked, and the boss only steps in when something goes wrong.", "art": "basket"}, {"id": "W5D5-3", "section": "10.6", "term": "Leader-member exchange (LMX)", "definition": "Leaders form relationships of different quality with each follower. High-quality exchanges bring trust, support and better results.", "farm": "The foreman's trusted inner circle gets the best fields and the most coaching.", "art": "hands"}, {"id": "W5D5-4", "section": "10.6", "term": "Servant leadership", "definition": "Leaders who put employees' needs first, help them grow and succeed, and act ethically.", "farm": "The owner who mucks stalls alongside the crew and pays for their certifications.", "art": "barn"}]}], "chapterNames": [{"num": 9, "title": "Social Networks"}, {"num": 10, "title": "Leading People and Organizations"}], "scenarios": [{"q": "The farmers' market manager introduces organic growers to restaurant chefs who had never met.", "answer": "Brokers (bridges)", "why": "They connect two otherwise unconnected groups."}, {"q": "You give a brand-new hand step-by-step instructions, but simply hand the keys to your 20-year veteran.", "answer": "Situational leadership theory", "why": "Leadership style matched to each follower's readiness."}, {"q": "The crew lead pays a bonus per crate and only steps in when something goes wrong.", "answer": "Transactional leadership", "why": "Contingent rewards plus management by exception."}]}, {"title": "Weather Calls and Fence Talk", "chapters": "Ch 11–12", "build": "Beehives", "days": [{"title": "How decisions get made", "chapter": "Ch 11", "sections": ["11.3"], "cards": [{"id": "W6D1-1", "section": "11.3", "term": "Programmed vs. nonprogrammed decisions", "definition": "Programmed decisions are routine and handled by rules. Nonprogrammed decisions are new and unstructured.", "farm": "\"Reorder diesel at 25%\" vs. responding to a brand-new livestock disease.", "art": "water"}, {"id": "W6D1-2", "section": "11.3", "term": "Rational decision-making model", "definition": "Identify the problem, set and weight criteria, generate and evaluate alternatives, choose the best, implement, evaluate.", "farm": "Choosing a new tractor: price, horsepower, dealer support, scored and compared.", "art": "tractor"}, {"id": "W6D1-3", "section": "11.3", "term": "Bounded rationality", "definition": "Decision makers are limited by time, information and mental capacity, so they can't be fully rational.", "farm": "Nobody knows next year's rainfall, so you plant on your best guess.", "art": "rain"}, {"id": "W6D1-4", "section": "11.3", "term": "Satisficing", "definition": "Accepting the first option that meets minimum criteria instead of hunting for the best one.", "farm": "Buying the first decent used baler at a fair price instead of checking every auction in the state.", "art": "wheat"}]}, {"title": "When decisions go wrong", "chapter": "Ch 11", "sections": ["11.4"], "cards": [{"id": "W6D2-1", "section": "11.4", "term": "Overconfidence bias", "definition": "Overestimating how accurate your judgments and abilities are.", "farm": "\"I can get all 300 acres in before the rain.\" You can't.", "art": "rain"}, {"id": "W6D2-2", "section": "11.4", "term": "Anchoring", "definition": "Leaning too heavily on the first piece of information you get when making a judgment.", "farm": "The first bid for your calves sets the bar for every offer after.", "art": "cow"}, {"id": "W6D2-3", "section": "11.4", "term": "Framing bias", "definition": "Being swayed by how information is presented, such as gains vs. losses.", "farm": "\"90% germination\" sounds better than \"10% of seeds fail\".", "art": "seedling"}, {"id": "W6D2-4", "section": "11.4", "term": "Escalation of commitment", "definition": "Continuing to invest in a failing course of action because of what you've already put in.", "farm": "Replanting a failed crop for the third season because \"we've sunk so much in\".", "art": "scarecrow"}]}, {"title": "Deciding as a group", "chapter": "Ch 11", "sections": ["11.3", "11.5"], "cards": [{"id": "W6D3-1", "section": "11.5", "term": "Groupthink", "definition": "A group avoids critically evaluating ideas to keep the peace and consensus, which leads to poor decisions.", "farm": "Nobody says the new hog barn is in the flood plain because everyone's excited.", "art": "pig"}, {"id": "W6D3-2", "section": "11.5", "term": "Nominal group technique", "definition": "Members generate ideas alone, share them in turn, discuss, then vote privately to reduce pressure to conform.", "farm": "Each crew member writes their idea for fixing the bottleneck before anyone talks.", "art": "almanac"}, {"id": "W6D3-3", "section": "11.5", "term": "Delphi technique", "definition": "Experts give anonymous written input over several rounds, with feedback, until they reach consensus.", "farm": "Agronomists email anonymous yield forecasts until the numbers converge.", "art": "chart"}, {"id": "W6D3-4", "section": "11.3", "term": "Intuitive decision making", "definition": "Reaching decisions quickly by recognizing patterns from experience rather than by conscious analysis.", "farm": "An old farmer smells rain coming and moves the hay in.", "art": "vane"}]}, {"title": "How messages travel", "chapter": "Ch 12", "sections": ["12.3", "12.4"], "cards": [{"id": "W6D4-1", "section": "12.3", "term": "Communication process model", "definition": "A sender encodes a message and sends it through a channel. The receiver decodes it and gives feedback. Noise can distort it.", "farm": "You shout \"gate!\" across the yard; the hand hears \"wait!\" over the tractor.", "art": "vane"}, {"id": "W6D4-2", "section": "12.3", "term": "Noise", "definition": "Anything that interferes with or distorts a message between sender and receiver.", "farm": "A roaring grain dryer next to the person giving instructions.", "art": "gear"}, {"id": "W6D4-3", "section": "12.4", "term": "Filtering", "definition": "Distorting or holding back information to manage how someone will react.", "farm": "Telling the owner the harvest is \"going fine\" while skipping the broken auger.", "art": "silo"}, {"id": "W6D4-4", "section": "12.4", "term": "Information overload", "definition": "Receiving more information than you can process, so messages get missed or misunderstood.", "farm": "Forty texts about weather, prices and parts before 7am.", "art": "almanac"}]}, {"title": "Bringing in the sheaves: Ch 11–12", "chapter": "Ch 11–12", "sections": ["11.5", "12.4", "12.6", "12.7"], "cards": [{"id": "W6D5-1", "section": "11.5", "term": "Brainstorming", "definition": "A group generates as many ideas as possible without criticism, building on each other's.", "farm": "Twenty ideas for the empty barn, from goat yoga to a cider press.", "art": "barn"}, {"id": "W6D5-2", "section": "12.4", "term": "Grapevine (workplace gossip)", "definition": "The informal channel through which rumors and unofficial information spread.", "farm": "Everyone knew about the sale of the north farm before the owner said a word.", "art": "hands"}, {"id": "W6D5-3", "section": "12.6", "term": "Channel richness", "definition": "How much information a channel can carry. Face-to-face is richest; impersonal written messages are leanest.", "farm": "Tell a worker they're being let go face to face, not on a note in the tool shed.", "art": "house"}, {"id": "W6D5-4", "section": "12.7", "term": "Active listening", "definition": "Listening with attention, paraphrasing, asking questions and responding to show you understand.", "farm": "\"So the heifers are off feed since Tuesday? What changed?\"", "art": "cow"}]}], "chapterNames": [{"num": 11, "title": "Decision Making"}, {"num": 12, "title": "Communication in Organizations"}], "scenarios": [{"q": "You've replanted the failed field three seasons running because you've \"already sunk so much in\".", "answer": "Escalation of commitment", "why": "Continuing a failing course because of past investment."}, {"q": "The first offer for your calves was low, and you judge every later offer against it.", "answer": "Anchoring", "why": "The first number became the reference point."}, {"q": "Your foreman says harvest is \"going fine\" and leaves out the broken auger.", "answer": "Filtering", "why": "Information was held back to manage your reaction."}]}, {"title": "Harvest Crew Spirit", "chapters": "Ch 13–14", "build": "Apple Orchard", "days": [{"title": "How groups grow", "chapter": "Ch 13", "sections": ["13.3"], "cards": [{"id": "W7D1-1", "section": "13.3", "term": "Tuckman's stages of development", "definition": "Groups move through forming, storming, norming, performing and adjourning.", "farm": "The seasonal crew squabbles in week one, finds its rhythm by week three, and parties at the end.", "art": "hands"}, {"id": "W7D1-2", "section": "13.3", "term": "Punctuated equilibrium", "definition": "Groups alternate between long stretches of inertia and bursts of change, often around a project's midpoint.", "farm": "The crew coasts until mid-season, then suddenly reorganizes the whole picking system.", "art": "apple"}, {"id": "W7D1-3", "section": "13.3", "term": "Group cohesion", "definition": "How attracted members are to the group and how motivated they are to stay in it.", "farm": "The crew that eats lunch together under the same oak every day.", "art": "apple"}, {"id": "W7D1-4", "section": "13.3", "term": "Team norms", "definition": "Shared expectations about how members should behave.", "farm": "On this crew, nobody leaves until the last crate is loaded.", "art": "basket"}]}, {"title": "Designing teams", "chapter": "Ch 13", "sections": ["13.4", "13.5"], "cards": [{"id": "W7D2-1", "section": "13.4", "term": "Task interdependence", "definition": "How much members depend on each other: pooled, sequential or reciprocal.", "farm": "Pooled: pickers in separate rows. Sequential: picker, packer, trucker. Reciprocal: combine and grain cart working together.", "art": "tractor"}, {"id": "W7D2-2", "section": "13.4", "term": "Task roles vs. social roles", "definition": "Task roles help the team get work done. Social (maintenance) roles keep relationships healthy.", "farm": "One person keeps the tally; another keeps everyone laughing in the heat.", "art": "sun"}, {"id": "W7D2-3", "section": "13.5", "term": "Self-managed teams", "definition": "Teams with no formal supervisor that plan and control their own work.", "farm": "The orchard crew sets its own schedule and divides the blocks.", "art": "apple"}, {"id": "W7D2-4", "section": "13.5", "term": "Cross-functional teams", "definition": "Teams with members from different functions working toward one goal.", "farm": "Agronomist, mechanic and marketer planning the new pumpkin patch together.", "art": "market"}]}, {"title": "What holds teams back", "chapter": "Ch 13", "sections": ["13.4", "13.6"], "cards": [{"id": "W7D3-1", "section": "13.6", "term": "Social loafing", "definition": "Putting in less effort when working in a group than when working alone.", "farm": "Six people \"moving\" hay bales while two do all the lifting.", "art": "wheat"}, {"id": "W7D3-2", "section": "13.6", "term": "Lack of trust", "definition": "A barrier to team effectiveness. Without trust, members hold back information and effort.", "farm": "Pickers hide the good rows from each other when they don't trust the bonus split.", "art": "fence"}, {"id": "W7D3-3", "section": "13.6", "term": "Collective efficacy", "definition": "A team's shared belief that it can successfully accomplish its tasks.", "farm": "\"We brought in 400 acres last year. We can do this.\"", "art": "basket"}, {"id": "W7D3-4", "section": "13.4", "term": "Virtual teams", "definition": "Teams whose members are spread out and work together mainly through technology.", "farm": "Farmers in three states sharing data on a drought-resistant seed trial.", "art": "chart"}]}, {"title": "What drives people: needs", "chapter": "Ch 14", "sections": ["14.3"], "cards": [{"id": "W7D4-1", "section": "14.3", "term": "Maslow's hierarchy of needs", "definition": "Physiological, safety, social, esteem, self-actualization. Lower needs must be met before higher ones motivate.", "farm": "Fair wages and housing come before pride in a prize-winning crop.", "art": "barn"}, {"id": "W7D4-2", "section": "14.3", "term": "ERG theory", "definition": "Alderfer's needs of existence, relatedness and growth. Several can operate at once, and frustration can cause regression.", "farm": "A worker blocked from growing into a lead role starts caring more about pay.", "art": "seedling"}, {"id": "W7D4-3", "section": "14.3", "term": "Herzberg's two-factor theory", "definition": "Hygiene factors (pay, security, conditions) prevent dissatisfaction. Motivators (achievement, recognition, responsibility) create satisfaction.", "farm": "A new barn roof stops complaints; a blue ribbon at the fair motivates.", "art": "ribbon"}, {"id": "W7D4-4", "section": "14.3", "term": "McClelland's acquired needs", "definition": "People are driven by needs for achievement, affiliation and power, learned through life experience.", "farm": "One hand wants the top yield, another wants friends, another wants to run the crew.", "art": "hands"}]}, {"title": "Bringing in the sheaves: Ch 13–14", "chapter": "Ch 13–14", "sections": ["14.4", "14.5"], "cards": [{"id": "W7D5-1", "section": "14.4", "term": "Equity theory", "definition": "People compare their input/outcome ratio with a referent's. Feeling under- or over-rewarded pushes them to restore balance.", "farm": "A picker learns the new hire earns more for the same rows, and their effort drops.", "art": "scale"}, {"id": "W7D5-2", "section": "14.4", "term": "Expectancy theory", "definition": "Vroom: motivation depends on expectancy (effort leads to performance), instrumentality (performance leads to reward) and valence (value of the reward).", "farm": "A bonus nobody believes they can reach motivates nobody.", "art": "basket"}, {"id": "W7D5-3", "section": "14.4", "term": "Reinforcement theory", "definition": "Behavior is shaped by its consequences: positive and negative reinforcement increase it; punishment and extinction decrease it.", "farm": "Praise every time the gate gets latched, and soon it always does.", "art": "fence"}, {"id": "W7D5-4", "section": "14.5", "term": "Intrinsic vs. extrinsic motivation", "definition": "Intrinsic motivation comes from the work itself. Extrinsic motivation comes from outside rewards such as pay.", "farm": "Loving the smell of turned soil vs. working for the harvest bonus.", "art": "seedling"}]}], "chapterNames": [{"num": 13, "title": "Managing Groups and Teams"}, {"num": 14, "title": "Motivating Employees"}], "scenarios": [{"q": "Six people are assigned to stack hay bales, but two of them do nearly all the lifting.", "answer": "Social loafing", "why": "People put in less effort in a group than alone."}, {"q": "A picker finds out a new hire earns more for the same rows, and starts slowing down.", "answer": "Equity theory", "why": "An unfavourable comparison with a referent pushes the picker to rebalance by cutting effort."}, {"q": "Fixing the leaky barn roof stopped the complaints, but it took the county fair ribbon to get the crew excited.", "answer": "Herzberg's two-factor theory", "why": "The roof is a hygiene factor; the ribbon (recognition) is a motivator."}]}, {"title": "Weighing the Harvest", "chapters": "Ch 15–16", "build": "Farmhouse and Blue Ribbon", "days": [{"title": "The essentials of control", "chapter": "Ch 15", "sections": ["15.3", "15.4"], "cards": [{"id": "W8D1-1", "section": "15.3", "term": "Control process", "definition": "Set standards, measure actual performance, compare it with the standards, and take corrective action.", "farm": "Standard: 30 litres per cow. Measure. Compare. Change the feed ration.", "art": "cow"}, {"id": "W8D1-2", "section": "15.4", "term": "Feedforward control", "definition": "Control that heads off problems before an activity starts, such as inspecting inputs.", "farm": "Testing seed germination before planting.", "art": "seedling"}, {"id": "W8D1-3", "section": "15.4", "term": "Concurrent control", "definition": "Control while an activity is in progress.", "farm": "The foreman walking the rows during harvest, checking fruit quality.", "art": "apple"}, {"id": "W8D1-4", "section": "15.4", "term": "Feedback control", "definition": "Control after an activity ends, comparing outcomes with standards.", "farm": "Reviewing yield maps after harvest to plan next year.", "art": "chart"}]}, {"title": "Levels and money", "chapter": "Ch 15", "sections": ["15.4", "15.5"], "cards": [{"id": "W8D2-1", "section": "15.4", "term": "Bureaucratic vs. clan control", "definition": "Bureaucratic control uses rules, hierarchy and procedures. Clan control relies on shared values and culture.", "farm": "A rulebook on spraying vs. a crew that just cares about clean water.", "art": "almanac"}, {"id": "W8D2-2", "section": "15.5", "term": "Budget", "definition": "A financial plan that allocates resources, used to compare actual spending and revenue against plan.", "farm": "$40,000 for fertilizer this season; check the receipts monthly.", "art": "scale"}, {"id": "W8D2-3", "section": "15.5", "term": "Financial statements", "definition": "The income statement, balance sheet and cash flow statement used to monitor financial performance.", "farm": "Profit for the season, what the farm owns and owes, and whether cash lasts until harvest pays out.", "art": "chart"}, {"id": "W8D2-4", "section": "15.5", "term": "Financial ratio analysis", "definition": "Liquidity, leverage, profitability and activity ratios used to judge financial health and compare performance.", "farm": "Can you pay this month's feed bill, and how much of the land does the bank own?", "art": "chart"}]}, {"title": "Nonfinancial and lean control", "chapter": "Ch 15", "sections": ["15.6", "15.7"], "cards": [{"id": "W8D3-1", "section": "15.6", "term": "Nonfinancial controls", "definition": "Controls based on measures like quality, customer satisfaction and employee behavior rather than money.", "farm": "Chef complaints about bruised tomatoes, tracked every week.", "art": "market"}, {"id": "W8D3-2", "section": "15.6", "term": "Six Sigma", "definition": "A quality approach aiming for near-zero defects (3.4 per million) through measurement and process improvement.", "farm": "Driving cracked eggs down toward almost none.", "art": "chicken"}, {"id": "W8D3-3", "section": "15.7", "term": "Lean production and kaizen", "definition": "Lean eliminates waste and improves every process continuously (from the Toyota Production System). Kaizen is small, constant improvement by everyone.", "farm": "Moving the wash station next to the packing shed saves 400 steps a day.", "art": "gear"}, {"id": "W8D3-4", "section": "15.7", "term": "Just-in-time (JIT)", "definition": "Inventory arrives exactly when production needs it, keeping inventory costs low.", "farm": "Feed delivered weekly instead of filling (and spoiling) a giant silo.", "art": "silo"}]}, {"title": "Strategic human resource management", "chapter": "Ch 16", "sections": ["16.3", "16.4", "16.5"], "cards": [{"id": "W8D4-1", "section": "16.3", "term": "Strategic HRM", "definition": "Aligning HR practices with strategy so that how you manage people supports competitive advantage.", "farm": "If you compete on artisan cheese, hire and train for craft, not speed.", "art": "hands"}, {"id": "W8D4-2", "section": "16.3", "term": "Human capital", "definition": "Employees' knowledge, skills, abilities and experience that create value.", "farm": "The herd manager who can spot mastitis from across the barn.", "art": "cow"}, {"id": "W8D4-3", "section": "16.4", "term": "War for talent", "definition": "Intense competition among organizations to attract and keep the best employees.", "farm": "Every farm in the valley wants the same three skilled mechanics.", "art": "tractor"}, {"id": "W8D4-4", "section": "16.5", "term": "Structured interviews", "definition": "Every applicant gets the same job-related questions and is rated on the same criteria. More valid than unstructured interviews.", "farm": "Each applicant is asked how they'd handle a calving at 2am, and scored the same way.", "art": "almanac"}]}, {"title": "Bringing in the sheaves: Ch 15–16", "chapter": "Ch 15–16", "sections": ["15.8", "16.5", "16.6", "16.7"], "cards": [{"id": "W8D5-1", "section": "15.8", "term": "Personal balanced scorecard", "definition": "Applying the balanced scorecard to yourself: goals and measures across several life and career areas.", "farm": "Your own scorecard: grades, health, skills, and time on the farm.", "art": "ribbon"}, {"id": "W8D5-2", "section": "16.5", "term": "Realistic job preview", "definition": "Giving applicants honest positive and negative information about the job, which reduces turnover.", "farm": "\"You'll love the sunrises. You'll also shovel manure in January.\"", "art": "house"}, {"id": "W8D5-3", "section": "16.6", "term": "Pay for performance", "definition": "Linking pay to individual, group or organizational results: merit pay, bonuses, gainsharing, profit sharing, stock options.", "farm": "A bonus per pound of honey for the beekeepers.", "art": "beehive"}, {"id": "W8D5-4", "section": "16.7", "term": "High-performance work system (HPWS)", "definition": "A bundle of HR practices (selective hiring, training, empowerment, performance-based pay) that together lift performance.", "farm": "Hire carefully, train well, let crews decide, share the profits: a farm that runs itself.", "art": "barn"}]}], "chapterNames": [{"num": 15, "title": "The Essentials of Control"}, {"num": 16, "title": "Strategic Human Resource Management"}], "scenarios": [{"q": "You test seed germination before planting, so a bad batch never goes in the ground.", "answer": "Feedforward control", "why": "It heads off a problem before the activity starts."}, {"q": "Moving the wash station next to the packing shed saves the crew 400 steps a day.", "answer": "Lean production and kaizen", "why": "Small continuous improvements that remove waste."}, {"q": "You tell applicants about shovelling manure in January as well as about the sunrises.", "answer": "Realistic job preview", "why": "Honest good-and-bad information reduces later turnover."}]}], "polc": [{"text": "Deciding in winter which fields get corn next spring", "fn": "Planning"}, {"text": "Setting a target of 95% grade-A eggs by June", "fn": "Planning"}, {"text": "Mapping out a five-year move to organic", "fn": "Planning"}, {"text": "Assigning two people to the planter and one to irrigation", "fn": "Organizing"}, {"text": "Drawing up who reports to the harvest boss", "fn": "Organizing"}, {"text": "Setting up a separate team for the farm shop", "fn": "Organizing"}, {"text": "Rallying the tired crew before the last field", "fn": "Leading"}, {"text": "Coaching a new hand through their first calving", "fn": "Leading"}, {"text": "Explaining to the crew why the new rotation matters", "fn": "Leading"}, {"text": "Comparing yield per acre against the target", "fn": "Controlling"}, {"text": "Checking feed spending against the budget", "fn": "Controlling"}, {"text": "Inspecting packed crates for bruised fruit", "fn": "Controlling"}]}</script>

/* ================= Schedule ================= */
const LESSONS_PER_WEEK = 5;
const TOTAL_DAYS = WEEKS.length * 7;
function pad(n) { return String(n).padStart(2, "0"); }
function iso(d) { return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function parseISO(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function daysBetween(a, b) { return Math.round((parseISO(iso(b)) - parseISO(iso(a))) / 86400000); }
function fmt(d) { return d.toLocaleDateString(undefined, { month: "short", day: "numeric" }); }

function dayInfo(i) {
  const w = Math.floor(i / 7), dow = i % 7;
  const week = WEEKS[w];
  if (dow < LESSONS_PER_WEEK) return { i, w, dow, kind: "lesson", lesson: week.days[dow], week };
  if (dow === 5) return { i, w, dow, kind: "market", week };
  return { i, w, dow, kind: "rest", week };
}
function nextOpenDay(from) {
  for (let i = from + 1; i < TOTAL_DAYS; i++) {
    const d = dayInfo(i);
    if (d.kind === "lesson" && !state.lessonsDone[i]) return i;
    if (d.kind === "market" && state.market[d.w] == null) return i;
  }
  return -1;
}
function keepGoingHTML(from) {
  const n = nextOpenDay(from);
  if (n < 0) return "";
  const d = dayInfo(n);
  const label = d.kind === "lesson" ? d.lesson.title : `Market Day: ${d.week.title}`;
  return `<button class="btn primary" id="keepGoing" data-to="${n}">Keep going: ${esc(label)} →</button>`;
}
function allCards() { return WEEKS.flatMap(w => w.days.flatMap(d => d.cards)); }

/* ================= State + storage ================= */
const LS_KEY = "harvest-ledger-v1";
function defaultState() { return { start: iso(new Date()), cards: {}, lessonsDone: {}, market: {}, active: [], xp: 0, ribbons: {} }; }
let state = defaultState();
try { const raw = localStorage.getItem(LS_KEY); if (raw) state = Object.assign(defaultState(), JSON.parse(raw)); } catch (e) {}

let remote = null; // db doc reference when the account store is available
let saveTimer = null;
function save() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
  if (!remote) return;
  clearTimeout(saveTimer);
  setSaved("Saving…");
  saveTimer = setTimeout(() => {
    remote.set(JSON.parse(JSON.stringify(state))).then(() => setSaved("Saved to your account")).catch(() => setSaved("Saved on this device"));
  }, 600);
}
function setSaved(t) { document.getElementById("savedState").textContent = t; }

async function connectStore() {
  if (!window.claude || !window.claude.use) return;
  try {
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    remote = db.collection("data/users/" + id).doc("harvest-ledger");
    const snap = await remote.get();
    if (snap.exists) {
      state = Object.assign(defaultState(), JSON.parse(JSON.stringify(snap.data())));
      try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
      quietRibbons();
      renderAll();
      setSaved("Saved to your account");
    } else {
      save();
    }
  } catch (e) { remote = null; }
}

/* ================= Derived progress ================= */
function weekComplete(w) {
  for (let d = 0; d < LESSONS_PER_WEEK; d++) if (!state.lessonsDone[w * 7 + d]) return false;
  return state.market[w] != null;
}
function knownCount() { return Object.values(state.cards).filter(v => v === "known").length; }
function streak() {
  const set = new Set(state.active);
  let n = 0, d = new Date();
  if (!set.has(iso(d))) d = addDays(d, -1);
  while (set.has(iso(d))) { n++; d = addDays(d, -1); }
  return n;
}
function bestStreak() {
  const ds = [...new Set(state.active)].sort();
  let best = 0, run = 0, prev = null;
  for (const s of ds) { const d = parseISO(s); run = prev && daysBetween(prev, d) === 1 ? run + 1 : 1; best = Math.max(best, run); prev = d; }
  return best;
}
function markActive() { const t = iso(new Date()); if (!state.active.includes(t)) state.active.push(t); }
function farmUnlocks() {
  const anyLesson = Object.keys(state.lessonsDone).length > 0;
  return [anyLesson, ...WEEKS.map((_, w) => weekComplete(w))];
}

const RIBBONS = [

  { id: "halfway", title: "Halfway Harvest", desc: "Finish four full weeks. The silo is half full.", color: "#c98a12", test: () => [0,1,2,3].every(weekComplete) },
  { id: "early", title: "Early Riser", desc: "Finish a lesson before its scheduled day.", color: "#f4c542", test: () => Object.entries(state.lessonsDone).some(([i, d]) => d < iso(addDays(parseISO(state.start), Number(i)))) },
  { id: "double", title: "Double Shift", desc: "Finish two or more lessons in one day.", color: "#b3372c", test: () => { const c = {}; return Object.values(state.lessonsDone).some(d => (c[d] = (c[d] || 0) + 1) >= 2); } },
  { id: "games", title: "Fair Games Winner", desc: "Get 100% in any field game.", color: "#6cbf7d", test: () => !!state.gamesPerfect },

  { id: "streak3", title: "Three Days of Rain", desc: "Study three days in a row.", color: "#3a7fb0", test: () => bestStreak() >= 3 },
  { id: "streak7", title: "Week of Sunshine", desc: "Study seven days in a row.", color: "#e0a526", test: () => bestStreak() >= 7 },
  { id: "streak21", title: "Steady Hand at the Plough", desc: "Study 21 days in a row.", color: "#6a4930", test: () => bestStreak() >= 21 },
  { id: "known25", title: "First Bushels", desc: "Harvest 25 cards.", color: "#4f9a55", test: () => knownCount() >= 25 },
  { id: "known75", title: "Bumper Crop", desc: "Harvest 75 cards.", color: "#2e6a3e", test: () => knownCount() >= 75 },
  { id: "knownAll", title: "Full Granary", desc: "Harvest every card in the course.", color: "#c98a12", test: () => knownCount() >= allCards().length },
  { id: "perfect", title: "Blue Ribbon at Market", desc: "Score 100% on a Market Day quiz.", color: "#2b5fa8", test: () => Object.values(state.market).some(s => s === 100) },

  { id: "champion", title: "County Fair Champion", desc: "Complete all eight weeks.", color: "#2b5fa8", test: () => WEEKS.every((_, w) => weekComplete(w)) }
];
function quietRibbons() { RIBBONS.forEach(r => { if (r.test()) state.ribbons[r.id] = state.ribbons[r.id] || iso(new Date()); }); }
function checkRibbons() {
  const fresh = [];
  RIBBONS.forEach(r => { if (!state.ribbons[r.id] && r.test()) { state.ribbons[r.id] = iso(new Date()); fresh.push(r); } });
  fresh.forEach((r, k) => setTimeout(() => celebrate(r), k * 2600));
}

/* ================= Celebration ================= */
let toastTimer;
function celebrate(r) {
  const t = document.getElementById("toast");
  t.innerHTML = `${art("ribbon", r.color)}<div><b>${r.title}</b><span>${r.desc}</span></div>`;
  t.classList.add("show");
  if (r.sound !== false) Sound.play(/^week/.test(r.id || "") ? "moo" : "fanfare");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2400);
  burst();
}
function burst() {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = document.getElementById("burst"), ctx = c.getContext("2d");
  c.width = innerWidth; c.height = innerHeight;
  const cols = ["#e0a526", "#4f9a55", "#c8352a", "#f4c542", "#6cbf7d"];
  const ps = Array.from({ length: 70 }, () => ({ x: innerWidth / 2, y: innerHeight * .7, vx: (Math.random() - .5) * 12, vy: -Math.random() * 13 - 4, r: Math.random() * Math.PI, c: cols[Math.floor(Math.random() * cols.length)], s: 5 + Math.random() * 6 }));
  let f = 0;
  (function tick() {
    ctx.clearRect(0, 0, c.width, c.height);
    ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .35; p.r += .15; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.beginPath(); ctx.ellipse(0, 0, p.s, p.s / 2.4, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore(); });
    if (++f < 90) requestAnimationFrame(tick); else ctx.clearRect(0, 0, c.width, c.height);
  })();
}

/* ================= Rendering ================= */
let view = { day: null, card: 0, flipped: false, mode: "lesson", quiz: null, greenhouse: null };
function todayIndex() { return Math.max(0, Math.min(TOTAL_DAYS - 1, daysBetween(parseISO(state.start), new Date()))); }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function renderFarm() {
  const u = farmUnlocks();
  const next = BUILDS.findIndex((_, i) => !u[i]);
  document.getElementById("farm").innerHTML = farmSVG(u) + `<span class="farm-cap">${next === -1 ? "Every building is up. Champion farm!" : "Next to build: " + BUILDS[next].label}</span>`;

function renderStats() {
  const total = allCards().length, known = knownCount();

  const dayNo = daysBetween(parseISO(state.start), new Date()) + 1;
  document.getElementById("stats").innerHTML = `

function renderToday() {
  const el = document.getElementById("panel-today");
  if (view.day == null) view.day = todayIndex();

  const date = addDays(parseISO(state.start), view.day);
  const isToday = view.day === todayIndex();
  let status = "";
  if (view.day > todayIndex()) status += `<span class="chip market">Working ahead</span>`;
  if (info.kind === "lesson" && state.lessonsDone[view.day]) status += `<span class="chip done">Completed ✓</span>`;
  if (info.kind === "market" && state.market[info.w] != null) status += `<span class="chip done">Market score ${state.market[info.w]}%</span>`;
  const head = `
    <div class="lesson-head">
      <div class="when"><span class="eyebrow">Week ${info.w + 1} · ${DAY_NAMES[info.dow]} ${fmt(date)}${isToday ? " · today" : ""}</span>${status}</div>
      <h2>${info.kind === "lesson" ? esc(info.lesson.title) : info.kind === "market" ? "Market Day: " + esc(info.week.title) : "Fallow day"}</h2>
      <div class="daynav">
        <button class="btn" id="prevDay" ${view.day === 0 ? "disabled" : ""}>Previous day</button>
        <button class="btn" id="goToday" ${isToday ? "disabled" : ""}>Today</button>

function lessonHTML(info) {

function navHTML(cards, cur) {

function marketHTML(info) {

    return `<div class="done-card">${art("ribbon", pct === 100 ? "#2b5fa8" : pct >= 80 ? "#b3372c" : "#c98a12")}

function makeQuiz(w, pool) {
  const shuffled = pool.slice().sort(() => Math.random() - .5).slice(0, Math.min(12, pool.length));
  const items = shuffled.map(card => {
    const others = pool.filter(c => c.id !== card.id).sort(() => Math.random() - .5).slice(0, 3);

  });
  return { w, items, idx: 0, right: 0, answered: false };

function wireToday(info) {
  const $ = id => document.getElementById(id);
  const go = d => { view = { day: d, card: 0, flipped: false, mode: "lesson", quiz: null, greenhouse: null }; renderToday(); };

  if (info.kind === "lesson" && view.mode !== "greenhouse") {
    const n = info.lesson.cards.length;
    const move = k => { view.card = (k + n) % n; view.flipped = false; renderToday(); };

    $("nextCard").onclick = () => move(view.card + 1);
    document.querySelectorAll("[data-card]").forEach(b => b.onclick = () => move(Number(b.dataset.card)));
    keyNav = { prev: () => move(view.card - 1), next: () => move(view.card + 1) };
    if ($("markDone")) $("markDone").onclick = () => {
      state.lessonsDone[view.day] = iso(new Date()); state.xp += 20;
      markActive(); save(); Sound.play("rooster");
      celebrate({ sound: false, title: "Lesson complete!", desc: `${info.lesson.title} is in the barn. +20 bushels.`, color: "#4f9a55" });
      renderAll();
      setTimeout(() => { checkRibbons(); save(); renderAll(); }, 2600);
    };
    if ($("undoDone")) $("undoDone").onclick = () => { delete state.lessonsDone[view.day]; state.xp = Math.max(0, state.xp - 20); save(); renderAll(); };
  } else keyNav = null;
  if ($("known")) $("known").onclick = () => rate("known", info);
  if ($("growing")) $("growing").onclick = () => rate("growing", info);
  if ($("openGreenhouse")) $("openGreenhouse").onclick = () => {

  };
  if ($("leaveGreenhouse")) $("leaveGreenhouse").onclick = () => { view.mode = "lesson"; view.greenhouse = null; view.flipped = false; renderToday(); };
  document.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(Number(b.dataset.k), info));
  if ($("keepGoing")) $("keepGoing").onclick = () => { go(Number($("keepGoing").dataset.to)); window.scrollTo({ top: document.getElementById("panel-today").offsetTop - 20, behavior: "smooth" }); };
  if ($("retryQuiz")) $("retryQuiz").onclick = () => { view.quiz = null; renderToday(); };
}

function rate(r, info) {
  Sound.play(r === "known" ? "pop" : "seed");
  if (view.mode === "greenhouse") {
    const c = view.greenhouse.cards[view.greenhouse.idx];
    if (r === "known") { state.cards[c.id] = "known"; state.rescued = (state.rescued || 0) + 1; state.xp += 3; }
    view.greenhouse.idx++; view.flipped = false;
  } else {
    const cards = info.lesson.cards, c = cards[view.card];
    const before = state.cards[c.id];
    state.cards[c.id] = r;
    if (r === "known" && before !== "known") state.xp += 5;
    view.card = (view.card + 1) % cards.length; view.flipped = false;
  }
  markActive(); checkRibbons(); save(); renderAll();
}
function answer(k, info) {
  const q = view.quiz, it = q.items[q.idx];
  if (q.answered) return;
  q.answered = true;
  const ok = it.opts[k].id === it.card.id;
  if (ok) { q.right++; state.xp += 5; }
  Sound.play(ok ? "register" : "buzz");
  document.querySelectorAll(".opt").forEach((b, j) => { b.disabled = true; if (it.opts[j].id === it.card.id) b.classList.add("right"); else if (j === k) b.classList.add("wrong"); });
  setTimeout(() => {
    q.idx++; q.answered = false;
    if (q.idx >= q.items.length) {
      const pct = Math.round(q.right / q.items.length * 100);
      if (pct >= 80) state.market[info.w] = Math.max(state.market[info.w] || 0, pct);
      markActive(); checkRibbons(); save(); renderAll();
    } else { save(); renderToday(); renderStats(); }
  }, ok ? 650 : 1400);
}

/* Shared flip wiring for any panel holding a #packet. */
function wirePacket(root, setFlipped, getFlipped) {
  const pk = root.querySelector("#packet");
  if (!pk) return;
  const flip = () => { setFlipped(!getFlipped()); pk.classList.toggle("flipped", getFlipped()); Sound.play("flip"); };
  pk.onclick = e => { if (e.target.closest("a, .card-actions")) return; flip(); };
  pk.onkeydown = e => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); flip(); } };
}

/* ================= Sound ================= */
const Sound = (() => {
  let on = true, ctx = null;
  try { on = localStorage.getItem("harvest-ledger-sound") !== "off"; } catch (e) {}
  function ac() {
    if (!ctx) { const A = window.AudioContext || window.webkitAudioContext; if (!A) return null; ctx = new A(); }
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  function tone(type, f0, f1, dur, vol, at, filter) {
    const c = ac(); if (!c) return;

    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + Math.min(.05, dur / 4)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    let node = o;
    if (filter) { const f = c.createBiquadFilter(); f.type = filter[0]; f.frequency.value = filter[1]; o.connect(f); node = f; }
    node.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + .05);
  }
  function noise(dur, vol, at, hp) {
    const c = ac(); if (!c) return;
    const t = c.currentTime + (at || 0);
    const buf = c.createBuffer(1, Math.floor(c.sampleRate * dur), c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = buf; f.type = "highpass"; f.frequency.value = hp || 2000; g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
  }
  const fx = {
    flip: () => noise(.09, .18, 0, 2500),
    pop: () => { tone("sine", 660, 990, .12, .25); tone("sine", 990, 1320, .14, .18, .08); },
    seed: () => tone("triangle", 330, 260, .18, .2),
    moo: () => { tone("sawtooth", 150, 105, 1.1, .22, 0, ["lowpass", 700]); tone("sawtooth", 152, 108, 1.1, .12, .02, ["lowpass", 500]); },
    rooster: () => { [[520, 900, .14], [900, 760, .12], [760, 1150, .22], [1150, 640, .45]].reduce((at, [a, b, d]) => { tone("square", a, b, d, .09, at, ["bandpass", 1200]); return at + d * .9; }, 0); },
    register: () => { noise(.06, .2, 0, 4000); tone("sine", 1318, 1318, .5, .2, .05); tone("sine", 1760, 1760, .6, .15, .12); },
    buzz: () => tone("square", 140, 110, .28, .08, 0, ["lowpass", 900]),
    fanfare: () => { [523, 659, 784, 1047].forEach((f, i) => tone("triangle", f, f, .22, .2, i * .12)); }
  };
  return {
    get on() { return on; },
    toggle() { on = !on; try { localStorage.setItem("harvest-ledger-sound", on ? "on" : "off"); } catch (e) {} if (on) fx.pop(); return on; },
    play(name) { if (on && fx[name]) try { fx[name](); } catch (e) {} }
  };
})();
