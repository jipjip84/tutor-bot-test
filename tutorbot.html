<title>Harvest Ledger</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Courier+Prime:wght@400;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: a farm almanac. Growing farm scene up top, seed-packet flash cards in the middle, planting calendar and fair ribbons below. */
:root {
  --bg: #eef2e6;
  --paper: #fbfbf4;
  --ink: #1e2a1c;
  --muted: #5a6955;
  --line: #d3dbc7;
  --field: #2e6a3e;
  --field-ink: #ffffff;
  --wheat: #c98a12;
  --wheat-soft: #f6e6bd;
  --barn: #b3372c;
  --sky: #cfe5f0;
  --sky-2: #e9f3f6;
  --soil: #6a4930;
  --good: #2e6a3e;
  --warn: #b06d00;
  --font-display: "Alfa Slab One", "Rockwell", "Roboto Slab", Georgia, serif;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --font-mono: "Courier Prime", "Courier New", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111813; --paper: #1a241c; --ink: #e6ede0; --muted: #9dad97; --line: #2e3d30;
    --field: #6cbf7d; --field-ink: #0f1a12; --wheat: #f0b640; --wheat-soft: #3a2f16; --barn: #e46a5e;
    --sky: #1c3242; --sky-2: #223a4b; --soil: #a37b5b; --good: #6cbf7d; --warn: #f0b640;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111813; --paper: #1a241c; --ink: #e6ede0; --muted: #9dad97; --line: #2e3d30;
  --field: #6cbf7d; --field-ink: #0f1a12; --wheat: #f0b640; --wheat-soft: #3a2f16; --barn: #e46a5e;
  --sky: #1c3242; --sky-2: #223a4b; --soil: #a37b5b; --good: #6cbf7d; --warn: #f0b640;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 1040px; margin: 0 auto; display: grid; gap: 22px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; text-wrap: balance; margin: 0; letter-spacing: .01em; }
h1 { font-size: clamp(1.9rem, 4.5vw, 2.8rem); line-height: 1.05; }
h2 { font-size: 1.45rem; line-height: 1.15; }
h3 { font-size: 1.1rem; }
p { margin: 0; }
.eyebrow { font-family: var(--font-mono); font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--wheat); outline-offset: 2px; }

/* ---------- Header + farm ---------- */
header.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; }
header.top .intro { display: grid; gap: 6px; min-width: 0; }
header.top .intro p { color: var(--muted); max-width: 60ch; }
.farm { position: relative; border-radius: 14px; overflow: hidden; border: 2px solid var(--ink); background: var(--sky); }
.farm svg { display: block; width: 100%; height: auto; }
.farm .locked { opacity: .16; filter: grayscale(1); }
.farm .unlocked { animation: rise .7s cubic-bezier(.2,1.4,.4,1) both; }
@keyframes rise { from { transform: translateY(12px); opacity: .2; } to { transform: none; opacity: 1; } }
.farm-cap { position: absolute; left: 12px; bottom: 10px; background: var(--paper); color: var(--ink); border: 2px solid var(--ink); border-radius: 999px; padding: 4px 12px; font-family: var(--font-mono); font-size: .8rem; }

.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.stat { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 2px; }
.stat b { font-family: var(--font-display); font-weight: 400; font-size: 1.6rem; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat span { font-size: .85rem; color: var(--muted); }
.bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; background: var(--field); border-radius: 99px; transition: width .5s; }

/* ---------- Tabs ---------- */
nav.tabs { display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 2px solid var(--ink); }
nav.tabs button { background: transparent; border: 2px solid transparent; border-bottom: 0; padding: 8px 16px; border-radius: 10px 10px 0 0; color: var(--muted); font-weight: 700; position: relative; top: 2px; }
nav.tabs button[aria-selected="true"] { background: var(--paper); color: var(--ink); border-color: var(--ink); border-bottom: 2px solid var(--paper); }
.panel { display: grid; gap: 20px; }

/* ---------- Today ---------- */
.today { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 22px; align-items: start; }
.lesson-head { display: grid; gap: 6px; }
.lesson-head .when { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: .78rem; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper); color: var(--muted); }
.chip.done { background: var(--field); color: var(--field-ink); border-color: var(--field); }
.chip.market { background: var(--wheat-soft); color: var(--ink); border-color: var(--wheat); }
.daynav { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 2px solid var(--ink); background: var(--paper); color: var(--ink); border-radius: 999px; padding: 6px 16px; font-weight: 700; }
.btn:hover { background: var(--sky-2); }
.btn.primary { background: var(--field); color: var(--field-ink); border-color: var(--field); }
.btn.gold { background: var(--wheat); color: #1e1a10; border-color: var(--wheat); }
.btn:disabled { opacity: .45; cursor: not-allowed; }

/* Seed packet card */
.deck { display: grid; gap: 14px; }
.packet { perspective: 1400px; cursor: pointer; }
.packet-inner { position: relative; transition: transform .55s cubic-bezier(.3,.7,.2,1); transform-style: preserve-3d; min-height: 430px; }
.packet.flipped .packet-inner { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: var(--paper); border: 2px solid var(--ink); border-radius: 6px 6px 14px 14px; display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; }
.face::before { content: ""; height: 14px; background: repeating-linear-gradient(90deg, var(--ink) 0 6px, transparent 6px 12px); opacity: .18; }
.face.back { transform: rotateY(180deg); }
.packet-art { background: var(--sky); border-block: 2px solid var(--ink); display: grid; place-items: center; padding: 10px; }
.packet-art svg { width: min(220px, 60%); height: auto; }
.face-body { padding: 16px 20px; display: grid; gap: 8px; align-content: start; }
.face-foot { display: flex; justify-content: space-between; gap: 10px; padding: 8px 20px 12px; font-family: var(--font-mono); font-size: .75rem; color: var(--muted); border-top: 1px dashed var(--line); flex-wrap: wrap; }
.term { font-family: var(--font-display); font-size: clamp(1.5rem, 3.6vw, 2.1rem); line-height: 1.1; text-wrap: balance; }
.prompt-line { color: var(--muted); }
.back-grid { display: grid; gap: 12px; padding: 18px 20px; align-content: start; overflow-y: auto; }
.back-grid .def { font-size: 1.08rem; max-width: 62ch; }
.onfarm { background: var(--wheat-soft); border: 1px solid var(--wheat); border-radius: 10px; padding: 10px 12px; display: grid; grid-template-columns: 54px minmax(0,1fr); gap: 10px; align-items: center; }
.onfarm svg { width: 54px; height: 54px; }
.onfarm b { font-family: var(--font-mono); font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; display: block; color: var(--muted); }
.rate { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.cardnav { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.dots { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.dots button { width: 16px; height: 16px; padding: 0; border-radius: 50%; border: 2px solid var(--ink); background: transparent; }
.dots button.known { background: var(--field); border-color: var(--field); }
.dots button.growing { background: var(--wheat); border-color: var(--wheat); }
.dots button.cur { outline: 2px solid var(--wheat); outline-offset: 2px; }
.complete { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 14px; align-items: center; background: var(--paper); border: 2px dashed var(--line); border-radius: 14px; padding: 12px 16px; }
.complete.done { border: 2px solid var(--field); background: var(--wheat-soft); }
.complete svg { width: 56px; height: 56px; }
.complete b { font-family: var(--font-display); font-weight: 400; font-size: 1.1rem; display: block; }
.complete span { color: var(--muted); font-size: .9rem; }
.complete-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.linkish { background: none; border: 0; color: var(--muted); text-decoration: underline; padding: 4px; }
.libbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.libbar select { font: inherit; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; background: var(--paper); color: var(--ink); }
.library { max-width: 720px; width: 100%; margin: 0 auto; display: grid; gap: 14px; }
.hint { text-align: center; color: var(--muted); font-size: .85rem; }

.side { display: grid; gap: 14px; }
.box { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 8px; }
.box h3 { font-size: 1rem; }
.box ol, .box ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.box .small { font-size: .88rem; color: var(--muted); }

.done-card { background: var(--paper); border: 2px solid var(--ink); border-radius: 14px; padding: 22px; display: grid; gap: 12px; justify-items: center; text-align: center; }
.done-card svg { width: 120px; height: 120px; }

/* Market day quiz */
.quiz { background: var(--paper); border: 2px solid var(--ink); border-radius: 14px; padding: 18px 20px; display: grid; gap: 14px; }
.quiz .q { font-size: 1.1rem; max-width: 64ch; }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
.opt { text-align: left; border: 2px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 10px; padding: 10px 12px; font-weight: 600; }
.opt:hover:not(:disabled) { border-color: var(--ink); }
.opt.right { border-color: var(--good); background: var(--field); color: var(--field-ink); }
.opt.wrong { border-color: var(--barn); text-decoration: line-through; }

/* ---------- Calendar ---------- */
.weeks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.week { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: grid; grid-template-rows: auto 1fr; }
.week-head { display: grid; grid-template-columns: 72px minmax(0,1fr); gap: 12px; align-items: center; padding: 12px 14px; background: var(--sky-2); border-bottom: 1px solid var(--line); }
.week-head svg { width: 72px; height: 60px; }
.week-head .eyebrow { font-size: .7rem; }
.week-head p { font-size: .85rem; color: var(--muted); }
.week.complete .week-head { background: var(--wheat-soft); }
.days { list-style: none; margin: 0; padding: 6px 0; display: grid; }
.days li button { width: 100%; display: grid; grid-template-columns: 74px minmax(0,1fr) auto; gap: 10px; align-items: center; text-align: left; background: transparent; border: 0; padding: 6px 14px; color: var(--ink); }
.days li button:hover { background: var(--bg); }
.days li .d { font-family: var(--font-mono); font-size: .76rem; color: var(--muted); }
.days li .t { font-size: .92rem; min-width: 0; }
.days li.today-row button { background: var(--sky-2); font-weight: 700; }
.mark { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: .7rem; }
.mark.ok { background: var(--field); border-color: var(--field); color: var(--field-ink); }
.mark.rest { border-style: dashed; }

/* ---------- Ribbons ---------- */
.ribbons { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
.ribbon { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; grid-template-columns: 56px minmax(0,1fr); gap: 12px; align-items: center; }
.ribbon svg { width: 56px; height: 72px; }
.ribbon.locked svg { opacity: .25; filter: grayscale(1); }
.ribbon.locked h3 { color: var(--muted); }
.ribbon p { font-size: .85rem; color: var(--muted); }
.ribbon h3 { font-size: .98rem; }

.settings { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; font-size: .9rem; color: var(--muted); }
.settings input { font: inherit; border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; background: var(--paper); color: var(--ink); }
.saved { font-family: var(--font-mono); font-size: .75rem; color: var(--muted); }

/* Card extras */
.btn.small { padding: 4px 12px; font-size: .85rem; text-decoration: none; display: inline-flex; align-items: center; }
.card-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.modal { position: fixed; inset: 0; z-index: 60; background: rgba(15, 22, 16, .55); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal-card { position: relative; background: var(--paper); color: var(--ink); border: 2px solid var(--ink); border-radius: 16px; width: min(760px, 100%); max-height: 100%; overflow-y: auto; padding: 18px 20px; display: grid; gap: 12px; }
.modal-card #modalBody { display: grid; gap: 12px; min-width: 0; }
.modal-x { position: absolute; top: 12px; right: 12px; }
.anim { background: var(--sky); border: 2px solid var(--ink); border-radius: 12px; overflow-x: auto; }
.anim-svg { display: block; width: 100%; height: auto; }
.anim .st { opacity: .14; transition: opacity .6s, transform .6s; transform-box: fill-box; transform-origin: center; }
.anim .st.on { opacity: 1; }
.anim .st.cur { transform: scale(1.06); }
.anim .ring { fill: var(--paper); stroke: var(--line); stroke-width: 3; }
.anim .st.cur .ring { stroke: var(--wheat); stroke-width: 5; }
.anim .band { fill: var(--paper); stroke: var(--ink); stroke-width: 2; }
.anim .st.cur .band { fill: var(--wheat-soft); stroke: var(--wheat); stroke-width: 4; }
.anim .lbl { font-family: var(--font-body); font-weight: 700; font-size: 19px; fill: var(--ink); }
.anim .ar { stroke: var(--ink); stroke-width: 4; stroke-dasharray: 400; stroke-dashoffset: 400; opacity: 0; transition: stroke-dashoffset .9s ease, opacity .2s; }
.anim .ar.on { stroke-dashoffset: 0; opacity: 1; }
.anim .ah { fill: var(--ink); }
.anim-cap { display: grid; gap: 2px; min-height: 3.2em; }
.anim-cap b { font-family: var(--font-display); font-weight: 400; font-size: 1.2rem; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chat { display: grid; gap: 10px; max-height: 340px; overflow-y: auto; padding: 4px; }
.msg { padding: 10px 12px; border-radius: 12px; max-width: 88%; white-space: pre-wrap; }
.msg.me { justify-self: end; background: var(--field); color: var(--field-ink); }
.msg.bot { justify-self: start; background: var(--wheat-soft); border: 1px solid var(--wheat); }
.msg.err { border-color: var(--barn); }
.ask { display: flex; gap: 8px; flex-wrap: wrap; }
.ask input { flex: 1 1 200px; min-width: 0; font: inherit; border: 2px solid var(--line); border-radius: 999px; padding: 6px 14px; background: var(--bg); color: var(--ink); }
.small { font-size: .88rem; color: var(--muted); }

/* Field games */
.games { display: grid; gap: 16px; }
.game-menu { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.game-tile { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 14px; align-items: center; text-align: left; background: var(--paper); color: var(--ink); border: 2px solid var(--line); border-radius: 14px; padding: 14px; }
.game-tile:hover { border-color: var(--ink); }
.game-tile svg { width: 72px; height: 72px; }
.game-tile b { font-family: var(--font-display); font-weight: 400; font-size: 1.15rem; display: block; }
.game-tile span span { color: var(--muted); font-size: .9rem; }
.pool { display: flex; flex-wrap: wrap; gap: 8px; min-height: 44px; }
.chip-item { border: 2px solid var(--ink); background: var(--paper); color: var(--ink); border-radius: 999px; padding: 6px 14px; font-weight: 600; cursor: grab; }
.chip-item.sel { background: var(--wheat); border-color: var(--wheat); color: #1e1a10; }
.chip-item.shake { animation: shake .4s; border-color: var(--barn); }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.bins { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.bin { background: var(--paper); border: 2px solid var(--ink); border-radius: 0 0 12px 12px; padding: 0 12px 12px; display: grid; gap: 8px; align-content: start; min-height: 150px; cursor: pointer; }
.bin-roof { height: 16px; margin: 0 -12px; background: var(--barn); clip-path: polygon(0 100%, 50% 0, 100% 100%); }
.bin.over { background: var(--wheat-soft); }
.bin b { font-size: .95rem; }
.bin-items { display: flex; flex-wrap: wrap; gap: 6px; }
.placed { background: var(--field); color: var(--field-ink); border-radius: 999px; padding: 2px 10px; font-size: .82rem; }
.placed.late { background: var(--wheat); color: #1e1a10; }
.feedback { padding: 10px 12px; border-radius: 10px; }
.feedback.ok { background: var(--field); color: var(--field-ink); }
.feedback.no { background: var(--wheat-soft); border: 1px solid var(--wheat); }

/* Toast + burst */
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 140%); background: var(--ink); color: var(--paper); border-radius: 14px; padding: 12px 18px; display: flex; gap: 12px; align-items: center; max-width: min(92vw, 460px); transition: transform .4s cubic-bezier(.2,1.3,.4,1); z-index: 50; }
.toast.show { transform: translate(-50%, 0); }
.toast svg { width: 40px; height: 52px; flex: none; }
.toast b { font-family: var(--font-display); font-weight: 400; display: block; }
.burst { position: fixed; inset: 0; pointer-events: none; z-index: 40; }

@media (max-width: 860px) {
  .today { grid-template-columns: minmax(0, 1fr); }
  .weeks { grid-template-columns: minmax(0, 1fr); }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 520px) {
  .opts { grid-template-columns: minmax(0,1fr); }
  .game-menu { grid-template-columns: minmax(0, 1fr); }
  .complete { grid-template-columns: 44px minmax(0, 1fr); }
  .complete svg { width: 44px; height: 44px; }
  .complete .btn, .complete .linkish, .complete-actions { grid-column: 1 / -1; justify-content: flex-start; }
  .cardnav .btn { padding-inline: 10px; }
  .packet-inner { min-height: 470px; }
  .farm-cap { font-size: .68rem; left: 8px; bottom: 6px; padding: 2px 8px; }
  .days li button { grid-template-columns: 62px minmax(0,1fr) auto; padding-inline: 10px; }
}
@media (prefers-reduced-motion: reduce) {
  .packet-inner, .toast, .bar i { transition: none; }
  .farm .unlocked { animation: none; }
}
</style>

<div class="wrap">
  <header class="top">
    <div class="intro">
      <span class="eyebrow" id="bookLine">Principles of Management · 8-week planting season</span>
      <h1>Harvest Ledger</h1>
      <p>Daily seed-packet flash cards from your textbook. Finish a week and something new gets built on your farm.</p>
    </div>
    <div class="settings">
      <label for="startDate">Season started</label>
      <input type="date" id="startDate">
      <span class="saved" id="savedState">Saved on this device</span>
      <button class="btn small" id="soundToggle" aria-pressed="true">Sound on</button>
    </div>
  </header>

  <div class="farm" id="farm" aria-label="Your farm. New buildings appear as you complete weeks."></div>

  <div class="stats" id="stats"></div>

  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-today" aria-selected="true" data-tab="today">Today</button>
    <button role="tab" id="tab-calendar" aria-selected="false" data-tab="calendar">Planting calendar</button>
    <button role="tab" id="tab-library" aria-selected="false" data-tab="library">Card barn</button>
    <button role="tab" id="tab-games" aria-selected="false" data-tab="games">Field games</button>
    <button role="tab" id="tab-ribbons" aria-selected="false" data-tab="ribbons">Ribbons</button>
  </nav>

  <section class="panel" id="panel-today"></section>
  <section class="panel" id="panel-calendar" hidden></section>
  <section class="panel" id="panel-library" hidden></section>
  <section class="panel" id="panel-games" hidden></section>
  <section class="panel" id="panel-ribbons" hidden></section>
</div>

<div class="modal" id="modal" hidden><div class="modal-card" role="dialog" aria-modal="true" aria-label="Card extras"><button class="btn small modal-x" id="modalClose">Close</button><div id="modalBody"></div></div></div>
