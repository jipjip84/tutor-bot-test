}
function renderStats() {
  const total = allCards().length, known = knownCount();
  const weeksDone = WEEKS.filter((_, w) => weekComplete(w)).length;
  const dayNo = daysBetween(parseISO(state.start), new Date()) + 1;
  document.getElementById("stats").innerHTML = `
    <div class="stat"><b>${state.xp}</b><span>Bushels earned</span></div>
    <div class="stat"><b>${streak()}</b><span>Day streak · best ${bestStreak()}</span></div>
    <div class="stat"><b>${known}/${total}</b><span>Cards harvested</span><div class="bar"><i style="width:${total ? known / total * 100 : 0}%"></i></div></div>
    <div class="stat"><b>${weeksDone}/${WEEKS.length}</b><span>Weeks complete · day ${Math.max(1, Math.min(dayNo, TOTAL_DAYS))} of ${TOTAL_DAYS}</span><div class="bar"><i style="width:${weeksDone / WEEKS.length * 100}%"></i></div></div>`;
}

function renderToday() {
  const el = document.getElementById("panel-today");
  if (view.day == null) view.day = todayIndex();
  const info = dayInfo(view.day);
  const date = addDays(parseISO(state.start), view.day);
  const isToday = view.day === todayIndex();
  let status = "";
  if (info.kind === "lesson" && state.lessonsDone[view.day]) status = `<span class="chip done">Harvested</span>`;
  if (info.kind === "market" && state.market[info.w] != null) status = `<span class="chip done">Market score ${state.market[info.w]}%</span>`;
  const head = `
    <div class="lesson-head">
      <div class="when"><span class="eyebrow">Week ${info.w + 1} · ${DAY_NAMES[info.dow]} ${fmt(date)}${isToday ? " · today" : ""}</span>${status}</div>
      <h2>${info.kind === "lesson" ? esc(info.lesson.title) : info.kind === "market" ? "Market Day: " + esc(info.week.title) : "Fallow day"}</h2>
      <div class="daynav">
        <button class="btn" id="prevDay" ${view.day === 0 ? "disabled" : ""}>Previous day</button>
        <button class="btn" id="goToday" ${isToday ? "disabled" : ""}>Today</button>
        <button class="btn" id="nextDay" ${view.day >= TOTAL_DAYS - 1 ? "disabled" : ""}>Next day</button>
      </div>
    </div>`;
  let main = "";
  if (view.mode === "greenhouse") main = greenhouseHTML();
  else if (info.kind === "lesson") main = lessonHTML(info);
  else if (info.kind === "market") main = marketHTML(info);
  else main = restHTML(info);
  el.innerHTML = `<div class="today"><div class="deck">${head}${main}</div><aside class="side">${sideHTML(info)}</aside></div>`;
  wireToday(info);
}

function cardHTML(c, flipped, kicker) {
  return `<div class="packet ${flipped ? "flipped" : ""}" id="packet" tabindex="0" role="button" aria-label="Flash card. Press to flip.">
    <div class="packet-inner">
      <div class="face front">
        <div class="packet-art">${art(c.art)}</div>
        <div class="face-body"><span class="eyebrow">${esc(kicker)}</span><div class="term">${esc(c.term)}</div><p class="prompt-line">Say the definition out loud, then flip the packet.</p></div>
        <div class="face-foot"><span>Lot ${esc(c.id)}</span><span>Textbook §${esc(c.section)}</span></div>
      </div>
      <div class="face back">
        <div class="back-grid">
          <span class="eyebrow">${esc(c.term)}</span>
          <p class="def">${esc(c.definition)}</p>
          <div class="onfarm">${art(c.art)}<div><b>On the farm</b>${esc(c.farm)}</div></div>
        </div>
        <div class="face-foot"><span>Lot ${esc(c.id)}</span><span>Textbook §${esc(c.section)}</span></div>
      </div>
    </div>
  </div>`;
}
function dotsHTML(cards, cur) {
  return `<div class="dots" aria-hidden="true">${cards.map((c, k) => `<i class="${state.cards[c.id] || ""} ${k === cur ? "cur" : ""}"></i>`).join("")}</div>`;
}
function lessonHTML(info) {
  const cards = info.lesson.cards;
  if (view.card >= cards.length) {
    const known = cards.filter(c => state.cards[c.id] === "known").length;
    return `<div class="done-card">${art(known === cards.length ? "basket" : "seedling")}
      <h2>${known === cards.length ? "Clean harvest!" : "Day planted"}</h2>
      <p>You harvested ${known} of ${cards.length} cards today. ${known < cards.length ? "The rest are waiting in the greenhouse for review." : "Every packet is in the basket."}</p>
      <div class="rate"><button class="btn" id="again">Go through them again</button>${info.dow < 4 ? `<button class="btn primary" id="nextDay2">Peek at tomorrow</button>` : ""}</div></div>`;
  }
  const c = cards[view.card];
  return `${cardHTML(c, view.flipped, `${info.lesson.chapter} · card ${view.card + 1} of ${cards.length}`)}
    ${dotsHTML(cards, view.card)}
    <div class="rate">
      <button class="btn gold" id="growing" ${view.flipped ? "" : "disabled"}>Still growing</button>
      <button class="btn primary" id="known" ${view.flipped ? "" : "disabled"}>Harvested it</button>
    </div>
    <p class="hint">${view.flipped ? "Be honest. Still-growing cards come back in the greenhouse." : "Tap the packet or press the space bar to flip it."}</p>`;
}
function marketHTML(info) {
  const pool = info.week.days.flatMap(d => d.cards);
  if (!view.quiz || view.quiz.w !== info.w) view.quiz = makeQuiz(info.w, pool);
  const q = view.quiz;
  if (q.idx >= q.items.length) {
    const pct = Math.round(q.right / q.items.length * 100);
    return `<div class="done-card">${art("ribbon", pct === 100 ? "#2b5fa8" : pct >= 80 ? "#b3372c" : "#c98a12")}
      <h2>${pct === 100 ? "Blue ribbon!" : pct >= 80 ? "Red ribbon. Strong showing." : "Back to the field"}</h2>
      <p>You sold ${q.right} of ${q.items.length} crates at market (${pct}%). ${state.market[info.w] != null ? `Best score this week: ${state.market[info.w]}%.` : ""}</p>
      <div class="rate"><button class="btn" id="retryQuiz">Run the market again</button></div></div>`;
  }
  const it = q.items[q.idx];
  return `<div class="quiz">
    <span class="eyebrow">Crate ${q.idx + 1} of ${q.items.length} · ${q.right} sold</span>
    <p class="q">${esc(it.card.definition)}</p>
    <div class="opts">${it.opts.map((o, k) => `<button class="opt" data-k="${k}">${esc(o.term)}</button>`).join("")}</div>
    <p class="hint">Pick the term that matches. Each right answer earns 5 bushels.</p>
  </div>`;
}
function makeQuiz(w, pool) {
  const shuffled = pool.slice().sort(() => Math.random() - .5).slice(0, Math.min(12, pool.length));
  const items = shuffled.map(card => {
    const others = pool.filter(c => c.id !== card.id).sort(() => Math.random() - .5).slice(0, 3);
    return { card, opts: [card, ...others].sort(() => Math.random() - .5) };
  });
  return { w, items, idx: 0, right: 0, answered: false };
}
function restHTML(info) {
  const next = WEEKS[info.w + 1];
  return `<div class="done-card">${art("sun")}
    <h2>Let the field rest</h2>
    <p>Fallow days keep the soil rich. Take the day off, or tend the greenhouse if any cards are still growing.</p>
    ${next ? `<p><b>Coming up in week ${info.w + 2}:</b> ${esc(next.title)} (${esc(next.chapters)}). You'll build: ${esc(next.build)}.</p>` : `<p>That's the end of the season. Check your ribbons.</p>`}
  </div>`;
}
function greenhouseHTML() {
  const g = view.greenhouse;
  if (!g || g.idx >= g.cards.length) {
    return `<div class="done-card">${art("seedling")}<h2>Greenhouse tended</h2><p>${g && g.cards.length ? `You reviewed ${g.cards.length} cards.` : "Nothing is still growing. Lovely."}</p><div class="rate"><button class="btn" id="leaveGreenhouse">Back to today's lesson</button></div></div>`;
  }
  const c = g.cards[g.idx];
  return `${cardHTML(c, view.flipped, `Greenhouse · ${g.idx + 1} of ${g.cards.length}`)}
    <div class="rate">
      <button class="btn gold" id="growing" ${view.flipped ? "" : "disabled"}>Still growing</button>
      <button class="btn primary" id="known" ${view.flipped ? "" : "disabled"}>Harvested it</button>
      <button class="btn" id="leaveGreenhouse">Leave greenhouse</button>
    </div>`;
}
function sideHTML(info) {
  const growing = allCards().filter(c => state.cards[c.id] === "growing").length;
  const plan = info.kind === "lesson"
    ? `<ol><li>Read §${esc(info.lesson.sections.join(", §"))} in your textbook (15–20 min).</li><li>Flip today's ${info.lesson.cards.length} seed packets (10 min).</li><li>Explain one card to someone, or to a cow.</li></ol>`
    : info.kind === "market"
    ? `<ol><li>Skim your notes from this week (10 min).</li><li>Take the Market Day quiz (10 min).</li><li>Score 80% or more to earn the week's build.</li></ol>`
    : `<ul><li>Rest day. No new cards.</li><li>Optional: clear the greenhouse.</li></ul>`;
  return `
    <div class="box"><h3>Today's chores</h3>${plan}</div>
    <div class="box"><h3>This week's build</h3><div style="display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;align-items:center">${art(BUILDS[info.w + 1].key)}<div><b>${esc(info.week.build)}</b><p class="small">Finish all five lesson days and the Market Day quiz with 80% or better.</p></div></div></div>
    <div class="box"><h3>Greenhouse</h3><p class="small">${growing ? `${growing} card${growing === 1 ? " is" : "s are"} still growing. A quick review turns them into harvest.` : "No cards are waiting for review."}</p><button class="btn" id="openGreenhouse" ${growing ? "" : "disabled"}>Tend the greenhouse</button></div>`;
}

function wireToday(info) {
  const $ = id => document.getElementById(id);
  const go = d => { view = { day: d, card: 0, flipped: false, mode: "lesson", quiz: null, greenhouse: null }; renderToday(); };
  $("prevDay").onclick = () => go(view.day - 1);
  $("nextDay").onclick = () => go(view.day + 1);
  $("goToday").onclick = () => go(todayIndex());
  if ($("nextDay2")) $("nextDay2").onclick = () => go(view.day + 1);
  if ($("again")) $("again").onclick = () => { view.card = 0; view.flipped = false; renderToday(); };
  const pk = $("packet");
  if (pk) {
    const flip = () => { view.flipped = !view.flipped; pk.classList.toggle("flipped", view.flipped); ["growing", "known"].forEach(b => { if ($(b)) $(b).disabled = !view.flipped; }); document.querySelector(".hint") && (document.querySelector(".hint").textContent = view.flipped ? "Be honest. Still-growing cards come back in the greenhouse." : "Tap the packet or press the space bar to flip it."); };
    pk.onclick = flip;
    pk.onkeydown = e => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); flip(); } };
  }
  if ($("known")) $("known").onclick = () => rate("known", info);
  if ($("growing")) $("growing").onclick = () => rate("growing", info);
  if ($("openGreenhouse")) $("openGreenhouse").onclick = () => {
    view.mode = "greenhouse"; view.flipped = false;
    view.greenhouse = { cards: allCards().filter(c => state.cards[c.id] === "growing").sort(() => Math.random() - .5), idx: 0 };
    renderToday();
  };
  if ($("leaveGreenhouse")) $("leaveGreenhouse").onclick = () => { view.mode = "lesson"; view.greenhouse = null; view.flipped = false; renderToday(); };
  document.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(Number(b.dataset.k), info));
  if ($("retryQuiz")) $("retryQuiz").onclick = () => { view.quiz = null; renderToday(); };
}

function rate(r, info) {
  if (view.mode === "greenhouse") {
    const c = view.greenhouse.cards[view.greenhouse.idx];
    if (r === "known") { state.cards[c.id] = "known"; state.rescued = (state.rescued || 0) + 1; state.xp += 3; }
    view.greenhouse.idx++; view.flipped = false;
  } else {
    const cards = info.lesson.cards, c = cards[view.card];
    const before = state.cards[c.id];
    state.cards[c.id] = r;
    if (r === "known" && before !== "known") state.xp += 5;
    view.card++; view.flipped = false;
    if (view.card >= cards.length && !state.lessonsDone[view.day]) { state.lessonsDone[view.day] = iso(new Date()); state.xp += 20; }
  }
  markActive(); checkRibbons(); save(); renderAll();
}
function answer(k, info) {
  const q = view.quiz, it = q.items[q.idx];
  if (q.answered) return;
  q.answered = true;
  const ok = it.opts[k].id === it.card.id;
  if (ok) { q.right++; state.xp += 5; }
  document.querySelectorAll(".opt").forEach((b, j) => { b.disabled = true; if (it.opts[j].id === it.card.id) b.classList.add("right"); else if (j === k) b.classList.add("wrong"); });
  setTimeout(() => {
    q.idx++; q.answered = false;
    if (q.idx >= q.items.length) {
      const pct = Math.round(q.right / q.items.length * 100);
      if (pct >= 80) state.market[info.w] = Math.max(state.market[info.w] || 0, pct);
      markActive(); checkRibbons(); save(); renderAll();
    } else { save(); renderToday(); renderStats(); }
  }, ok ? 650 : 1400);
}

function renderCalendar() {
  const el = document.getElementById("panel-calendar");
  const start = parseISO(state.start), t = todayIndex();
  el.innerHTML = `<div class="weeks">${WEEKS.map((wk, w) => `
    <article class="week ${weekComplete(w) ? "complete" : ""}">
      <div class="week-head">${art(BUILDS[w + 1].key)}<div><span class="eyebrow">Week ${w + 1} · ${fmt(addDays(start, w * 7))}–${fmt(addDays(start, w * 7 + 6))}</span><h3>${esc(wk.title)}</h3><p>${esc(wk.chapters)} · builds the ${esc(wk.build.toLowerCase())}</p></div></div>
      <ul class="days">${Array.from({ length: 7 }, (_, dow) => {
        const i = w * 7 + dow, info = dayInfo(i);
        const label = info.kind === "lesson" ? info.lesson.title : info.kind === "market" ? "Market Day quiz" : "Fallow day (rest)";
        const ok = info.kind === "lesson" ? state.lessonsDone[i] : info.kind === "market" ? state.market[w] != null : false;
        return `<li class="${i === t ? "today-row" : ""}"><button data-day="${i}"><span class="d">${DAY_NAMES[dow]} ${fmt(addDays(start, i))}</span><span class="t">${esc(label)}</span><span class="mark ${ok ? "ok" : info.kind === "rest" ? "rest" : ""}">${ok ? "✓" : ""}</span></button></li>`;
      }).join("")}</ul>
    </article>`).join("")}</div>`;
  el.querySelectorAll("[data-day]").forEach(b => b.onclick = () => {
    view = { day: Number(b.dataset.day), card: 0, flipped: false, mode: "lesson", quiz: null, greenhouse: null };
    selectTab("today");
  });
}
function renderRibbons() {
  const el = document.getElementById("panel-ribbons");
  const got = RIBBONS.filter(r => state.ribbons[r.id]).length;
  el.innerHTML = `<p class="eyebrow">${got} of ${RIBBONS.length} ribbons pinned</p><div class="ribbons">${RIBBONS.map(r => {
    const on = !!state.ribbons[r.id];
    return `<div class="ribbon ${on ? "" : "locked"}">${art("ribbon", r.color)}<div><h3>${esc(r.title)}</h3><p>${esc(r.desc)}${on ? ` Won ${fmt(parseISO(state.ribbons[r.id]))}.` : ""}</p></div></div>`;
  }).join("")}</div>`;
}

function selectTab(name) {
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === name)));
  ["today", "calendar", "ribbons"].forEach(n => document.getElementById("panel-" + n).hidden = n !== name);
  renderAll();
}
function renderAll() { renderFarm(); renderStats(); renderToday(); renderCalendar(); renderRibbons(); }

document.querySelectorAll("nav.tabs button").forEach(b => b.onclick = () => selectTab(b.dataset.tab));
const sd = document.getElementById("startDate");
sd.value = state.start;
sd.onchange = () => { if (sd.value) { state.start = sd.value; view.day = null; save(); renderAll(); } };
document.getElementById("bookLine").textContent = `${COURSE.book} · 8-week planting season`;

renderAll();
connectStore().then(() => { sd.value = state.start; });
})();
</script>
