    cur = Math.max(0, Math.min(a.steps.length - 1, i));
    document.querySelectorAll(".anim .st").forEach(g => { const k = Number(g.dataset.i); g.classList.toggle("on", k <= cur); g.classList.toggle("cur", k === cur); });
    document.querySelectorAll(".anim .ar").forEach(l => l.classList.toggle("on", Number(l.dataset.i) <= cur));
    document.getElementById("animLabel").textContent = `${cur + 1}. ${a.steps[cur][0]}`;
    document.getElementById("animText").textContent = a.steps[cur][1];
    Sound.play("seed");
  };
  const stop = () => { clearInterval(animTimer); animTimer = null; playing = false; const b = document.getElementById("animPlay"); if (b) b.textContent = "Play"; };
  const play = () => {
    clearInterval(animTimer); playing = true; document.getElementById("animPlay").textContent = "Pause";
    if (cur >= a.steps.length - 1) cur = -1;
    show(cur + 1);
    animTimer = setInterval(() => { if (!document.getElementById("animPlay")) return clearInterval(animTimer); if (cur >= a.steps.length - 1) { stop(); Sound.play("pop"); } else show(cur + 1); }, 2400);
  };
  document.getElementById("animPlay").onclick = () => playing ? stop() : play();
  document.getElementById("animNext").onclick = () => { stop(); show(cur + 1); };
  document.getElementById("animBack").onclick = () => { stop(); show(cur - 1); };
  document.getElementById("animReplay").onclick = () => { cur = -1; play(); };
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) { stop(); show(0); } else play();
}

/* ================= Farm tutor (Claude) ================= */
let tutorApi = null;
function tutorReady() { return !!tutorApi; }
async function connectTutor() {
  if (!window.claude || !window.claude.use) return;
  try { tutorApi = await window.claude.use("sample"); } catch (e) { tutorApi = null; }
  if (tutorApi) renderAll();
}
function openTutor(c) {
  const chat = [];
  let busy = null;
  openModal(`<span class="eyebrow">Farm tutor · §${esc(c.section)}</span><h2>${esc(c.term)}</h2>
    <div class="chips">${["Explain it simply", "Give me another farm example", "Quiz me on this", "How does this connect to other ideas?"].map(q => `<button class="btn" data-q="${esc(q)}">${esc(q)}</button>`).join("")}</div>
    <div class="chat" id="chat" aria-live="polite"><p class="small">Ask anything about this concept. The tutor uses farm examples and keeps answers short.</p></div>
    <form class="ask" id="askForm"><label for="askInput" class="sr">Your question</label><input id="askInput" autocomplete="off" placeholder="Ask about ${esc(c.term)}…"><button class="btn primary" type="submit">Ask</button></form>`);
  const chatEl = document.getElementById("chat");
  const bubble = (who, text) => { const p = document.createElement("div"); p.className = "msg " + who; p.textContent = text; chatEl.appendChild(p); chatEl.scrollTop = chatEl.scrollHeight; return p; };
  const intro = `You are a warm, encouraging tutor for a student taking a Principles of Management course (textbook: ${COURSE.book}). The student loves farming, so explain with farm and agriculture examples. Keep every answer under 140 words, in plain sentences with no markdown headings. If asked to quiz, ask one question at a time and wait for the answer.

Concept: ${c.term} (textbook section ${c.section})
Definition: ${c.definition}
Farm example already shown on the card: ${c.farm}`;
  async function ask(q) {
    if (!q || busy) return;
    chatEl.querySelector(".small") && chatEl.querySelector(".small").remove();
    bubble("me", q);
    chat.push({ role: "user", content: chat.length ? q : intro + "\n\nStudent: " + q });
    const out = bubble("bot", "Thinking…");
    busy = new AbortController();
    try {
      const r = await tutorApi(chat, { onText: u => { out.textContent = u.text; chatEl.scrollTop = chatEl.scrollHeight; }, signal: busy.signal, modelTier: "quick", cache: false });
      out.textContent = r.text; chat.push({ role: "assistant", content: r.text });
      state.tutorQs = (state.tutorQs || 0) + 1; markActive(); checkRibbons(); save(); renderStats();
    } catch (e) {
      chat.pop();
      out.textContent = e && e.code === "not_granted" ? "The tutor needs permission to use Claude on this page. Allow it from the page's permissions, then ask again."
        : e && e.code === "rate_limited" ? "The tutor needs a short break. Try again in a minute."
        : e && e.name === "AbortError" ? "Stopped." : "The tutor couldn't answer just now. Try again in a moment.";
      out.classList.add("err");
    } finally { busy = null; }
  }
  document.querySelectorAll("[data-q]").forEach(b => b.onclick = () => ask(b.dataset.q));
  document.getElementById("askForm").onsubmit = e => { e.preventDefault(); const i = document.getElementById("askInput"); const q = i.value.trim(); i.value = ""; ask(q); };
  modalOnClose = () => { if (busy) busy.abort(); };
}

/* ================= Modal ================= */
let modalOnClose = null, lastFocus = null;
function openModal(html) {
  lastFocus = document.activeElement;
  document.getElementById("modalBody").innerHTML = html;
  document.getElementById("modal").hidden = false;
  document.getElementById("modalClose").focus();
}
function closeModal() {
  clearInterval(animTimer); animTimer = null;
  if (canSpeak) window.speechSynthesis.cancel();
  if (modalOnClose) { modalOnClose(); modalOnClose = null; }
  document.getElementById("modal").hidden = true;
  document.getElementById("modalBody").innerHTML = "";
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}
document.getElementById("modalClose").onclick = closeModal;
document.getElementById("modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !document.getElementById("modal").hidden) closeModal(); });

function cardActionsHTML(c) {

    <a class="btn small" href="https://www.youtube.com/results?search_query=${q}" target="_blank" rel="noopener">Find a video ↗</a>

}

/* ================= Field games ================= */
let game = { w: null, mode: null };
function shuffle(a) { return a.map(x => [Math.random(), x]).sort((p, q) => p[0] - q[0]).map(p => p[1]); }
function norm(s) { return s.toLowerCase().replace(/\(.*?\)/g, " ").replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim(); }
function lev(a, b) { const d = Array.from({ length: a.length + 1 }, (_, i) => [i]); for (let j = 1; j <= b.length; j++) d[0][j] = j; for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); return d[a.length][b.length]; }
function closeEnough(guess, term) {
  const g = norm(guess), t = norm(term);
  if (!g) return false;
  if (g === t || lev(g, t) <= Math.max(1, Math.floor(t.length / 8))) return true;
  const paren = (term.match(/\((.*?)\)/) || [])[1];
  if (paren && norm(paren) === g) return true;
  const words = t.split(" ").filter(w => w.length > 3 && !["theory", "model", "framework", "analysis"].includes(w));
  return words.length > 0 && words.every(w => g.includes(w.slice(0, 5)));
}
function startGame(mode) {
  const wk = WEEKS[game.w], pool = wk.days.flatMap(d => d.cards);
  game = { w: game.w, mode, idx: 0, right: 0, total: 0, done: false, msg: "" };
  if (mode === "sort") {
    game.bins = wk.chapterNames.map(c => ({ key: String(c.num), label: `Ch ${c.num}: ${c.title}` }));
    game.items = shuffle(pool).slice(0, 8).map(c => ({ id: c.id, text: c.term, bin: c.section.split(".")[0] }));
  } else if (mode === "polc") {
    game.bins = ["Planning", "Organizing", "Leading", "Controlling"].map(f => ({ key: f, label: f }));
    game.items = shuffle(COURSE.polc).slice(0, 8).map((p, i) => ({ id: "p" + i, text: p.text, bin: p.fn }));
  } else if (mode === "type") {
    game.items = shuffle(pool).slice(0, 6);
  } else {
    game.items = shuffle(wk.scenarios).map(s => {
      const others = shuffle(pool.filter(c => c.term !== s.answer)).slice(0, 3).map(c => c.term);
      return Object.assign({}, s, { opts: shuffle([s.answer, ...others]) });
    });
  }
  if (game.items[0] && game.bins) { game.placed = {}; game.missed = {}; game.sel = null; }
  game.total = game.items.length;
  renderGames();
}
function finishGame() {
  game.done = true;
  const pct = Math.round(game.right / game.total * 100);
  state.xp += game.right * 2;
  if (pct === 100) state.gamesPerfect = true;
  state.gamesPlayed = (state.gamesPlayed || 0) + 1;
  Sound.play(pct >= 80 ? "fanfare" : "seed");
  markActive(); checkRibbons(); save(); renderStats(); renderRibbons();
}
function renderGames() {
  const el = document.getElementById("panel-games");
  if (game.w == null) game.w = Math.min(WEEKS.length - 1, Math.floor(todayIndex() / 7));
  const wk = WEEKS[game.w];
  const menu = [
    ["sort", "Sort the harvest", `Drag each term into the barn for its chapter (${wk.chapters}).`, "barn"],
    ["polc", "P-O-L-C barns", "Sort farm chores into Planning, Organizing, Leading or Controlling.", "fence"],
    ["type", "Name that seed", "Read the definition and type the term from memory.", "seedling"],
    ["scen", "Farm trouble", "Real farm situations. Pick the concept that explains each one.", "scarecrow"]
  ];
  let body = "";
  if (!game.mode) body = `<div class="game-menu">${menu.map(([m, t, d, a]) => `<button class="game-tile" data-game="${m}">${art(a)}<span><b>${t}</b><span>${d}</span></span></button>`).join("")}</div>`;
  else if (game.done) {
    const pct = Math.round(game.right / game.total * 100);
    body = `<div class="done-card">${art("ribbon", pct === 100 ? "#2b5fa8" : pct >= 80 ? "#b3372c" : "#c98a12")}<h2>${pct === 100 ? "Perfect round!" : pct >= 80 ? "Great round" : "Good practice"}</h2><p>${game.right} of ${game.total} right first time (${pct}%). +${game.right * 2} bushels.</p><div class="rate"><button class="btn primary" id="gAgain">Play again</button><button class="btn" id="gMenu">Other games</button></div></div>`;
  } else if (game.bins) body = sortHTML();
  else if (game.mode === "type") body = typeHTML();
  else body = scenHTML();
  el.innerHTML = `<div class="games">
    <div class="libbar"><div><span class="eyebrow">Field games</span><h2>${game.mode ? menu.find(m => m[0] === game.mode)[1] : "Pick a game"}</h2></div>
      <div class="settings"><label for="gWeek">Cards from</label><select id="gWeek">${WEEKS.map((w, i) => `<option value="${i}" ${i === game.w ? "selected" : ""}>Week ${i + 1}: ${esc(w.title)}</option>`).join("")}</select>${game.mode ? `<button class="btn" id="gBack">All games</button>` : ""}</div></div>
    ${body}</div>`;
  wireGames();
}
function sortHTML() {
  const left = game.items.filter(it => !game.placed[it.id]);
  return `<p class="hint">${game.msg || "Drag a chip onto a barn, or tap a chip and then tap a barn."}</p>
    <div class="pool">${left.map(it => `<button class="chip-item ${game.sel === it.id ? "sel" : ""} ${game.shake === it.id ? "shake" : ""}" draggable="true" data-item="${it.id}">${esc(it.text)}</button>`).join("") || `<span class="small">All sorted!</span>`}</div>
    <div class="bins">${game.bins.map(b => `<div class="bin" data-bin="${b.key}" tabindex="0" role="button" aria-label="Barn: ${esc(b.label)}"><div class="bin-roof"></div><b>${esc(b.label)}</b><div class="bin-items">${game.items.filter(it => game.placed[it.id] === b.key).map(it => `<span class="placed ${game.missed[it.id] ? "late" : ""}">${esc(it.text)}</span>`).join("")}</div></div>`).join("")}</div>`;
}
function typeHTML() {
  const c = game.items[game.idx];
  return `<div class="quiz"><span class="eyebrow">Seed ${game.idx + 1} of ${game.total} · ${game.right} right</span>
    <p class="q">${esc(c.definition)}</p>
    ${game.reveal ? `<p class="feedback ${game.reveal.ok ? "ok" : "no"}">${game.reveal.ok ? "Yes!" : "Not quite."} The term is <b>${esc(c.term)}</b>.</p><div class="rate"><button class="btn primary" id="gNext">${game.idx + 1 < game.total ? "Next seed →" : "See results"}</button></div>`
    : `<form class="ask" id="typeForm"><label for="typeAns" class="sr">Your answer</label><input id="typeAns" autocomplete="off" placeholder="Type the term"><button class="btn primary" type="submit">Check</button><button class="btn" type="button" id="gSkip">Show me</button></form><p class="hint">Close spellings count.</p>`}
  </div>`;
}
function scenHTML() {
  const s = game.items[game.idx];
  return `<div class="quiz"><span class="eyebrow">Situation ${game.idx + 1} of ${game.total} · ${game.right} right</span>
    <p class="q">${esc(s.q)}</p>
    <div class="opts">${s.opts.map((o, k) => `<button class="opt ${game.reveal ? (o === s.answer ? "right" : game.reveal.k === k ? "wrong" : "") : ""}" data-opt="${k}" ${game.reveal ? "disabled" : ""}>${esc(o)}</button>`).join("")}</div>
    ${game.reveal ? `<p class="feedback ${game.reveal.ok ? "ok" : "no"}">${esc(s.why)}</p><div class="rate"><button class="btn primary" id="gNext">${game.idx + 1 < game.total ? "Next situation →" : "See results"}</button></div>` : ""}
  </div>`;
}
function placeItem(id, bin) {
  const it = game.items.find(x => x.id === id); if (!it || game.placed[id]) return;
  if (it.bin === bin) {
    game.placed[id] = bin; game.sel = null; game.shake = null;
    if (!game.missed[id]) game.right++;
    game.msg = "Into the barn!"; Sound.play("pop");
    if (Object.keys(game.placed).length === game.items.length) return finishGame(), renderGames();
  } else {
    game.missed[id] = true; game.shake = id; game.msg = "Wrong barn. Try another one."; Sound.play("buzz");
  }
  renderGames();
}
function wireGames() {
  const $ = id => document.getElementById(id);
  $("gWeek").onchange = e => { game = { w: Number(e.target.value), mode: game.mode }; if (game.mode) startGame(game.mode); else renderGames(); };
  if ($("gBack")) $("gBack").onclick = () => { game = { w: game.w, mode: null }; renderGames(); };
  if ($("gMenu")) $("gMenu").onclick = () => { game = { w: game.w, mode: null }; renderGames(); };
  if ($("gAgain")) $("gAgain").onclick = () => startGame(game.mode);
  document.querySelectorAll("[data-game]").forEach(b => b.onclick = () => startGame(b.dataset.game));
  document.querySelectorAll("[data-item]").forEach(b => {
    b.onclick = () => { game.sel = game.sel === b.dataset.item ? null : b.dataset.item; game.shake = null; renderGames(); };
    b.ondragstart = e => { e.dataTransfer.setData("text/plain", b.dataset.item); e.dataTransfer.effectAllowed = "move"; };
  });
  document.querySelectorAll("[data-bin]").forEach(b => {
    const act = () => { if (game.sel) placeItem(game.sel, b.dataset.bin); };
    b.onclick = act;
    b.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); act(); } };
    b.ondragover = e => { e.preventDefault(); b.classList.add("over"); };
    b.ondragleave = () => b.classList.remove("over");
    b.ondrop = e => { e.preventDefault(); b.classList.remove("over"); placeItem(e.dataTransfer.getData("text/plain"), b.dataset.bin); };
  });
  const next = () => { game.reveal = null; game.idx++; if (game.idx >= game.total) finishGame(); renderGames(); };
  if ($("gNext")) { $("gNext").onclick = next; $("gNext").focus(); }
  if ($("typeForm")) {
    $("typeAns").focus();
    $("typeForm").onsubmit = e => { e.preventDefault(); const ok = closeEnough($("typeAns").value, game.items[game.idx].term); if (ok) game.right++; game.reveal = { ok }; Sound.play(ok ? "pop" : "buzz"); renderGames(); };
    $("gSkip").onclick = () => { game.reveal = { ok: false }; Sound.play("seed"); renderGames(); };
  }
  document.querySelectorAll("[data-opt]").forEach(b => b.onclick = () => {
    const s = game.items[game.idx], k = Number(b.dataset.opt), ok = s.opts[k] === s.answer;
    if (ok) game.right++;
    game.reveal = { ok, k }; Sound.play(ok ? "register" : "buzz"); renderGames();
  });
}
