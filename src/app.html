<title>Harvest Ledger</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Courier+Prime:wght@400;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: a farm almanac. Growing farm scene up top, seed-packet flash cards in the middle, planting calendar and fair ribbons below. */
:root {
  --bg: #eef2e6;
  --paper: #fbfbf4;
  --ink: #1e2a1c;
  --muted: #5a6955;
  --line: #d3dbc7;
  --field: #2e6a3e;
  --field-ink: #ffffff;
  --wheat: #c98a12;
  --wheat-soft: #f6e6bd;
  --barn: #b3372c;
  --sky: #cfe5f0;
  --sky-2: #e9f3f6;
  --soil: #6a4930;
  --good: #2e6a3e;
  --warn: #b06d00;
  --font-display: "Alfa Slab One", "Rockwell", "Roboto Slab", Georgia, serif;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --font-mono: "Courier Prime", "Courier New", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111813; --paper: #1a241c; --ink: #e6ede0; --muted: #9dad97; --line: #2e3d30;
    --field: #6cbf7d; --field-ink: #0f1a12; --wheat: #f0b640; --wheat-soft: #3a2f16; --barn: #e46a5e;
    --sky: #1c3242; --sky-2: #223a4b; --soil: #a37b5b; --good: #6cbf7d; --warn: #f0b640;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111813; --paper: #1a241c; --ink: #e6ede0; --muted: #9dad97; --line: #2e3d30;
  --field: #6cbf7d; --field-ink: #0f1a12; --wheat: #f0b640; --wheat-soft: #3a2f16; --barn: #e46a5e;
  --sky: #1c3242; --sky-2: #223a4b; --soil: #a37b5b; --good: #6cbf7d; --warn: #f0b640;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 1040px; margin: 0 auto; display: grid; gap: 22px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; text-wrap: balance; margin: 0; letter-spacing: .01em; }
h1 { font-size: clamp(1.9rem, 4.5vw, 2.8rem); line-height: 1.05; }
h2 { font-size: 1.45rem; line-height: 1.15; }
h3 { font-size: 1.1rem; }
p { margin: 0; }
.eyebrow { font-family: var(--font-mono); font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--wheat); outline-offset: 2px; }

/* ---------- Header + farm ---------- */
header.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; }
header.top .intro { display: grid; gap: 6px; min-width: 0; }
header.top .intro p { color: var(--muted); max-width: 60ch; }
.farm { position: relative; border-radius: 14px; overflow: hidden; border: 2px solid var(--ink); background: var(--sky); }
.farm svg { display: block; width: 100%; height: auto; }
.farm .locked { opacity: .16; filter: grayscale(1); }
.farm .unlocked { animation: rise .7s cubic-bezier(.2,1.4,.4,1) both; }
@keyframes rise { from { transform: translateY(12px); opacity: .2; } to { transform: none; opacity: 1; } }
.farm-cap { position: absolute; left: 12px; bottom: 10px; background: var(--paper); color: var(--ink); border: 2px solid var(--ink); border-radius: 999px; padding: 4px 12px; font-family: var(--font-mono); font-size: .8rem; }

.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.stat { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 2px; }
.stat b { font-family: var(--font-display); font-weight: 400; font-size: 1.6rem; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat span { font-size: .85rem; color: var(--muted); }
.bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; background: var(--field); border-radius: 99px; transition: width .5s; }

/* ---------- Tabs ---------- */
nav.tabs { display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 2px solid var(--ink); }
nav.tabs button { background: transparent; border: 2px solid transparent; border-bottom: 0; padding: 8px 16px; border-radius: 10px 10px 0 0; color: var(--muted); font-weight: 700; position: relative; top: 2px; }
nav.tabs button[aria-selected="true"] { background: var(--paper); color: var(--ink); border-color: var(--ink); border-bottom: 2px solid var(--paper); }
.panel { display: grid; gap: 20px; }

/* ---------- Today ---------- */
.today { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 22px; align-items: start; }
.lesson-head { display: grid; gap: 6px; }
.lesson-head .when { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: .78rem; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper); color: var(--muted); }
.chip.done { background: var(--field); color: var(--field-ink); border-color: var(--field); }
.chip.market { background: var(--wheat-soft); color: var(--ink); border-color: var(--wheat); }
.daynav { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 2px solid var(--ink); background: var(--paper); color: var(--ink); border-radius: 999px; padding: 6px 16px; font-weight: 700; }
.btn:hover { background: var(--sky-2); }
.btn.primary { background: var(--field); color: var(--field-ink); border-color: var(--field); }
.btn.gold { background: var(--wheat); color: #1e1a10; border-color: var(--wheat); }
.btn:disabled { opacity: .45; cursor: not-allowed; }

/* Seed packet card */
.deck { display: grid; gap: 14px; }
.packet { perspective: 1400px; cursor: pointer; }
.packet-inner { position: relative; transition: transform .55s cubic-bezier(.3,.7,.2,1); transform-style: preserve-3d; min-height: 430px; }
.packet.flipped .packet-inner { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: var(--paper); border: 2px solid var(--ink); border-radius: 6px 6px 14px 14px; display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; }
.face::before { content: ""; height: 14px; background: repeating-linear-gradient(90deg, var(--ink) 0 6px, transparent 6px 12px); opacity: .18; }
.face.back { transform: rotateY(180deg); }
.packet-art { background: var(--sky); border-block: 2px solid var(--ink); display: grid; place-items: center; padding: 10px; }
.packet-art svg { width: min(220px, 60%); height: auto; }
.face-body { padding: 16px 20px; display: grid; gap: 8px; align-content: start; }
.face-foot { display: flex; justify-content: space-between; gap: 10px; padding: 8px 20px 12px; font-family: var(--font-mono); font-size: .75rem; color: var(--muted); border-top: 1px dashed var(--line); flex-wrap: wrap; }
.term { font-family: var(--font-display); font-size: clamp(1.5rem, 3.6vw, 2.1rem); line-height: 1.1; text-wrap: balance; }
.prompt-line { color: var(--muted); }
.back-grid { display: grid; gap: 12px; padding: 18px 20px; align-content: start; overflow-y: auto; }
.back-grid .def { font-size: 1.08rem; max-width: 62ch; }
.onfarm { background: var(--wheat-soft); border: 1px solid var(--wheat); border-radius: 10px; padding: 10px 12px; display: grid; grid-template-columns: 54px minmax(0,1fr); gap: 10px; align-items: center; }
.onfarm svg { width: 54px; height: 54px; }
.onfarm b { font-family: var(--font-mono); font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; display: block; color: var(--muted); }
.rate { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.cardnav { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.dots { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.dots button { width: 16px; height: 16px; padding: 0; border-radius: 50%; border: 2px solid var(--ink); background: transparent; }
.dots button.known { background: var(--field); border-color: var(--field); }
.dots button.growing { background: var(--wheat); border-color: var(--wheat); }
.dots button.cur { outline: 2px solid var(--wheat); outline-offset: 2px; }
.complete { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 14px; align-items: center; background: var(--paper); border: 2px dashed var(--line); border-radius: 14px; padding: 12px 16px; }
.complete.done { border: 2px solid var(--field); background: var(--wheat-soft); }
.complete svg { width: 56px; height: 56px; }
.complete b { font-family: var(--font-display); font-weight: 400; font-size: 1.1rem; display: block; }
.complete span { color: var(--muted); font-size: .9rem; }
.linkish { background: none; border: 0; color: var(--muted); text-decoration: underline; padding: 4px; }
.libbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.libbar select { font: inherit; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; background: var(--paper); color: var(--ink); }
.library { max-width: 720px; width: 100%; margin: 0 auto; display: grid; gap: 14px; }
.hint { text-align: center; color: var(--muted); font-size: .85rem; }

.side { display: grid; gap: 14px; }
.box { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 8px; }
.box h3 { font-size: 1rem; }
.box ol, .box ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.box .small { font-size: .88rem; color: var(--muted); }

.done-card { background: var(--paper); border: 2px solid var(--ink); border-radius: 14px; padding: 22px; display: grid; gap: 12px; justify-items: center; text-align: center; }
.done-card svg { width: 120px; height: 120px; }

/* Market day quiz */
.quiz { background: var(--paper); border: 2px solid var(--ink); border-radius: 14px; padding: 18px 20px; display: grid; gap: 14px; }
.quiz .q { font-size: 1.1rem; max-width: 64ch; }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
.opt { text-align: left; border: 2px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 10px; padding: 10px 12px; font-weight: 600; }
.opt:hover:not(:disabled) { border-color: var(--ink); }
.opt.right { border-color: var(--good); background: var(--field); color: var(--field-ink); }
.opt.wrong { border-color: var(--barn); text-decoration: line-through; }

/* ---------- Calendar ---------- */
.weeks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.week { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: grid; grid-template-rows: auto 1fr; }
.week-head { display: grid; grid-template-columns: 72px minmax(0,1fr); gap: 12px; align-items: center; padding: 12px 14px; background: var(--sky-2); border-bottom: 1px solid var(--line); }
.week-head svg { width: 72px; height: 60px; }
.week-head .eyebrow { font-size: .7rem; }
.week-head p { font-size: .85rem; color: var(--muted); }
.week.complete .week-head { background: var(--wheat-soft); }
.days { list-style: none; margin: 0; padding: 6px 0; display: grid; }
.days li button { width: 100%; display: grid; grid-template-columns: 74px minmax(0,1fr) auto; gap: 10px; align-items: center; text-align: left; background: transparent; border: 0; padding: 6px 14px; color: var(--ink); }
.days li button:hover { background: var(--bg); }
.days li .d { font-family: var(--font-mono); font-size: .76rem; color: var(--muted); }
.days li .t { font-size: .92rem; min-width: 0; }
.days li.today-row button { background: var(--sky-2); font-weight: 700; }
.mark { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: .7rem; }
.mark.ok { background: var(--field); border-color: var(--field); color: var(--field-ink); }
.mark.rest { border-style: dashed; }

/* ---------- Ribbons ---------- */
.ribbons { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
.ribbon { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; grid-template-columns: 56px minmax(0,1fr); gap: 12px; align-items: center; }
.ribbon svg { width: 56px; height: 72px; }
.ribbon.locked svg { opacity: .25; filter: grayscale(1); }
.ribbon.locked h3 { color: var(--muted); }
.ribbon p { font-size: .85rem; color: var(--muted); }
.ribbon h3 { font-size: .98rem; }

.settings { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; font-size: .9rem; color: var(--muted); }
.settings input { font: inherit; border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; background: var(--paper); color: var(--ink); }
.saved { font-family: var(--font-mono); font-size: .75rem; color: var(--muted); }

/* Toast + burst */
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 140%); background: var(--ink); color: var(--paper); border-radius: 14px; padding: 12px 18px; display: flex; gap: 12px; align-items: center; max-width: min(92vw, 460px); transition: transform .4s cubic-bezier(.2,1.3,.4,1); z-index: 50; }
.toast.show { transform: translate(-50%, 0); }
.toast svg { width: 40px; height: 52px; flex: none; }
.toast b { font-family: var(--font-display); font-weight: 400; display: block; }
.burst { position: fixed; inset: 0; pointer-events: none; z-index: 40; }

@media (max-width: 860px) {
  .today { grid-template-columns: minmax(0, 1fr); }
  .weeks { grid-template-columns: minmax(0, 1fr); }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 520px) {
  .opts { grid-template-columns: minmax(0,1fr); }
  .complete { grid-template-columns: 44px minmax(0, 1fr); }
  .complete svg { width: 44px; height: 44px; }
  .complete .btn, .complete .linkish { grid-column: 1 / -1; }
  .cardnav .btn { padding-inline: 10px; }
  .packet-inner { min-height: 470px; }
  .farm-cap { font-size: .68rem; left: 8px; bottom: 6px; padding: 2px 8px; }
  .days li button { grid-template-columns: 62px minmax(0,1fr) auto; padding-inline: 10px; }
}
@media (prefers-reduced-motion: reduce) {
  .packet-inner, .toast, .bar i { transition: none; }
  .farm .unlocked { animation: none; }
}
</style>

<div class="wrap">
  <header class="top">
    <div class="intro">
      <span class="eyebrow" id="bookLine">Principles of Management · 8-week planting season</span>
      <h1>Harvest Ledger</h1>
      <p>Daily seed-packet flash cards from your textbook. Finish a week and something new gets built on your farm.</p>
    </div>
    <div class="settings">
      <label for="startDate">Season started</label>
      <input type="date" id="startDate">
      <span class="saved" id="savedState">Saved on this device</span>
    </div>
  </header>

  <div class="farm" id="farm" aria-label="Your farm. New buildings appear as you complete weeks."></div>

  <div class="stats" id="stats"></div>

  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-today" aria-selected="true" data-tab="today">Today</button>
    <button role="tab" id="tab-calendar" aria-selected="false" data-tab="calendar">Planting calendar</button>
    <button role="tab" id="tab-library" aria-selected="false" data-tab="library">Card barn</button>
    <button role="tab" id="tab-ribbons" aria-selected="false" data-tab="ribbons">Ribbons</button>
  </nav>

  <section class="panel" id="panel-today"></section>
  <section class="panel" id="panel-calendar" hidden></section>
  <section class="panel" id="panel-library" hidden></section>
  <section class="panel" id="panel-ribbons" hidden></section>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<canvas class="burst" id="burst"></canvas>

<script id="course-data" type="application/json">__COURSE_JSON__</script>
<script>
(function () {
"use strict";
const COURSE = JSON.parse(document.getElementById("course-data").textContent);
const WEEKS = COURSE.weeks;
const DAY_NAMES = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];

/* ================= Illustrations ================= */
const ART = {

  silo: () => `<rect x="30" y="30" width="40" height="62" fill="#c9ced1"/><path d="M30 30 Q50 6 70 30Z" fill="#8a9499"/><path d="M30 44 H70 M30 58 H70 M30 72 H70" stroke="#8a9499" stroke-width="2"/><rect x="45" y="78" width="10" height="14" fill="#6a4930"/>`,
  tractor: () => `<rect x="18" y="50" width="52" height="22" rx="3" fill="#2e8a3e"/><rect x="44" y="28" width="24" height="24" fill="none" stroke="#1e2a1c" stroke-width="4"/><rect x="22" y="40" width="6" height="12" fill="#1e2a1c"/><circle cx="62" cy="76" r="17" fill="#1e2a1c"/><circle cx="62" cy="76" r="7" fill="#e0a526"/><circle cx="26" cy="80" r="11" fill="#1e2a1c"/><circle cx="26" cy="80" r="4" fill="#e0a526"/>`,
  cow: () => `<ellipse cx="48" cy="56" rx="30" ry="18" fill="#f7f7f2" stroke="#1e2a1c" stroke-width="2"/><ellipse cx="40" cy="52" rx="8" ry="6" fill="#1e2a1c"/><ellipse cx="58" cy="62" rx="6" ry="5" fill="#1e2a1c"/><rect x="26" y="70" width="6" height="18" fill="#1e2a1c"/><rect x="62" y="70" width="6" height="18" fill="#1e2a1c"/><ellipse cx="80" cy="46" rx="11" ry="9" fill="#f7f7f2" stroke="#1e2a1c" stroke-width="2"/><ellipse cx="86" cy="50" rx="5" ry="4" fill="#f2a7a0"/><path d="M74 38 l-4 -6 M84 38 l4 -6" stroke="#1e2a1c" stroke-width="3"/>`,
  chicken: () => `<ellipse cx="46" cy="60" rx="24" ry="20" fill="#f7f2e4" stroke="#1e2a1c" stroke-width="2"/><circle cx="66" cy="38" r="11" fill="#f7f2e4" stroke="#1e2a1c" stroke-width="2"/><path d="M60 28 q3 -8 6 0 q3 -8 6 0" fill="#c8352a"/><polygon points="76,38 86,42 76,45" fill="#e0a526"/><circle cx="68" cy="36" r="2" fill="#1e2a1c"/><path d="M26 56 Q14 44 22 38 Q28 48 30 52" fill="#d9cdb0"/><path d="M42 80 v10 M52 80 v10" stroke="#e0a526" stroke-width="3"/>`,
  beehive: () => `<rect x="26" y="34" width="48" height="14" rx="6" fill="#e0a526"/><rect x="22" y="48" width="56" height="16" rx="6" fill="#c98a12"/><rect x="26" y="64" width="48" height="16" rx="6" fill="#e0a526"/><rect x="18" y="80" width="64" height="10" fill="#6a4930"/><ellipse cx="50" cy="70" rx="5" ry="4" fill="#1e2a1c"/><g fill="#1e2a1c"><ellipse cx="80" cy="26" rx="4" ry="3"/><ellipse cx="18" cy="30" rx="4" ry="3"/></g><g fill="#cfe5f0"><ellipse cx="80" cy="22" rx="3" ry="2"/><ellipse cx="18" cy="26" rx="3" ry="2"/></g>`,
  apple: () => `<rect x="44" y="56" width="12" height="36" fill="#6a4930"/><circle cx="50" cy="40" r="28" fill="#3f8a4a"/><circle cx="36" cy="32" r="16" fill="#4f9a55"/><g fill="#c8352a"><circle cx="38" cy="44" r="5"/><circle cx="58" cy="30" r="5"/><circle cx="62" cy="50" r="5"/><circle cx="46" cy="24" r="4"/></g>`,

/* ================= Schedule ================= */
const LESSONS_PER_WEEK = 5;
const TOTAL_DAYS = WEEKS.length * 7;
function pad(n) { return String(n).padStart(2, "0"); }
function iso(d) { return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function parseISO(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function daysBetween(a, b) { return Math.round((parseISO(iso(b)) - parseISO(iso(a))) / 86400000); }
function fmt(d) { return d.toLocaleDateString(undefined, { month: "short", day: "numeric" }); }

function dayInfo(i) {
  const w = Math.floor(i / 7), dow = i % 7;
  const week = WEEKS[w];
  if (dow < LESSONS_PER_WEEK) return { i, w, dow, kind: "lesson", lesson: week.days[dow], week };
  if (dow === 5) return { i, w, dow, kind: "market", week };
  return { i, w, dow, kind: "rest", week };
}
function allCards() { return WEEKS.flatMap(w => w.days.flatMap(d => d.cards)); }

/* ================= State + storage ================= */
const LS_KEY = "harvest-ledger-v1";
function defaultState() { return { start: iso(new Date()), cards: {}, lessonsDone: {}, market: {}, active: [], xp: 0, ribbons: {} }; }
let state = defaultState();
try { const raw = localStorage.getItem(LS_KEY); if (raw) state = Object.assign(defaultState(), JSON.parse(raw)); } catch (e) {}

let remote = null; // db doc reference when the account store is available
let saveTimer = null;
function save() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
  if (!remote) return;
  clearTimeout(saveTimer);
  setSaved("Saving…");
  saveTimer = setTimeout(() => {
    remote.set(JSON.parse(JSON.stringify(state))).then(() => setSaved("Saved to your account")).catch(() => setSaved("Saved on this device"));
  }, 600);
}
function setSaved(t) { document.getElementById("savedState").textContent = t; }

async function connectStore() {
  if (!window.claude || !window.claude.use) return;
  try {
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    remote = db.collection("data/users/" + id).doc("harvest-ledger");
    const snap = await remote.get();
    if (snap.exists) {
      state = Object.assign(defaultState(), JSON.parse(JSON.stringify(snap.data())));
      try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
      quietRibbons();
      renderAll();
      setSaved("Saved to your account");
    } else {
      save();
    }
  } catch (e) { remote = null; }
}

/* ================= Derived progress ================= */
function weekComplete(w) {
  for (let d = 0; d < LESSONS_PER_WEEK; d++) if (!state.lessonsDone[w * 7 + d]) return false;
  return state.market[w] != null;
}
function knownCount() { return Object.values(state.cards).filter(v => v === "known").length; }
function streak() {
  const set = new Set(state.active);
  let n = 0, d = new Date();
  if (!set.has(iso(d))) d = addDays(d, -1);
  while (set.has(iso(d))) { n++; d = addDays(d, -1); }
  return n;
}
function bestStreak() {
  const ds = [...new Set(state.active)].sort();
  let best = 0, run = 0, prev = null;
  for (const s of ds) { const d = parseISO(s); run = prev && daysBetween(prev, d) === 1 ? run + 1 : 1; best = Math.max(best, run); prev = d; }
  return best;
}
function markActive() { const t = iso(new Date()); if (!state.active.includes(t)) state.active.push(t); }
function farmUnlocks() {
  const anyLesson = Object.keys(state.lessonsDone).length > 0;
  return [anyLesson, ...WEEKS.map((_, w) => weekComplete(w))];
}

const RIBBONS = [
  { id: "sprout", title: "First Sprout", desc: "Finish your first day of cards.", color: "#4f9a55", test: () => Object.keys(state.lessonsDone).length >= 1 },
  ...WEEKS.map((wk, w) => ({ id: "week" + w, title: wk.build, desc: `Complete week ${w + 1}: ${wk.title}.`, color: w === 3 ? "#c98a12" : w === WEEKS.length - 1 ? "#2b5fa8" : "#b3372c", test: () => weekComplete(w) })),
  { id: "halfway", title: "Halfway Harvest", desc: "Finish four full weeks. The silo is half full.", color: "#c98a12", test: () => [0,1,2,3].every(weekComplete) },
  { id: "streak3", title: "Three Days of Rain", desc: "Study three days in a row.", color: "#3a7fb0", test: () => bestStreak() >= 3 },
  { id: "streak7", title: "Week of Sunshine", desc: "Study seven days in a row.", color: "#e0a526", test: () => bestStreak() >= 7 },
  { id: "streak21", title: "Steady Hand at the Plough", desc: "Study 21 days in a row.", color: "#6a4930", test: () => bestStreak() >= 21 },
  { id: "known25", title: "First Bushels", desc: "Harvest 25 cards.", color: "#4f9a55", test: () => knownCount() >= 25 },
  { id: "known75", title: "Bumper Crop", desc: "Harvest 75 cards.", color: "#2e6a3e", test: () => knownCount() >= 75 },
  { id: "knownAll", title: "Full Granary", desc: "Harvest every card in the course.", color: "#c98a12", test: () => knownCount() >= allCards().length },
  { id: "perfect", title: "Blue Ribbon at Market", desc: "Score 100% on a Market Day quiz.", color: "#2b5fa8", test: () => Object.values(state.market).some(s => s === 100) },
  { id: "greenhouse", title: "Greenhouse Keeper", desc: "Turn 10 still-growing cards into harvested ones in the greenhouse.", color: "#3f8a4a", test: () => (state.rescued || 0) >= 10 },
  { id: "champion", title: "County Fair Champion", desc: "Complete all eight weeks.", color: "#2b5fa8", test: () => WEEKS.every((_, w) => weekComplete(w)) }
];
function quietRibbons() { RIBBONS.forEach(r => { if (r.test()) state.ribbons[r.id] = state.ribbons[r.id] || iso(new Date()); }); }
function checkRibbons() {
  const fresh = [];
  RIBBONS.forEach(r => { if (!state.ribbons[r.id] && r.test()) { state.ribbons[r.id] = iso(new Date()); fresh.push(r); } });
  fresh.forEach((r, k) => setTimeout(() => celebrate(r), k * 2600));
}

/* ================= Celebration ================= */
let toastTimer;
function celebrate(r) {
  const t = document.getElementById("toast");
  t.innerHTML = `${art("ribbon", r.color)}<div><b>${r.title}</b><span>${r.desc}</span></div>`;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2400);
  burst();
}
function burst() {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = document.getElementById("burst"), ctx = c.getContext("2d");
  c.width = innerWidth; c.height = innerHeight;
  const cols = ["#e0a526", "#4f9a55", "#c8352a", "#f4c542", "#6cbf7d"];
  const ps = Array.from({ length: 70 }, () => ({ x: innerWidth / 2, y: innerHeight * .7, vx: (Math.random() - .5) * 12, vy: -Math.random() * 13 - 4, r: Math.random() * Math.PI, c: cols[Math.floor(Math.random() * cols.length)], s: 5 + Math.random() * 6 }));
  let f = 0;
  (function tick() {
    ctx.clearRect(0, 0, c.width, c.height);
    ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .35; p.r += .15; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.beginPath(); ctx.ellipse(0, 0, p.s, p.s / 2.4, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore(); });
    if (++f < 90) requestAnimationFrame(tick); else ctx.clearRect(0, 0, c.width, c.height);
  })();
}

/* ================= Rendering ================= */
let view = { day: null, card: 0, flipped: false, mode: "lesson", quiz: null, greenhouse: null };
function todayIndex() { return Math.max(0, Math.min(TOTAL_DAYS - 1, daysBetween(parseISO(state.start), new Date()))); }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function renderFarm() {
  const u = farmUnlocks();
  const next = BUILDS.findIndex((_, i) => !u[i]);
  document.getElementById("farm").innerHTML = farmSVG(u) + `<span class="farm-cap">${next === -1 ? "Every building is up. Champion farm!" : "Next to build: " + BUILDS[next].label}</span>`;
}
function renderStats() {
  const total = allCards().length, known = knownCount();
  const weeksDone = WEEKS.filter((_, w) => weekComplete(w)).length;
  const dayNo = daysBetween(parseISO(state.start), new Date()) + 1;
  document.getElementById("stats").innerHTML = `
    <div class="stat"><b>${state.xp}</b><span>Bushels earned</span></div>
    <div class="stat"><b>${streak()}</b><span>Day streak · best ${bestStreak()}</span></div>
    <div class="stat"><b>${known}/${total}</b><span>Cards harvested</span><div class="bar"><i style="width:${total ? known / total * 100 : 0}%"></i></div></div>
    <div class="stat"><b>${weeksDone}/${WEEKS.length}</b><span>Weeks complete · day ${Math.max(1, Math.min(dayNo, TOTAL_DAYS))} of ${TOTAL_DAYS}</span><div class="bar"><i style="width:${weeksDone / WEEKS.length * 100}%"></i></div></div>`;
}

function renderToday() {
  const el = document.getElementById("panel-today");
  if (view.day == null) view.day = todayIndex();
  const info = dayInfo(view.day);
  const date = addDays(parseISO(state.start), view.day);
  const isToday = view.day === todayIndex();
  let status = "";
  if (info.kind === "lesson" && state.lessonsDone[view.day]) status = `<span class="chip done">Completed ✓</span>`;
  if (info.kind === "market" && state.market[info.w] != null) status = `<span class="chip done">Market score ${state.market[info.w]}%</span>`;
  const head = `
    <div class="lesson-head">
      <div class="when"><span class="eyebrow">Week ${info.w + 1} · ${DAY_NAMES[info.dow]} ${fmt(date)}${isToday ? " · today" : ""}</span>${status}</div>
      <h2>${info.kind === "lesson" ? esc(info.lesson.title) : info.kind === "market" ? "Market Day: " + esc(info.week.title) : "Fallow day"}</h2>
      <div class="daynav">
        <button class="btn" id="prevDay" ${view.day === 0 ? "disabled" : ""}>Previous day</button>
        <button class="btn" id="goToday" ${isToday ? "disabled" : ""}>Today</button>
        <button class="btn" id="nextDay" ${view.day >= TOTAL_DAYS - 1 ? "disabled" : ""}>Next day</button>
      </div>
    </div>`;
  let main = "";
  if (view.mode === "greenhouse") main = greenhouseHTML();
  else if (info.kind === "lesson") main = lessonHTML(info);
  else if (info.kind === "market") main = marketHTML(info);
  else main = restHTML(info);
  el.innerHTML = `<div class="today"><div class="deck">${head}${main}</div><aside class="side">${sideHTML(info)}</aside></div>`;
  wireToday(info);
}

function cardHTML(c, flipped, kicker) {
  return `<div class="packet ${flipped ? "flipped" : ""}" id="packet" tabindex="0" role="button" aria-label="Flash card. Press to flip.">
    <div class="packet-inner">
      <div class="face front">
        <div class="packet-art">${art(c.art)}</div>
        <div class="face-body"><span class="eyebrow">${esc(kicker)}</span><div class="term">${esc(c.term)}</div><p class="prompt-line">Say the definition out loud, then flip the packet.</p></div>
        <div class="face-foot"><span>Lot ${esc(c.id)}</span><span>Textbook §${esc(c.section)}</span></div>
      </div>
      <div class="face back">
        <div class="back-grid">
          <span class="eyebrow">${esc(c.term)}</span>
          <p class="def">${esc(c.definition)}</p>
          <div class="onfarm">${art(c.art)}<div><b>On the farm</b>${esc(c.farm)}</div></div>
        </div>
        <div class="face-foot"><span>Lot ${esc(c.id)}</span><span>Textbook §${esc(c.section)}</span></div>
      </div>
    </div>
  </div>`;
}
function lessonHTML(info) {
  const cards = info.lesson.cards;
  view.card = Math.min(view.card, cards.length - 1);
  const c = cards[view.card];
  const doneOn = state.lessonsDone[view.day];
  const known = cards.filter(x => state.cards[x.id] === "known").length;
  const complete = doneOn
    ? `<div class="complete done">${art("basket")}<div><b>Lesson complete</b><span>You marked this day done on ${fmt(parseISO(doneOn))}. Keep flipping as much as you like.</span></div><button class="linkish" id="undoDone">Undo</button></div>`
    : `<div class="complete">${art("seedling")}<div><b>Finished today's lesson?</b><span>Flip the cards as many times as you want, then mark the day done to earn 20 bushels.</span></div><button class="btn primary" id="markDone">Mark today complete</button></div>`;
  return `${cardHTML(c, view.flipped, `${info.lesson.chapter} · card ${view.card + 1} of ${cards.length}`)}
    ${navHTML(cards, view.card)}
    <div class="rate">
      <button class="btn gold" id="growing">Still growing</button>
      <button class="btn primary" id="known">Harvested it</button>
    </div>
    <p class="hint">Tap the packet or press space to flip it. Use the arrow keys to move between cards. ${known} of ${cards.length} harvested today.</p>
    ${complete}`;
}
function navHTML(cards, cur) {
  return `<div class="cardnav">
    <button class="btn" id="prevCard" aria-label="Previous card">← Previous</button>
    <div class="dots">${cards.map((x, k) => `<button class="${state.cards[x.id] || ""} ${k === cur ? "cur" : ""}" data-card="${k}" aria-label="Card ${k + 1}"></button>`).join("")}</div>
    <button class="btn" id="nextCard" aria-label="Next card">Next →</button>
  </div>`;
}
function marketHTML(info) {
  const pool = info.week.days.flatMap(d => d.cards);
  if (!view.quiz || view.quiz.w !== info.w) view.quiz = makeQuiz(info.w, pool);
  const q = view.quiz;
  if (q.idx >= q.items.length) {
    const pct = Math.round(q.right / q.items.length * 100);
    return `<div class="done-card">${art("ribbon", pct === 100 ? "#2b5fa8" : pct >= 80 ? "#b3372c" : "#c98a12")}
      <h2>${pct === 100 ? "Blue ribbon!" : pct >= 80 ? "Red ribbon. Strong showing." : "Back to the field"}</h2>
      <p>You sold ${q.right} of ${q.items.length} crates at market (${pct}%). ${state.market[info.w] != null ? `Best score this week: ${state.market[info.w]}%.` : ""}</p>
      <div class="rate"><button class="btn" id="retryQuiz">Run the market again</button></div></div>`;
  }
  const it = q.items[q.idx];
  return `<div class="quiz">
    <span class="eyebrow">Crate ${q.idx + 1} of ${q.items.length} · ${q.right} sold</span>
    <p class="q">${esc(it.card.definition)}</p>
    <div class="opts">${it.opts.map((o, k) => `<button class="opt" data-k="${k}">${esc(o.term)}</button>`).join("")}</div>
    <p class="hint">Pick the term that matches. Each right answer earns 5 bushels.</p>
  </div>`;
}
function makeQuiz(w, pool) {
  const shuffled = pool.slice().sort(() => Math.random() - .5).slice(0, Math.min(12, pool.length));
  const items = shuffled.map(card => {
    const others = pool.filter(c => c.id !== card.id).sort(() => Math.random() - .5).slice(0, 3);
    return { card, opts: [card, ...others].sort(() => Math.random() - .5) };
  });
  return { w, items, idx: 0, right: 0, answered: false };
}
function restHTML(info) {
  const next = WEEKS[info.w + 1];
  return `<div class="done-card">${art("sun")}
    <h2>Let the field rest</h2>
    <p>Fallow days keep the soil rich. Take the day off, or tend the greenhouse if any cards are still growing.</p>
    ${next ? `<p><b>Coming up in week ${info.w + 2}:</b> ${esc(next.title)} (${esc(next.chapters)}). You'll build: ${esc(next.build)}.</p>` : `<p>That's the end of the season. Check your ribbons.</p>`}
  </div>`;
}
function greenhouseHTML() {
  const g = view.greenhouse;
  if (!g || g.idx >= g.cards.length) {
    return `<div class="done-card">${art("seedling")}<h2>Greenhouse tended</h2><p>${g && g.cards.length ? `You reviewed ${g.cards.length} cards.` : "Nothing is still growing. Lovely."}</p><div class="rate"><button class="btn" id="leaveGreenhouse">Back to today's lesson</button></div></div>`;
  }
  const c = g.cards[g.idx];
  return `${cardHTML(c, view.flipped, `Greenhouse · ${g.idx + 1} of ${g.cards.length}`)}
    <div class="rate">
      <button class="btn gold" id="growing">Still growing</button>
      <button class="btn primary" id="known">Harvested it</button>
      <button class="btn" id="leaveGreenhouse">Leave greenhouse</button>
    </div>`;
}
function sideHTML(info) {
  const growing = allCards().filter(c => state.cards[c.id] === "growing").length;
  const plan = info.kind === "lesson"
    ? `<ol><li>Read §${esc(info.lesson.sections.join(", §"))} in your textbook (15–20 min).</li><li>Flip today's ${info.lesson.cards.length} seed packets (10 min).</li><li>Explain one card to someone, or to a cow.</li></ol>`
    : info.kind === "market"
    ? `<ol><li>Skim your notes from this week (10 min).</li><li>Take the Market Day quiz (10 min).</li><li>Score 80% or more to earn the week's build.</li></ol>`
    : `<ul><li>Rest day. No new cards.</li><li>Optional: clear the greenhouse.</li></ul>`;
  return `
    <div class="box"><h3>Today's chores</h3>${plan}</div>
    <div class="box"><h3>This week's build</h3><div style="display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;align-items:center">${art(BUILDS[info.w + 1].key)}<div><b>${esc(info.week.build)}</b><p class="small">Finish all five lesson days and the Market Day quiz with 80% or better.</p></div></div></div>
    <div class="box"><h3>Greenhouse</h3><p class="small">${growing ? `${growing} card${growing === 1 ? " is" : "s are"} still growing. A quick review turns them into harvest.` : "No cards are waiting for review."}</p><button class="btn" id="openGreenhouse" ${growing ? "" : "disabled"}>Tend the greenhouse</button></div>`;
}

function wireToday(info) {
  const $ = id => document.getElementById(id);
  const go = d => { view = { day: d, card: 0, flipped: false, mode: "lesson", quiz: null, greenhouse: null }; renderToday(); };
  $("prevDay").onclick = () => go(view.day - 1);
  $("nextDay").onclick = () => go(view.day + 1);
  $("goToday").onclick = () => go(todayIndex());
  wirePacket(document.getElementById("panel-today"), v => view.flipped = v, () => view.flipped);
  if (info.kind === "lesson" && view.mode !== "greenhouse") {
    const n = info.lesson.cards.length;
    const move = k => { view.card = (k + n) % n; view.flipped = false; renderToday(); };
    $("prevCard").onclick = () => move(view.card - 1);
    $("nextCard").onclick = () => move(view.card + 1);
    document.querySelectorAll("[data-card]").forEach(b => b.onclick = () => move(Number(b.dataset.card)));
    keyNav = { prev: () => move(view.card - 1), next: () => move(view.card + 1) };
    if ($("markDone")) $("markDone").onclick = () => {
      state.lessonsDone[view.day] = iso(new Date()); state.xp += 20;
      markActive(); save();
      celebrate({ title: "Lesson complete!", desc: `${info.lesson.title} is in the barn. +20 bushels.`, color: "#4f9a55" });
      renderAll();
      setTimeout(() => { checkRibbons(); save(); renderAll(); }, 2600);
    };
    if ($("undoDone")) $("undoDone").onclick = () => { delete state.lessonsDone[view.day]; state.xp = Math.max(0, state.xp - 20); save(); renderAll(); };
  } else keyNav = null;
  if ($("known")) $("known").onclick = () => rate("known", info);
  if ($("growing")) $("growing").onclick = () => rate("growing", info);
  if ($("openGreenhouse")) $("openGreenhouse").onclick = () => {
    view.mode = "greenhouse"; view.flipped = false;
    view.greenhouse = { cards: allCards().filter(c => state.cards[c.id] === "growing").sort(() => Math.random() - .5), idx: 0 };
    renderToday();
  };
  if ($("leaveGreenhouse")) $("leaveGreenhouse").onclick = () => { view.mode = "lesson"; view.greenhouse = null; view.flipped = false; renderToday(); };
  document.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(Number(b.dataset.k), info));
  if ($("retryQuiz")) $("retryQuiz").onclick = () => { view.quiz = null; renderToday(); };
}

function rate(r, info) {
  if (view.mode === "greenhouse") {
    const c = view.greenhouse.cards[view.greenhouse.idx];
    if (r === "known") { state.cards[c.id] = "known"; state.rescued = (state.rescued || 0) + 1; state.xp += 3; }
    view.greenhouse.idx++; view.flipped = false;
  } else {
    const cards = info.lesson.cards, c = cards[view.card];
    const before = state.cards[c.id];
    state.cards[c.id] = r;
    if (r === "known" && before !== "known") state.xp += 5;
    view.card = (view.card + 1) % cards.length; view.flipped = false;
  }
  markActive(); checkRibbons(); save(); renderAll();
}
function answer(k, info) {
  const q = view.quiz, it = q.items[q.idx];
  if (q.answered) return;
  q.answered = true;
  const ok = it.opts[k].id === it.card.id;
  if (ok) { q.right++; state.xp += 5; }
  document.querySelectorAll(".opt").forEach((b, j) => { b.disabled = true; if (it.opts[j].id === it.card.id) b.classList.add("right"); else if (j === k) b.classList.add("wrong"); });
  setTimeout(() => {
    q.idx++; q.answered = false;
    if (q.idx >= q.items.length) {
      const pct = Math.round(q.right / q.items.length * 100);
      if (pct >= 80) state.market[info.w] = Math.max(state.market[info.w] || 0, pct);
      markActive(); checkRibbons(); save(); renderAll();
    } else { save(); renderToday(); renderStats(); }
  }, ok ? 650 : 1400);
}

/* Shared flip wiring for any panel holding a #packet. */
function wirePacket(root, setFlipped, getFlipped) {
  const pk = root.querySelector("#packet");
  if (!pk) return;
  const flip = () => { setFlipped(!getFlipped()); pk.classList.toggle("flipped", getFlipped()); };
  pk.onclick = flip;
  pk.onkeydown = e => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); flip(); } };
}

/* Card barn: browse every card freely. */
let lib = { filter: "all", order: null, idx: 0, flipped: false };
function libCards() {
  const pool = lib.filter === "all" ? allCards()
    : lib.filter === "growing" ? allCards().filter(c => state.cards[c.id] === "growing")
    : WEEKS[Number(lib.filter)].days.flatMap(d => d.cards);
  if (!lib.order) return pool;
  const byId = new Map(pool.map(c => [c.id, c]));
  return lib.order.map(id => byId.get(id)).filter(Boolean);
}
function renderLibrary() {
  const el = document.getElementById("panel-library");
  const cards = libCards();
  lib.idx = cards.length ? Math.min(lib.idx, cards.length - 1) : 0;
  const opts = [["all", "All 160 cards"], ...WEEKS.map((w, i) => [String(i), `Week ${i + 1}: ${w.title} (${w.chapters})`]), ["growing", "Still growing only"]];
  const c = cards[lib.idx];
  el.innerHTML = `<div class="library">
    <div class="libbar">
      <label for="libFilter" class="eyebrow">Show</label>
      <select id="libFilter">${opts.map(([v, t]) => `<option value="${v}" ${v === lib.filter ? "selected" : ""}>${esc(t)}</option>`).join("")}</select>
      <button class="btn" id="libShuffle">${lib.order ? "Unshuffle" : "Shuffle"}</button>
    </div>
    ${c ? `${cardHTML(c, lib.flipped, `Card ${lib.idx + 1} of ${cards.length}`)}
    <div class="cardnav"><button class="btn" id="libPrev">← Previous</button><span class="hint">${state.cards[c.id] === "known" ? "Harvested" : state.cards[c.id] === "growing" ? "Still growing" : "Not rated yet"}</span><button class="btn" id="libNext">Next →</button></div>
    <div class="rate"><button class="btn gold" id="libGrowing">Still growing</button><button class="btn primary" id="libKnown">Harvested it</button></div>
    <p class="hint">Flip and browse as much as you like. Arrow keys move, space flips.</p>`
    : `<div class="done-card">${art("seedling")}<h2>Nothing here yet</h2><p>No cards match this filter.</p></div>`}
  </div>`;
  const $ = id => document.getElementById(id);
  $("libFilter").onchange = e => { lib = { filter: e.target.value, order: null, idx: 0, flipped: false }; renderLibrary(); };
  $("libShuffle").onclick = () => { lib.order = lib.order ? null : libCards().map(x => x.id).sort(() => Math.random() - .5); lib.idx = 0; lib.flipped = false; renderLibrary(); };
  if (!c) return;
  const n = cards.length;
  const move = k => { lib.idx = (k + n) % n; lib.flipped = false; renderLibrary(); };
  $("libPrev").onclick = () => move(lib.idx - 1);
  $("libNext").onclick = () => move(lib.idx + 1);
  const rateLib = r => {
    const before = state.cards[c.id];
    state.cards[c.id] = r;
    if (r === "known" && before !== "known") { state.xp += 5; if (before === "growing") state.rescued = (state.rescued || 0) + 1; }
    markActive(); checkRibbons(); save();
    if (lib.filter !== "growing") lib.idx = (lib.idx + 1) % n;
    lib.flipped = false; renderAll();
  };
  $("libKnown").onclick = () => rateLib("known");
  $("libGrowing").onclick = () => rateLib("growing");
  wirePacket(el, v => lib.flipped = v, () => lib.flipped);
  libKeys = { prev: () => move(lib.idx - 1), next: () => move(lib.idx + 1) };
}

let currentTab = "today", keyNav = null, libKeys = null;
document.addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("input, select, textarea")) return;
  const nav = currentTab === "today" ? keyNav : currentTab === "library" ? libKeys : null;
  if (nav && e.key === "ArrowLeft") { e.preventDefault(); nav.prev(); }
  if (nav && e.key === "ArrowRight") { e.preventDefault(); nav.next(); }
  if (e.key === " " && !(e.target.closest && e.target.closest("button, #packet"))) {
    const pk = document.querySelector(`#panel-${currentTab} #packet`);
    if (pk) { e.preventDefault(); pk.click(); }
  }
});

function renderCalendar() {
  const el = document.getElementById("panel-calendar");
  const start = parseISO(state.start), t = todayIndex();
  el.innerHTML = `<div class="weeks">${WEEKS.map((wk, w) => `
    <article class="week ${weekComplete(w) ? "complete" : ""}">
      <div class="week-head">${art(BUILDS[w + 1].key)}<div><span class="eyebrow">Week ${w + 1} · ${fmt(addDays(start, w * 7))}–${fmt(addDays(start, w * 7 + 6))}</span><h3>${esc(wk.title)}</h3><p>${esc(wk.chapters)} · builds the ${esc(wk.build.toLowerCase())}</p></div></div>
      <ul class="days">${Array.from({ length: 7 }, (_, dow) => {
        const i = w * 7 + dow, info = dayInfo(i);
        const label = info.kind === "lesson" ? info.lesson.title : info.kind === "market" ? "Market Day quiz" : "Fallow day (rest)";
        const ok = info.kind === "lesson" ? state.lessonsDone[i] : info.kind === "market" ? state.market[w] != null : false;
        return `<li class="${i === t ? "today-row" : ""}"><button data-day="${i}"><span class="d">${DAY_NAMES[dow]} ${fmt(addDays(start, i))}</span><span class="t">${esc(label)}</span><span class="mark ${ok ? "ok" : info.kind === "rest" ? "rest" : ""}">${ok ? "✓" : ""}</span></button></li>`;
      }).join("")}</ul>
    </article>`).join("")}</div>`;
  el.querySelectorAll("[data-day]").forEach(b => b.onclick = () => {
    view = { day: Number(b.dataset.day), card: 0, flipped: false, mode: "lesson", quiz: null, greenhouse: null };
    selectTab("today");
  });
}
function renderRibbons() {
  const el = document.getElementById("panel-ribbons");
  const got = RIBBONS.filter(r => state.ribbons[r.id]).length;
  el.innerHTML = `<p class="eyebrow">${got} of ${RIBBONS.length} ribbons pinned</p><div class="ribbons">${RIBBONS.map(r => {
    const on = !!state.ribbons[r.id];
    return `<div class="ribbon ${on ? "" : "locked"}">${art("ribbon", r.color)}<div><h3>${esc(r.title)}</h3><p>${esc(r.desc)}${on ? ` Won ${fmt(parseISO(state.ribbons[r.id]))}.` : ""}</p></div></div>`;
  }).join("")}</div>`;
}

function selectTab(name) {
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === name)));
  currentTab = name;
  ["today", "calendar", "library", "ribbons"].forEach(n => document.getElementById("panel-" + n).hidden = n !== name);
  renderAll();
}
function renderAll() { renderFarm(); renderStats(); renderToday(); renderCalendar(); renderLibrary(); renderRibbons(); }

document.querySelectorAll("nav.tabs button").forEach(b => b.onclick = () => selectTab(b.dataset.tab));
const sd = document.getElementById("startDate");
sd.value = state.start;
sd.onchange = () => { if (sd.value) { state.start = sd.value; view.day = null; save(); renderAll(); } };
document.getElementById("bookLine").textContent = `${COURSE.book} · 8-week planting season`;

renderAll();
connectStore().then(() => { sd.value = state.start; });
})();
</script>
