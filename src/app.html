<title>Harvest Ledger</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Courier+Prime:wght@400;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: a farm almanac. Growing farm scene up top, seed-packet flash cards in the middle, planting calendar and fair ribbons below. */
:root {
  --bg: #eef2e6;
  --paper: #fbfbf4;
  --ink: #1e2a1c;
  --muted: #5a6955;
  --line: #d3dbc7;
  --field: #2e6a3e;
  --field-ink: #ffffff;
  --wheat: #c98a12;
  --wheat-soft: #f6e6bd;
  --barn: #b3372c;
  --sky: #cfe5f0;
  --sky-2: #e9f3f6;
  --soil: #6a4930;
  --good: #2e6a3e;
  --warn: #b06d00;
  --font-display: "Alfa Slab One", "Rockwell", "Roboto Slab", Georgia, serif;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --font-mono: "Courier Prime", "Courier New", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111813; --paper: #1a241c; --ink: #e6ede0; --muted: #9dad97; --line: #2e3d30;
    --field: #6cbf7d; --field-ink: #0f1a12; --wheat: #f0b640; --wheat-soft: #3a2f16; --barn: #e46a5e;
    --sky: #1c3242; --sky-2: #223a4b; --soil: #a37b5b; --good: #6cbf7d; --warn: #f0b640;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111813; --paper: #1a241c; --ink: #e6ede0; --muted: #9dad97; --line: #2e3d30;
  --field: #6cbf7d; --field-ink: #0f1a12; --wheat: #f0b640; --wheat-soft: #3a2f16; --barn: #e46a5e;
  --sky: #1c3242; --sky-2: #223a4b; --soil: #a37b5b; --good: #6cbf7d; --warn: #f0b640;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 1040px; margin: 0 auto; display: grid; gap: 22px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; text-wrap: balance; margin: 0; letter-spacing: .01em; }
h1 { font-size: clamp(1.9rem, 4.5vw, 2.8rem); line-height: 1.05; }
h2 { font-size: 1.45rem; line-height: 1.15; }
h3 { font-size: 1.1rem; }
p { margin: 0; }
.eyebrow { font-family: var(--font-mono); font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--wheat); outline-offset: 2px; }

/* ---------- Header + farm ---------- */
header.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; }
header.top .intro { display: grid; gap: 6px; min-width: 0; }
header.top .intro p { color: var(--muted); max-width: 60ch; }
.farm { position: relative; border-radius: 14px; overflow: hidden; border: 2px solid var(--ink); background: var(--sky); }
.farm svg { display: block; width: 100%; height: auto; }
.farm .locked { opacity: .16; filter: grayscale(1); }
.farm .unlocked { animation: rise .7s cubic-bezier(.2,1.4,.4,1) both; }
@keyframes rise { from { transform: translateY(12px); opacity: .2; } to { transform: none; opacity: 1; } }
.farm-cap { position: absolute; left: 12px; bottom: 10px; background: var(--paper); color: var(--ink); border: 2px solid var(--ink); border-radius: 999px; padding: 4px 12px; font-family: var(--font-mono); font-size: .8rem; }

.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.stat { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 2px; }
.stat b { font-family: var(--font-display); font-weight: 400; font-size: 1.6rem; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat span { font-size: .85rem; color: var(--muted); }
.bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; background: var(--field); border-radius: 99px; transition: width .5s; }

/* ---------- Tabs ---------- */
nav.tabs { display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 2px solid var(--ink); }
nav.tabs button { background: transparent; border: 2px solid transparent; border-bottom: 0; padding: 8px 16px; border-radius: 10px 10px 0 0; color: var(--muted); font-weight: 700; position: relative; top: 2px; }
nav.tabs button[aria-selected="true"] { background: var(--paper); color: var(--ink); border-color: var(--ink); border-bottom: 2px solid var(--paper); }
.panel { display: grid; gap: 20px; }

/* ---------- Today ---------- */
.today { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 22px; align-items: start; }
.lesson-head { display: grid; gap: 6px; }
.lesson-head .when { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: .78rem; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper); color: var(--muted); }
.chip.done { background: var(--field); color: var(--field-ink); border-color: var(--field); }
.chip.market { background: var(--wheat-soft); color: var(--ink); border-color: var(--wheat); }
.daynav { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 2px solid var(--ink); background: var(--paper); color: var(--ink); border-radius: 999px; padding: 6px 16px; font-weight: 700; }
.btn:hover { background: var(--sky-2); }
.btn.primary { background: var(--field); color: var(--field-ink); border-color: var(--field); }
.btn.gold { background: var(--wheat); color: #1e1a10; border-color: var(--wheat); }
.btn:disabled { opacity: .45; cursor: not-allowed; }

/* Seed packet card */
.deck { display: grid; gap: 14px; }
.packet { perspective: 1400px; cursor: pointer; }
.packet-inner { position: relative; transition: transform .55s cubic-bezier(.3,.7,.2,1); transform-style: preserve-3d; min-height: 430px; }
.packet.flipped .packet-inner { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: var(--paper); border: 2px solid var(--ink); border-radius: 6px 6px 14px 14px; display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; }
.face::before { content: ""; height: 14px; background: repeating-linear-gradient(90deg, var(--ink) 0 6px, transparent 6px 12px); opacity: .18; }
.face.back { transform: rotateY(180deg); }
.packet-art { background: var(--sky); border-block: 2px solid var(--ink); display: grid; place-items: center; padding: 10px; }
.packet-art svg { width: min(220px, 60%); height: auto; }
.face-body { padding: 16px 20px; display: grid; gap: 8px; align-content: start; }
.face-foot { display: flex; justify-content: space-between; gap: 10px; padding: 8px 20px 12px; font-family: var(--font-mono); font-size: .75rem; color: var(--muted); border-top: 1px dashed var(--line); flex-wrap: wrap; }
.term { font-family: var(--font-display); font-size: clamp(1.5rem, 3.6vw, 2.1rem); line-height: 1.1; text-wrap: balance; }
.prompt-line { color: var(--muted); }
.back-grid { display: grid; gap: 12px; padding: 18px 20px; align-content: start; overflow-y: auto; }
.back-grid .def { font-size: 1.08rem; max-width: 62ch; }
.onfarm { background: var(--wheat-soft); border: 1px solid var(--wheat); border-radius: 10px; padding: 10px 12px; display: grid; grid-template-columns: 54px minmax(0,1fr); gap: 10px; align-items: center; }
.onfarm svg { width: 54px; height: 54px; }
.onfarm b { font-family: var(--font-mono); font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; display: block; color: var(--muted); }
.rate { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.cardnav { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.dots { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.dots button { width: 16px; height: 16px; padding: 0; border-radius: 50%; border: 2px solid var(--ink); background: transparent; }
.dots button.known { background: var(--field); border-color: var(--field); }
.dots button.growing { background: var(--wheat); border-color: var(--wheat); }
.dots button.cur { outline: 2px solid var(--wheat); outline-offset: 2px; }
.complete { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 14px; align-items: center; background: var(--paper); border: 2px dashed var(--line); border-radius: 14px; padding: 12px 16px; }
.complete.done { border: 2px solid var(--field); background: var(--wheat-soft); }
.complete svg { width: 56px; height: 56px; }
.complete b { font-family: var(--font-display); font-weight: 400; font-size: 1.1rem; display: block; }
.complete span { color: var(--muted); font-size: .9rem; }
.complete-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.linkish { background: none; border: 0; color: var(--muted); text-decoration: underline; padding: 4px; }
.libbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.libbar select, .settings select { font: inherit; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; background: var(--paper); color: var(--ink); }
.library { max-width: 720px; width: 100%; margin: 0 auto; display: grid; gap: 14px; }
.hint { text-align: center; color: var(--muted); font-size: .85rem; }

.side { display: grid; gap: 14px; }
.box { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 8px; }
.box h3 { font-size: 1rem; }
.box ol, .box ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.box .small { font-size: .88rem; color: var(--muted); }

.done-card { background: var(--paper); border: 2px solid var(--ink); border-radius: 14px; padding: 22px; display: grid; gap: 12px; justify-items: center; text-align: center; }
.done-card svg { width: 120px; height: 120px; }

/* Market day quiz */
.quiz { background: var(--paper); border: 2px solid var(--ink); border-radius: 14px; padding: 18px 20px; display: grid; gap: 14px; }
.quiz .q { font-size: 1.1rem; max-width: 64ch; }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
.opt { text-align: left; border: 2px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 10px; padding: 10px 12px; font-weight: 600; }
.opt:hover:not(:disabled) { border-color: var(--ink); }
.opt.right { border-color: var(--good); background: var(--field); color: var(--field-ink); }
.opt.wrong { border-color: var(--barn); text-decoration: line-through; }

/* ---------- Calendar ---------- */
.weeks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.week { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: grid; grid-template-rows: auto 1fr; }
.week-head { display: grid; grid-template-columns: 72px minmax(0,1fr); gap: 12px; align-items: center; padding: 12px 14px; background: var(--sky-2); border-bottom: 1px solid var(--line); }
.week-head svg { width: 72px; height: 60px; }
.week-head .eyebrow { font-size: .7rem; }
.week-head p { font-size: .85rem; color: var(--muted); }
.week.complete .week-head { background: var(--wheat-soft); }
.days { list-style: none; margin: 0; padding: 6px 0; display: grid; }
.days li button { width: 100%; display: grid; grid-template-columns: 74px minmax(0,1fr) auto; gap: 10px; align-items: center; text-align: left; background: transparent; border: 0; padding: 6px 14px; color: var(--ink); }
.days li button:hover { background: var(--bg); }
.days li .d { font-family: var(--font-mono); font-size: .76rem; color: var(--muted); }
.days li .t { font-size: .92rem; min-width: 0; }
.days li.today-row button { background: var(--sky-2); font-weight: 700; }
.mark { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: .7rem; }
.mark.ok { background: var(--field); border-color: var(--field); color: var(--field-ink); }
.mark.rest { border-style: dashed; }

/* ---------- Ribbons ---------- */
.ribbons { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
.ribbon { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; grid-template-columns: 56px minmax(0,1fr); gap: 12px; align-items: center; }
.ribbon svg { width: 56px; height: 72px; }
.ribbon.locked svg { opacity: .25; filter: grayscale(1); }
.ribbon.locked h3 { color: var(--muted); }
.ribbon p { font-size: .85rem; color: var(--muted); }
.ribbon h3 { font-size: .98rem; }

.settings { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; font-size: .9rem; color: var(--muted); }
.settings input { font: inherit; border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; background: var(--paper); color: var(--ink); }
.saved { font-family: var(--font-mono); font-size: .75rem; color: var(--muted); }

/* Card extras */
.btn.small { padding: 4px 12px; font-size: .85rem; text-decoration: none; display: inline-flex; align-items: center; }
.card-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.modal { position: fixed; inset: 0; z-index: 60; background: rgba(15, 22, 16, .55); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal-card { position: relative; background: var(--paper); color: var(--ink); border: 2px solid var(--ink); border-radius: 16px; width: min(760px, 100%); max-height: 100%; overflow-y: auto; padding: 18px 20px; display: grid; gap: 12px; }
.modal-card #modalBody { display: grid; gap: 12px; min-width: 0; }
.modal-x { position: absolute; top: 12px; right: 12px; }
.anim { background: var(--sky); border: 2px solid var(--ink); border-radius: 12px; overflow-x: auto; }
.anim-svg { display: block; width: 100%; height: auto; }
.anim .st { opacity: .14; transition: opacity .6s, transform .6s; transform-box: fill-box; transform-origin: center; }
.anim .st.on { opacity: 1; }
.anim .st.cur { transform: scale(1.06); }
.anim .ring { fill: var(--paper); stroke: var(--line); stroke-width: 3; }
.anim .st.cur .ring { stroke: var(--wheat); stroke-width: 5; }
.anim .band { fill: var(--paper); stroke: var(--ink); stroke-width: 2; }
.anim .st.cur .band { fill: var(--wheat-soft); stroke: var(--wheat); stroke-width: 4; }
.anim .lbl { font-family: var(--font-body); font-weight: 700; font-size: 19px; fill: var(--ink); }
.anim .ar { stroke: var(--ink); stroke-width: 4; stroke-dasharray: 400; stroke-dashoffset: 400; opacity: 0; transition: stroke-dashoffset .9s ease, opacity .2s; }
.anim .ar.on { stroke-dashoffset: 0; opacity: 1; }
.anim .ah { fill: var(--ink); }
.anim-cap { display: grid; gap: 2px; min-height: 3.2em; }
.anim-cap b { font-family: var(--font-display); font-weight: 400; font-size: 1.2rem; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chat { display: grid; gap: 10px; max-height: 340px; overflow-y: auto; padding: 4px; }
.msg { padding: 10px 12px; border-radius: 12px; max-width: 88%; white-space: pre-wrap; }
.msg.me { justify-self: end; background: var(--field); color: var(--field-ink); }
.msg.bot { justify-self: start; background: var(--wheat-soft); border: 1px solid var(--wheat); }
.msg.err { border-color: var(--barn); }
.ask { display: flex; gap: 8px; flex-wrap: wrap; }
.ask input { flex: 1 1 200px; min-width: 0; font: inherit; border: 2px solid var(--line); border-radius: 999px; padding: 6px 14px; background: var(--bg); color: var(--ink); }
.small { font-size: .88rem; color: var(--muted); }

/* Field games */
.games { display: grid; gap: 16px; }
.game-menu { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.game-tile { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 14px; align-items: center; text-align: left; background: var(--paper); color: var(--ink); border: 2px solid var(--line); border-radius: 14px; padding: 14px; }
.game-tile:hover { border-color: var(--ink); }
.game-tile svg { width: 72px; height: 72px; }
.game-tile b { font-family: var(--font-display); font-weight: 400; font-size: 1.15rem; display: block; }
.game-tile span span { color: var(--muted); font-size: .9rem; }
.pool { display: flex; flex-wrap: wrap; gap: 8px; min-height: 44px; }
.chip-item { border: 2px solid var(--ink); background: var(--paper); color: var(--ink); border-radius: 999px; padding: 6px 14px; font-weight: 600; cursor: grab; }
.chip-item.sel { background: var(--wheat); border-color: var(--wheat); color: #1e1a10; }
.chip-item.shake { animation: shake .4s; border-color: var(--barn); }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.bins { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.bin { background: var(--paper); border: 2px solid var(--ink); border-radius: 0 0 12px 12px; padding: 0 12px 12px; display: grid; gap: 8px; align-content: start; min-height: 150px; cursor: pointer; }
.bin-roof { height: 16px; margin: 0 -12px; background: var(--barn); clip-path: polygon(0 100%, 50% 0, 100% 100%); }
.bin.over { background: var(--wheat-soft); }
.bin b { font-size: .95rem; }
.bin-items { display: flex; flex-wrap: wrap; gap: 6px; }
.placed { background: var(--field); color: var(--field-ink); border-radius: 999px; padding: 2px 10px; font-size: .82rem; }
.placed.late { background: var(--wheat); color: #1e1a10; }
.feedback { padding: 10px 12px; border-radius: 10px; }
.feedback.ok { background: var(--field); color: var(--field-ink); }
.feedback.no { background: var(--wheat-soft); border: 1px solid var(--wheat); }

/* Quizzes + tracker */
.quiz.long-opts .opts { grid-template-columns: minmax(0, 1fr); }
.quiz.long-opts .opt { font-weight: 400; }
.missed { text-align: left; background: var(--wheat-soft); border: 1px solid var(--wheat); border-radius: 10px; padding: 10px 14px; width: 100%; max-width: 480px; }
.missed ul { margin: 6px 0 0; padding-left: 20px; }
.weak { display: grid; gap: 16px; }
.weak-sum { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.weak-list { display: grid; gap: 10px; }
.weak-row { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto auto; gap: 14px; align-items: center; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
.weak-row > svg { width: 52px; height: 52px; }
.weak-main { display: grid; gap: 2px; min-width: 0; }
.weak-acts { display: flex; gap: 6px; align-items: center; }
.pill { font-family: var(--font-mono); font-size: .75rem; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.pill.bad { background: var(--barn); color: #fff; }
.pill.warn { background: var(--wheat); color: #1e1a10; }
.pill.good { background: var(--field); color: var(--field-ink); }
.study-art { border-radius: 10px; border: 2px solid var(--ink); }
.study-art svg { width: 140px; }

/* Toast + burst */
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 140%); background: var(--ink); color: var(--paper); border-radius: 14px; padding: 12px 18px; display: flex; gap: 12px; align-items: center; max-width: min(92vw, 460px); transition: transform .4s cubic-bezier(.2,1.3,.4,1); z-index: 50; }
.toast.show { transform: translate(-50%, 0); }
.toast svg { width: 40px; height: 52px; flex: none; }
.toast b { font-family: var(--font-display); font-weight: 400; display: block; }
.burst { position: fixed; inset: 0; pointer-events: none; z-index: 40; }

@media (max-width: 860px) {
  .today { grid-template-columns: minmax(0, 1fr); }
  .weeks { grid-template-columns: minmax(0, 1fr); }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 520px) {
  .opts { grid-template-columns: minmax(0,1fr); }
  .game-menu { grid-template-columns: minmax(0, 1fr); }
  .weak-row { grid-template-columns: 44px minmax(0, 1fr); }
  .weak-row > svg { width: 44px; height: 44px; }
  .weak-row .pill, .weak-acts { grid-column: 2; justify-self: start; }
  .complete { grid-template-columns: 44px minmax(0, 1fr); }
  .complete svg { width: 44px; height: 44px; }
  .complete .btn, .complete .linkish, .complete-actions { grid-column: 1 / -1; justify-content: flex-start; }
  .cardnav .btn { padding-inline: 10px; }
  .packet-inner { min-height: 470px; }
  .farm-cap { font-size: .68rem; left: 8px; bottom: 6px; padding: 2px 8px; }
  .days li button { grid-template-columns: 62px minmax(0,1fr) auto; padding-inline: 10px; }
}
@media (prefers-reduced-motion: reduce) {
  .packet-inner, .toast, .bar i { transition: none; }
  .farm .unlocked { animation: none; }
}
</style>

<div class="wrap">
  <header class="top">
    <div class="intro">
      <span class="eyebrow" id="bookLine">Principles of Management · 8-week planting season</span>
      <h1>Harvest Ledger</h1>

const ART_KEYS = Object.keys(ART);
function art(key, color) { const f = ART[key] || ART.seedling; return `<svg viewBox="0 0 100 100" aria-hidden="true">${f(color)}</svg>`; }

/* Farm scene: each week's build sits at a fixed spot. */
const BUILDS = [

  const items = BUILDS.map((b, i) => {

  const extraTrees = unlocked[7] ? `<g transform="translate(560 84) scale(.8)">${ART.apple()}</g><g transform="translate(640 90) scale(.8)">${ART.apple()}</g>` : "";
  const ribbon = unlocked[8] ? `<g transform="translate(740 20) scale(.7)">${ART.ribbon("#2b5fa8")}</g>` : "";

/* ================= Schedule ================= */
const LESSONS_PER_WEEK = 5;
const TOTAL_DAYS = WEEKS.length * 7;
function pad(n) { return String(n).padStart(2, "0"); }
function iso(d) { return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function parseISO(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function daysBetween(a, b) { return Math.round((parseISO(iso(b)) - parseISO(iso(a))) / 86400000); }
function fmt(d) { return d.toLocaleDateString(undefined, { month: "short", day: "numeric" }); }

function dayInfo(i) {
  const w = Math.floor(i / 7), dow = i % 7;
  const week = WEEKS[w];
  if (dow < LESSONS_PER_WEEK) return { i, w, dow, kind: "lesson", lesson: week.days[dow], week };
  if (dow === 5) return { i, w, dow, kind: "market", week };
  return { i, w, dow, kind: "rest", week };
}
function nextOpenDay(from) {
  for (let i = from + 1; i < TOTAL_DAYS; i++) {
    const d = dayInfo(i);
    if (d.kind === "lesson" && !state.lessonsDone[i]) return i;
    if (d.kind === "market" && state.market[d.w] == null) return i;
  }
  return -1;
}
function keepGoingHTML(from) {
  const n = nextOpenDay(from);
  if (n < 0) return "";
  const d = dayInfo(n);
  const label = d.kind === "lesson" ? d.lesson.title : `Market Day: ${d.week.title}`;
  return `<button class="btn primary" id="keepGoing" data-to="${n}">Keep going: ${esc(label)} →</button>`;
}
function allCards() { return WEEKS.flatMap(w => w.days.flatMap(d => d.cards)); }

/* ================= State + storage ================= */
const LS_KEY = "harvest-ledger-v1";
function defaultState() { return { start: iso(new Date()), cards: {}, lessonsDone: {}, market: {}, active: [], xp: 0, ribbons: {} }; }
let state = defaultState();
try { const raw = localStorage.getItem(LS_KEY); if (raw) state = Object.assign(defaultState(), JSON.parse(raw)); } catch (e) {}

let remote = null; // db doc reference when the account store is available
let saveTimer = null;
function save() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
  if (!remote) return;
  clearTimeout(saveTimer);
  setSaved("Saving…");
  saveTimer = setTimeout(() => {
    remote.set(JSON.parse(JSON.stringify(state))).then(() => setSaved("Saved to your account")).catch(() => setSaved("Saved on this device"));
  }, 600);
}
function setSaved(t) { document.getElementById("savedState").textContent = t; }

async function connectStore() {
  if (!window.claude || !window.claude.use) return;
  try {
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    remote = db.collection("data/users/" + id).doc("harvest-ledger");
    const snap = await remote.get();
    if (snap.exists) {
      state = Object.assign(defaultState(), JSON.parse(JSON.stringify(snap.data())));
      try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
      quietRibbons();
      renderAll();
      setSaved("Saved to your account");
    } else {
      save();
    }
  } catch (e) { remote = null; }
}

/* ================= Derived progress ================= */
function weekComplete(w) {
  for (let d = 0; d < LESSONS_PER_WEEK; d++) if (!state.lessonsDone[w * 7 + d]) return false;
  return state.market[w] != null;
}
function knownCount() { return Object.values(state.cards).filter(v => v === "known").length; }
function streak() {
  const set = new Set(state.active);
  let n = 0, d = new Date();
  if (!set.has(iso(d))) d = addDays(d, -1);
  while (set.has(iso(d))) { n++; d = addDays(d, -1); }
  return n;
}
function bestStreak() {
  const ds = [...new Set(state.active)].sort();
  let best = 0, run = 0, prev = null;
  for (const s of ds) { const d = parseISO(s); run = prev && daysBetween(prev, d) === 1 ? run + 1 : 1; best = Math.max(best, run); prev = d; }
  return best;
}
function markActive() { const t = iso(new Date()); if (!state.active.includes(t)) state.active.push(t); }
function farmUnlocks() {
  const anyLesson = Object.keys(state.lessonsDone).length > 0;
  return [anyLesson, ...WEEKS.map((_, w) => weekComplete(w))];
}

const RIBBONS = [

function quietRibbons() { RIBBONS.forEach(r => { if (r.test()) state.ribbons[r.id] = state.ribbons[r.id] || iso(new Date()); }); }
function checkRibbons() {

/* ================= Celebration ================= */
let toastTimer;
function celebrate(r) {
  const t = document.getElementById("toast");
  t.innerHTML = `${art("ribbon", r.color)}<div><b>${r.title}</b><span>${r.desc}</span></div>`;
  t.classList.add("show");
  if (r.sound !== false) Sound.play(/^week/.test(r.id || "") ? "moo" : "fanfare");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2400);
  burst();
}
function burst() {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = document.getElementById("burst"), ctx = c.getContext("2d");
  c.width = innerWidth; c.height = innerHeight;
  const cols = ["#e0a526", "#4f9a55", "#c8352a", "#f4c542", "#6cbf7d"];
  const ps = Array.from({ length: 70 }, () => ({ x: innerWidth / 2, y: innerHeight * .7, vx: (Math.random() - .5) * 12, vy: -Math.random() * 13 - 4, r: Math.random() * Math.PI, c: cols[Math.floor(Math.random() * cols.length)], s: 5 + Math.random() * 6 }));
  let f = 0;
  (function tick() {
    ctx.clearRect(0, 0, c.width, c.height);
    ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .35; p.r += .15; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.beginPath(); ctx.ellipse(0, 0, p.s, p.s / 2.4, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore(); });
    if (++f < 90) requestAnimationFrame(tick); else ctx.clearRect(0, 0, c.width, c.height);
  })();
}

function makeQuiz(w, pool) {

  return { w, items, idx: 0, right: 0, answered: false };

function wireToday(info) {
  const $ = id => document.getElementById(id);
  const go = d => { view = { day: d, card: 0, flipped: false, mode: "lesson", quiz: null, greenhouse: null }; renderToday(); };
  $("prevDay").onclick = () => go(view.day - 1);
  $("nextDay").onclick = () => go(view.day + 1);
  $("goToday").onclick = () => go(todayIndex());
  wirePacket(document.getElementById("panel-today"), v => view.flipped = v, () => view.flipped);
  wireDquiz(info);
  if (info.kind === "lesson" && view.mode === "lesson") {
    const n = info.lesson.cards.length;
    const move = k => { view.card = (k + n) % n; view.flipped = false; renderToday(); };
    $("prevCard").onclick = () => move(view.card - 1);
    $("nextCard").onclick = () => move(view.card + 1);
    document.querySelectorAll("[data-card]").forEach(b => b.onclick = () => move(Number(b.dataset.card)));
    keyNav = { prev: () => move(view.card - 1), next: () => move(view.card + 1) };
    if ($("markDone")) $("markDone").onclick = () => {
      state.lessonsDone[view.day] = iso(new Date()); state.xp += 20;
      markActive(); save(); Sound.play("rooster");
      celebrate({ sound: false, title: "Lesson complete!", desc: `${info.lesson.title} is in the barn. +20 bushels.`, color: "#4f9a55" });
      renderAll();
      setTimeout(() => { checkRibbons(); save(); renderAll(); }, 2600);
    };
    if ($("undoDone")) $("undoDone").onclick = () => { delete state.lessonsDone[view.day]; state.xp = Math.max(0, state.xp - 20); save(); renderAll(); };
  } else keyNav = null;
  if ($("known")) $("known").onclick = () => rate("known", info);
  if ($("growing")) $("growing").onclick = () => rate("growing", info);
  if ($("openWeak")) $("openWeak").onclick = () => selectTab("weak");
  if ($("openGreenhouse")) $("openGreenhouse").onclick = () => {
    view.mode = "greenhouse"; view.flipped = false;
    view.greenhouse = { cards: allCards().filter(c => state.cards[c.id] === "growing").sort(() => Math.random() - .5), idx: 0 };

  };

  document.querySelectorAll(".opt[data-k]").forEach(b => b.onclick = () => answer(Number(b.dataset.k), info));
  if ($("keepGoing")) $("keepGoing").onclick = () => { go(Number($("keepGoing").dataset.to)); window.scrollTo({ top: document.getElementById("panel-today").offsetTop - 20, behavior: "smooth" }); };
  if ($("retryQuiz")) $("retryQuiz").onclick = () => { view.quiz = null; renderToday(); };
}

function rate(r, info) {
  Sound.play(r === "known" ? "pop" : "seed");
  if (view.mode === "greenhouse") {
    const c = view.greenhouse.cards[view.greenhouse.idx];
    if (r === "known") { state.cards[c.id] = "known"; state.rescued = (state.rescued || 0) + 1; state.xp += 3; }
    view.greenhouse.idx++; view.flipped = false;
  } else {
    const cards = info.lesson.cards, c = cards[view.card];
    const before = state.cards[c.id];
    state.cards[c.id] = r;
    if (r === "known" && before !== "known") state.xp += 5;
    view.card = (view.card + 1) % cards.length; view.flipped = false;
  }
  markActive(); checkRibbons(); save(); renderAll();
}
function answer(k, info) {
  const q = view.quiz, it = q.items[q.idx];
  if (q.answered) return;
  q.answered = true;
  const ok = it.opts[k].id === it.card.id;
  if (ok) trackHit(it.card.id); else trackMiss(it.card.id, "market");
  if (ok) { q.right++; state.xp += 5; }
  Sound.play(ok ? "register" : "buzz");
  document.querySelectorAll(".opt[data-k]").forEach((b, j) => { b.disabled = true; if (it.opts[j].id === it.card.id) b.classList.add("right"); else if (j === k) b.classList.add("wrong"); });
  setTimeout(() => {
    q.idx++; q.answered = false;
    if (q.idx >= q.items.length) {
      const pct = Math.round(q.right / q.items.length * 100);
      if (pct >= 80) state.market[info.w] = Math.max(state.market[info.w] || 0, pct);
      markActive(); checkRibbons(); save(); renderAll();
    } else { save(); renderToday(); renderStats(); }
  }, ok ? 650 : 1400);
}

/* Shared flip wiring for any panel holding a #packet. */
function wirePacket(root, setFlipped, getFlipped) {
  const pk = root.querySelector("#packet");
  if (!pk) return;
  const flip = () => { setFlipped(!getFlipped()); pk.classList.toggle("flipped", getFlipped()); Sound.play("flip"); };
  pk.onclick = e => { if (e.target.closest("a, .card-actions")) return; flip(); };
  pk.onkeydown = e => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); flip(); } };
}

/* ================= Sound ================= */
const Sound = (() => {
  let on = true, ctx = null;
  try { on = localStorage.getItem("harvest-ledger-sound") !== "off"; } catch (e) {}
  function ac() {
    if (!ctx) { const A = window.AudioContext || window.webkitAudioContext; if (!A) return null; ctx = new A(); }
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  function tone(type, f0, f1, dur, vol, at, filter) {
    const c = ac(); if (!c) return;
    const t = c.currentTime + (at || 0);
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + Math.min(.05, dur / 4)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    let node = o;
    if (filter) { const f = c.createBiquadFilter(); f.type = filter[0]; f.frequency.value = filter[1]; o.connect(f); node = f; }
    node.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + .05);
  }
  function noise(dur, vol, at, hp) {
    const c = ac(); if (!c) return;
    const t = c.currentTime + (at || 0);
    const buf = c.createBuffer(1, Math.floor(c.sampleRate * dur), c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = buf; f.type = "highpass"; f.frequency.value = hp || 2000; g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
  }
  const fx = {
    flip: () => noise(.09, .18, 0, 2500),
    pop: () => { tone("sine", 660, 990, .12, .25); tone("sine", 990, 1320, .14, .18, .08); },
    seed: () => tone("triangle", 330, 260, .18, .2),
    moo: () => { tone("sawtooth", 150, 105, 1.1, .22, 0, ["lowpass", 700]); tone("sawtooth", 152, 108, 1.1, .12, .02, ["lowpass", 500]); },
    rooster: () => { [[520, 900, .14], [900, 760, .12], [760, 1150, .22], [1150, 640, .45]].reduce((at, [a, b, d]) => { tone("square", a, b, d, .09, at, ["bandpass", 1200]); return at + d * .9; }, 0); },
    register: () => { noise(.06, .2, 0, 4000); tone("sine", 1318, 1318, .5, .2, .05); tone("sine", 1760, 1760, .6, .15, .12); },
    buzz: () => tone("square", 140, 110, .28, .08, 0, ["lowpass", 900]),
    fanfare: () => { [523, 659, 784, 1047].forEach((f, i) => tone("triangle", f, f, .22, .2, i * .12)); }
  };
  return {
    get on() { return on; },
    toggle() { on = !on; try { localStorage.setItem("harvest-ledger-sound", on ? "on" : "off"); } catch (e) {} if (on) fx.pop(); return on; },
    play(name) { if (on && fx[name]) try { fx[name](); } catch (e) {} }
  };
})();

function animSVG(a) {

    const size = n > 5 ? 64 : 76, xs = a.steps.map((_, i) => n === 1 ? 320 : 60 + i * (520 / (n - 1)));
    a.steps.forEach((s, i) => { parts.push(node(i, xs[i], 120, size, s)); if (i < n - 1) arrows.push(arrow(i + 1, xs[i] + size * .65, 120, xs[i + 1] - size * .7, 120)); });
  } else if (a.layout === "cycle") {
    const cx = 320, cy = 150, r = 100, size = 68;
    const pt = i => [cx + Math.cos(-Math.PI / 2 + i * 2 * Math.PI / n) * r * 1.7, cy + Math.sin(-Math.PI / 2 + i * 2 * Math.PI / n) * r * .95];
    h = 330;
    a.steps.forEach((s, i) => {
      const [x, y] = pt(i), [x2, y2] = pt((i + 1) % n);
      parts.push(node(i, x, y, size, s));
      const dx = x2 - x, dy = y2 - y, L = Math.hypot(dx, dy), k = 58 / L;
      arrows.push(arrow((i + 1) % n === 0 ? n : i + 1, x + dx * k, y + dy * k, x2 - dx * k, y2 - dy * k));
    });
  } else if (a.layout === "pyramid") {
    const band = 230 / n;
    a.steps.forEach((s, i) => {
      const yb = 260 - i * band, yt = yb - band + 4, wb = 520 - i * (380 / n), wt = 520 - (i + 1) * (380 / n);
      parts.push(`<g class="st" data-i="${i}"><polygon class="band" points="${320 - wb / 2},${yb} ${320 + wb / 2},${yb} ${320 + wt / 2},${yt} ${320 - wt / 2},${yt}"/><g transform="translate(${320 - wt / 2 + 6} ${yt + 2}) scale(${(band - 8) / 100})">${stepArt(s)}</g><text x="${330}" y="${(yb + yt) / 2 + 6}" text-anchor="middle" class="lbl">${esc(s[0])}</text></g>`);
    });
  } else {
    h = 310;
    const pos = [[320, 150], [320, 50], [540, 150], [320, 252], [100, 150]], size = 64;
    a.steps.forEach((s, i) => { parts.push(node(i, pos[i][0], pos[i][1], i ? size : 84, s)); if (i) { const [x, y] = pos[i], dx = 320 - x, dy = 150 - y, L = Math.hypot(dx, dy); arrows.push(arrow(i, x + dx / L * 48, y + dy / L * 48, 320 - dx / L * 62, 150 - dy / L * 62)); } });
  }
  return `<svg viewBox="0 0 640 ${h}" class="anim-svg" role="img" aria-label="Animated diagram"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" class="ah"/></marker></defs>${arrows.join("")}${parts.join("")}</svg>`;
}

let tutorApi = null;

async function connectTutor() {

function openTutor(c) {
  const chat = [];
  let busy = null;
  openModal(`<span class="eyebrow">Farm tutor · §${esc(c.section)}</span><h2>${esc(c.term)}</h2>
    <div class="chips">${["Explain it simply", "Give me another farm example", "Quiz me on this", "How does this connect to other ideas?"].map(q => `<button class="btn" data-q="${esc(q)}">${esc(q)}</button>`).join("")}</div>

    <form class="ask" id="askForm"><label for="askInput" class="sr">Your question</label><input id="askInput" autocomplete="off" placeholder="Ask about ${esc(c.term)}…"><button class="btn primary" type="submit">Ask</button></form>`);
  const chatEl = document.getElementById("chat");
  const bubble = (who, text) => { const p = document.createElement("div"); p.className = "msg " + who; p.textContent = text; chatEl.appendChild(p); chatEl.scrollTop = chatEl.scrollHeight; return p; };
  const intro = `You are a warm, encouraging tutor for a student taking a Principles of Management course (textbook: ${COURSE.book}). The student loves farming, so explain with farm and agriculture examples. Keep every answer under 140 words, in plain sentences with no markdown headings. If asked to quiz, ask one question at a time and wait for the answer.

Concept: ${c.term} (textbook section ${c.section})
Definition: ${c.definition}
Farm example already shown on the card: ${c.farm}`;
  async function ask(q) {
    if (!q || busy) return;
    chatEl.querySelector(".small") && chatEl.querySelector(".small").remove();
    bubble("me", q);
    chat.push({ role: "user", content: chat.length ? q : intro + "\n\nStudent: " + q });
    const out = bubble("bot", "Thinking…");
    busy = new AbortController();
    try {
      const r = await tutorApi(chat, { onText: u => { out.textContent = u.text; chatEl.scrollTop = chatEl.scrollHeight; }, signal: busy.signal, modelTier: "quick", cache: false });
      out.textContent = r.text; chat.push({ role: "assistant", content: r.text });
      state.tutorQs = (state.tutorQs || 0) + 1; markActive(); checkRibbons(); save(); renderStats();
    } catch (e) {
      chat.pop();
      out.textContent = e && e.code === "not_granted" ? "The tutor needs permission to use Claude on this page. Allow it from the page's permissions, then ask again."
        : e && e.code === "rate_limited" ? "The tutor needs a short break. Try again in a minute."
        : e && e.name === "AbortError" ? "Stopped." : "The tutor couldn't answer just now. Try again in a moment.";
      out.classList.add("err");
    } finally { busy = null; }
  }
  document.querySelectorAll("[data-q]").forEach(b => b.onclick = () => ask(b.dataset.q));
  document.getElementById("askForm").onsubmit = e => { e.preventDefault(); const i = document.getElementById("askInput"); const q = i.value.trim(); i.value = ""; ask(q); };
  modalOnClose = () => { if (busy) busy.abort(); };
}

let game = { w: null, mode: null };
function shuffle(a) { return a.map(x => [Math.random(), x]).sort((p, q) => p[0] - q[0]).map(p => p[1]); }

  const paren = (term.match(/\((.*?)\)/) || [])[1];
  if (paren && norm(paren) === g) return true;
  const words = t.split(" ").filter(w => w.length > 3 && !["theory", "model", "framework", "analysis"].includes(w));
  return words.length > 0 && words.every(w => g.includes(w.slice(0, 5)));
}
function startGame(mode) {

function startWeakPractice() {
  const ids = shuffle(weakOpen()).slice(0, 8);
  if (!ids.length) return;
  weak.q = buildQuiz(ids.map(id => CARD_BY_ID.get(id)), "tracker");
  renderWeak();
}

/* Sound toggle */
const st = document.getElementById("soundToggle");
const paintSound = () => { st.textContent = Sound.on ? "Sound on" : "Sound off"; st.setAttribute("aria-pressed", String(Sound.on)); };
st.onclick = () => { Sound.toggle(); paintSound(); };
paintSound();

document.querySelectorAll("nav.tabs button").forEach(b => b.onclick = () => selectTab(b.dataset.tab));
const sd = document.getElementById("startDate");
sd.value = state.start;
sd.onchange = () => { if (sd.value) { state.start = sd.value; view.day = null; save(); renderAll(); } };
document.getElementById("bookLine").textContent = `${COURSE.book} · 8-week planting season`;

renderAll();
connectTutor();
connectStore().then(() => { sd.value = state.start; });
})();
</script>
