<title>OC Connect</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: Cabernet rail (Connect / Me / My team), one calm content column on warm white, an assistant that docks on the right.
   Brand: Okanagan College red ("cherry", CMYK 0/100/52/0) leads; Cabernet carries headings and the rail. Hex values are approximations. */
:root{
  --bg:#F7F5F5; --surface:#FFFFFF; --sunk:#F0ECEC; --line:#E4DDDE;
  --ink:#1E1416; --ink-2:#56494C; --ink-3:#8A7C7F;
  --accent:#D50032; --accent-ink:#FFFFFF; --accent-soft:#FBE3E8;
  --cabernet:#6B1E35; --rail:#5E1A2F; --rail-ink:#FFFFFF; --rail-ink-2:#E9C9D1; --rail-hover:#74243C; --rail-active:#FFFFFF;
  --ai:#6B1E35; --ai-soft:#F4E6EA;
  --warn:#9A5208; --warn-soft:#FAEBD7; --bad:#A3161F; --bad-soft:#F9E1E1;
  --good:#1C7440; --good-soft:#DEF1E4; --av-ink:#FFFFFF;
  --shadow:0 1px 2px rgba(30,20,22,.06),0 8px 24px rgba(30,20,22,.06);
  --f-display:"Modern Era","Hanken Grotesk",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Hanken Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121012; --surface:#1B1719; --sunk:#241F21; --line:#342C2F;
  --ink:#F1ECED; --ink-2:#BBADB0; --ink-3:#8C7E81;
  --accent:#FF4D6D; --accent-ink:#2A0510; --accent-soft:#3A1520;
  --cabernet:#F2B8C6; --rail:#2A1219; --rail-ink:#FFFFFF; --rail-ink-2:#D6AEB8; --rail-hover:#3A1A24; --rail-active:#FFFFFF;
  --ai:#F2B8C6; --ai-soft:#33171F;
  --warn:#F0AA55; --warn-soft:#382813; --bad:#F2857A; --bad-soft:#3A1A17;
  --good:#62CC88; --good-soft:#133020; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121012; --surface:#1B1719; --sunk:#241F21; --line:#342C2F;
  --ink:#F1ECED; --ink-2:#BBADB0; --ink-3:#8C7E81;
  --accent:#FF4D6D; --accent-ink:#2A0510; --accent-soft:#3A1520;
  --cabernet:#F2B8C6; --rail:#2A1219; --rail-ink:#FFFFFF; --rail-ink-2:#D6AEB8; --rail-hover:#3A1A24; --rail-active:#FFFFFF;
  --ai:#F2B8C6; --ai-soft:#33171F;
  --warn:#F0AA55; --warn-soft:#382813; --bad:#F2857A; --bad-soft:#3A1A17;
  --good:#62CC88; --good-soft:#133020; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{margin:0;font-family:var(--f-display);font-weight:700;letter-spacing:-.015em;text-wrap:balance;color:var(--cabernet)}
h1{font-size:2rem;line-height:1.12;font-weight:800}
h2{font-size:1.15rem}
h3{font-size:1rem;font-family:var(--f-body);font-weight:600}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:.86em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3);font-size:.85rem}
.label{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}

/* Shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:22px;
  padding-block:22px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:14px;background:var(--rail);color:var(--rail-ink)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:1.25rem;color:var(--rail-ink);letter-spacing:-.01em}
.brand-mark{width:34px;height:34px;border-radius:4px;background:#D50032;display:grid;place-items:center;font-weight:800}
.brand-mark{color:#FFFFFF;font-size:.85rem;letter-spacing:.01em}
.navgroup{display:flex;flex-direction:column;gap:2px}
.navgroup .label,.rail-foot .label{padding:0 10px 6px;color:var(--rail-ink-2)}
.navlink{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;color:var(--rail-ink-2);text-decoration:none;font-weight:500}
.navlink:hover{background:var(--rail-hover);color:var(--rail-ink)}
.navlink[aria-current="page"]{background:var(--rail-hover);color:var(--rail-active);box-shadow:inset 3px 0 0 #FF4D6D;font-weight:600}
.navlink .count{margin-left:auto;font-size:.75rem;background:#D50032;color:#FFFFFF;padding:0 7px;border-radius:99px;font-weight:700}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.seg{display:flex;background:var(--rail-hover);border-radius:8px;padding:3px}
.seg button{flex:1;border:0;background:none;padding:5px 8px;border-radius:6px;cursor:pointer;color:var(--rail-ink-2);font-size:.85rem;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--rail-ink);color:#5E1A2F;font-weight:600}
.linkbtn{border:0;background:none;padding:0;color:var(--rail-ink-2);cursor:pointer;font-size:.8rem;text-align:left;text-decoration:underline}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:12px;
  padding-block:14px;padding-left:36px;padding-right:max(20px,env(safe-area-inset-right,0px));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px)}
.top .menu-btn{display:none}
.askbar{flex:1;max-width:560px;display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:6px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink-3);cursor:text;text-align:left}
.askbar:hover{border-color:var(--ai)}
.askbar .spark{color:var(--ai)}
.askbar kbd{margin-left:auto;font-family:var(--f-mono);font-size:.72rem;border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--ink-3)}
.me-chip{margin-left:auto;display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);font-weight:500}
#view{padding-block:12px 64px;padding-left:36px;padding-right:max(20px,env(safe-area-inset-right,0px));width:100%;max-width:1120px;display:flex;flex-direction:column;gap:28px}

.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.page-head p{margin-top:6px}

/* Building blocks */
.panel{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:20px;align-items:start}
.cols-2-1{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.row > .grow{flex:1;min-width:0}
.list{display:flex;flex-direction:column}
.list > *{padding-block:12px;border-top:1px solid var(--line)}
.list > *:first-child{border-top:0;padding-top:0}
.list > *:last-child{padding-bottom:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  padding:7px 14px;border-radius:4px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap;font-size:.92rem}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ai{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.quiet:hover{background:var(--sunk);color:var(--ink)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:.84rem}
.btn:disabled{opacity:.5;cursor:not-allowed}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:.76rem;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap;background:var(--sunk);color:var(--ink-2)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.pending{background:var(--warn-soft);color:var(--warn)}
.pill.approved,.pill.active{background:var(--good-soft);color:var(--good)}
.pill.paid{background:var(--accent-soft);color:var(--accent)}
.pill.declined,.pill.leaving{background:var(--bad-soft);color:var(--bad)}
.pill.ai{background:var(--ai-soft);color:var(--ai)}

.av{flex:none;display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:hsl(var(--h) 38% 42%);color:var(--av-ink);font-weight:600;font-size:.8rem;letter-spacing:.02em}
.av.lg{width:64px;height:64px;font-size:1.3rem}
.av.sm{width:26px;height:26px;font-size:.68rem}

.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field > span{font-size:.82rem;font-weight:500;color:var(--ink-2)}
input[type=text],input[type=date],input[type=number],input[type=email],input[type=tel],input[type=search],select,textarea{
  width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-width:0}
textarea{resize:vertical;min-height:72px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px}
.hint{font-size:.84rem;padding:8px 12px;border-radius:8px;background:var(--sunk);color:var(--ink-2)}
.hint.warn{background:var(--warn-soft);color:var(--warn)}
.hint.bad{background:var(--bad-soft);color:var(--bad)}
.hint.ai{background:var(--ai-soft);color:var(--ai)}

.meter{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.meter > i{display:block;height:100%;background:var(--accent);border-radius:99px}
.big{font-family:var(--f-display);font-size:2rem;font-weight:800;color:var(--cabernet);line-height:1;font-variant-numeric:tabular-nums}

.table-wrap{overflow-x:auto;margin-inline:-4px}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th{text-align:left;font-weight:600;color:var(--ink-3);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;padding:0 8px 8px}
td{padding:11px 8px;border-top:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 11px;font-size:.84rem;cursor:pointer;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--cabernet);color:var(--surface);border-color:var(--cabernet)}
.tag{display:inline-flex;align-items:center;gap:4px;background:var(--sunk);border-radius:6px;padding:2px 8px;font-size:.82rem;color:var(--ink-2)}
.tag button{border:0;background:none;padding:0;cursor:pointer;color:var(--ink-3);line-height:1}

/* Home */
.hero-ask{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);border-top:4px solid var(--accent);padding:22px;display:flex;flex-direction:column;gap:14px}
.hero-ask form{display:flex;gap:10px}
.hero-ask input{flex:1;font-size:1.05rem;padding:12px 14px;border-radius:6px}
.suggest{display:flex;flex-wrap:wrap;gap:8px}
.suggest button{border:1px dashed var(--line);background:none;border-radius:99px;padding:5px 12px;font-size:.86rem;color:var(--ink-2);cursor:pointer}
.suggest button:hover{border-color:var(--ai);color:var(--ai)}
.todo{display:flex;align-items:center;gap:12px}
.todo .dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--warn)}
.todo .dot.info{background:var(--accent)}
.event{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:center}
.cal{border-radius:8px;background:var(--sunk);text-align:center;padding:5px 0;line-height:1.1}
.cal b{display:block;font-family:var(--f-display);font-size:1.2rem;color:var(--accent)}
.cal small{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}
.catchup{border-left:3px solid var(--ai);padding-left:12px;white-space:pre-wrap}

/* News */
.post{display:flex;flex-direction:column;gap:10px}
.post .body{color:var(--ink-2);max-width:68ch}
.ack{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 12px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-size:.9rem}
.ack.done{background:var(--good-soft);color:var(--good)}
.react{display:flex;gap:6px;flex-wrap:wrap}
.react button{border:1px solid var(--line);background:none;border-radius:99px;padding:2px 10px;font-size:.84rem;cursor:pointer;color:var(--ink-2)}
.react button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}

/* People */
.people-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:14px}
.person{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;display:flex;gap:12px;align-items:center;border:0;text-align:left;cursor:pointer;min-width:0}
.person:hover{outline:1px solid var(--line)}
.person .grow{min-width:0}
.person b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person small{display:block;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Who's out grid */
.outgrid{display:grid;gap:4px;min-width:560px}
.outgrid .hd{font-size:.72rem;color:var(--ink-3);text-align:center;line-height:1.2}
.outgrid .hd b{display:block;color:var(--ink-2);font-size:.85rem}
.outgrid .nm{display:flex;align-items:center;gap:8px;font-size:.88rem;white-space:nowrap;padding-right:8px}
.outgrid .c{height:28px;border-radius:6px;background:var(--sunk)}
.outgrid .c.out{background:var(--accent)}
.outgrid .c.pend{background:repeating-linear-gradient(135deg,var(--warn-soft) 0 6px,var(--surface) 6px 10px);outline:1px solid var(--warn)}
.outgrid .c.today{box-shadow:inset 0 0 0 2px var(--ink-3)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.8rem;color:var(--ink-3)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}

/* Assistant drawer */
.ai-panel{position:fixed;top:0;right:0;bottom:0;width:min(420px,100vw);z-index:40;background:var(--surface);box-shadow:-12px 0 40px rgba(0,0,0,.14);
  display:flex;flex-direction:column;transform:translateX(105%);transition:transform .22s ease;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.ai-panel.open{transform:none}
.ai-head{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.ai-head h2{font-size:1.05rem;white-space:nowrap}
.ai-log{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:92%;padding:10px 13px;border-radius:12px;white-space:pre-wrap;font-size:.94rem}
.msg.user{align-self:flex-end;background:var(--cabernet);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--sunk);border-bottom-left-radius:4px}
.msg.status{align-self:flex-start;background:none;color:var(--ink-3);font-size:.84rem;padding:0 2px}
.proposal{align-self:stretch;border:1px solid var(--ai);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.proposal.done{border-color:var(--line);opacity:.8}
.proposal .label{color:var(--ai)}
.ai-form{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}
.ai-form input{flex:1}
.ai-note{padding:0 18px 10px;font-size:.78rem;color:var(--ink-3)}
.scrim{position:fixed;inset:0;background:rgba(10,14,16,.35);z-index:35}
.spark-ico{color:var(--ai)}

/* Modal + toast */
.modal-wrap{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(10,14,16,.4)}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);width:min(520px,100%);max-height:90vh;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:16px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:10px;font-size:.92rem;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}

/* Work queue */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--ink-2);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--cabernet);border-bottom-color:var(--accent)}
.tcount{display:inline-block;min-width:20px;padding:0 6px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-size:.74rem;text-align:center;margin-left:4px}
.qrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.qrow > .grow{flex:1;min-width:min(100%,220px)}
.qkind{flex:none;width:78px;font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.thread{display:flex;flex-direction:column;gap:14px;padding:14px;background:var(--sunk);border-radius:8px}
.pill.resolved{background:var(--good-soft);color:var(--good)}
.pill.needs{background:var(--accent-soft);color:var(--accent)}
.day-group{display:flex;flex-direction:column;gap:8px}
.day-group + .day-group{margin-top:10px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

@media (max-width:900px){
  .cols-2-1{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;inset:0 auto 0 0;width:min(280px,86vw);z-index:45;transform:translateX(-105%);transition:transform .2s ease;
    padding-top:calc(22px + env(safe-area-inset-top,0px));background:var(--rail)}
  .rail.open{transform:none}
  .top .menu-btn{display:inline-flex}
  .top,#view{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .me-chip span{display:none}
  .askbar kbd{display:none}
  h1{font-size:1.55rem}
  .hero-ask form{flex-direction:column}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <nav class="rail" id="rail" aria-label="Main"></nav>
  <div class="main">
    <header class="top">
      <button class="btn quiet menu-btn" data-act="menu" aria-label="Open menu"><svg class="i"><use href="#i-menu"/></svg></button>
      <button class="askbar" data-act="ask" aria-label="Ask Connect">
        <svg class="i spark"><use href="#i-spark"/></svg><span>Ask Connect to book, claim, find or explain…</span><kbd>Ctrl K</kbd>
      </button>
      <a class="me-chip" href="#profile" id="meChip"></a>
    </header>
    <main id="view"></main>
  </div>
</div>

<aside class="ai-panel" id="ai" aria-label="OC Connect assistant" aria-hidden="true">
  <div class="ai-head">
    <svg class="i spark-ico"><use href="#i-spark"/></svg>
    <h2>Ask Connect</h2>
    <span class="pill ai" id="aiMode">Assistant</span>
    <button class="btn quiet sm" data-act="ai-clear" style="margin-left:auto">Clear</button>
    <button class="btn quiet sm" data-act="ai-close" aria-label="Close assistant"><svg class="i"><use href="#i-x"/></svg></button>
  </div>
  <div class="ai-log" id="aiLog" aria-live="polite"></div>
  <p class="ai-note" id="aiNote">Connect prepares actions as cards. Nothing is sent until you press the button on the card.</p>

/* ---------- Dates ---------- */
const DAY = 864e5;
const TODAY = (() => { const t = new Date(); t.setHours(0,0,0,0); return t; })();
const pad = n => String(n).padStart(2, "0");
const iso = x => `${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => iso(new Date(parse(s).getTime() + n*DAY + 3600e3));
const isWeekend = x => x.getDay() === 0 || x.getDay() === 6;
const todayIso = iso(TODAY);
function wd(n){ // nth working day from today (0 = today or next working day); negative goes back
  let x = new Date(TODAY); const step = n < 0 ? -1 : 1; let left = Math.abs(n);
  while (isWeekend(x)) x = new Date(x.getTime() + step*DAY + 3600e3), x.setHours(0,0,0,0);
  while (left > 0){ x = new Date(x.getTime() + step*DAY + 3600e3); x.setHours(0,0,0,0); if (!isWeekend(x)) left--; }
  return iso(x);
}
function workdays(a, b){
  if (!a || !b || b < a) return 0;
  let n = 0, x = parse(a); const end = parse(b);
  while (x <= end){ if (!isWeekend(x)) n++; x = new Date(x.getTime() + DAY + 3600e3); x.setHours(0,0,0,0); }
  return n;
}

const fmtDay = s => parse(s).toLocaleDateString("en-US", {weekday:"short", month:"short", day:"numeric"});

/* ---------- Helpers ---------- */

const isMgr = () => S.role === "manager";

const av = (id, cls="") => `<span class="av ${cls}" style="--h:${hue(id)}" aria-hidden="true">${esc(initials(P(id).name))}</span>`;
const ico = n => `<svg class="i"><use href="#i-${n}"/></svg>`;
const pill = (s, txt) => `<span class="pill ${s}">${esc(txt || s[0].toUpperCase()+s.slice(1))}</span>`;
const firstName = id => id === "me" ? (S.profile.preferred || "Sam") : P(id).name.split(" ")[0];

function booked(type){ return S.myLeave.filter(l => l.type === type && l.status !== "declined" && l.status !== "cancelled").reduce((a,l) => a + workdays(l.start,l.end), 0); }
const left = type => LEAVE[type].allow - booked(type);
const pendingReqs = () => S.requests.filter(r => r.status === "pending");
const unacked = () => S.news.filter(n => n.mustAck && !n.acked);
function profileScore(){
  const f = ["preferred","pronouns","phone","loc","pattern","bio","emName","emPhone"];
  return Math.round(f.filter(k => String(S.profile[k]||"").trim()).length / f.length * 100);
}
function leaveEntries(){
  const team = S.requests.filter(r => r.kind === "leave" && r.status !== "declined").map(r => ({person:r.person, start:r.start, end:r.end, status:r.status, type:r.type}));
  const mine = S.myLeave.filter(l => l.status !== "declined" && l.status !== "cancelled").map(l => ({person:"me", start:l.start, end:l.end, status:l.status, type:l.type}));
  return team.concat(mine);
}
function outBetween(a, b, exclude){ return leaveEntries().filter(e => e.person !== exclude && overlaps(e.start,e.end,a,b)); }

  let r = (location.hash || "#home").slice(1);
  if (r === "approvals") r = "queue";
  const known = NAV.flatMap(g => g.items.map(i => i[0]));
  if (!known.includes(r)) return "home";
  if (r === "team" && !isMgr()) return "home";
  return r;
};

function leaveSummary(type, start, end){
  const n = workdays(start, end);
  if (!start || !end || end < start) return `<div class="hint bad">The last day must be on or after the first day.</div>`;
  if (!n) return `<div class="hint bad">Those dates fall on a weekend, so no days are used.</div>`;
  const rem = left(type) - n;
  const others = outBetween(start, end, "me").filter(e => P(e.person).mgr === "me" || P(e.person).mgr === P("me").mgr || e.person === "me");
  return `<div class="hint ${rem < 0 ? "bad" : ""}"><b>${n} working day${n===1?"":"s"}</b> · ${rem < 0 ? `that's ${-rem} more than you have left` : `${rem} ${LEAVE[type].label.toLowerCase()} days left after this`}</div>
    ${others.length ? `<div class="hint warn">Also out then: ${others.map(e => esc(P(e.person).name)).join(", ")}</div>` : ""}`;
}
function submitLeave(type, start, end, note){
  const n = workdays(start, end);
  if (!n || end < start) return "Pick working days, with the last day on or after the first.";
  if (left(type) - n < 0) return `You only have ${left(type)} ${LEAVE[type].label.toLowerCase()} days left.`;
  const id = "L-" + (220 + S.myLeave.length);
  S.myLeave.push({id, type, start, end, status:"pending", note:note||"", submitted:todayIso});
  log(`requested ${LEAVE[type].label.toLowerCase()}, ${fmtRange(start,end)}`, {ref:id}); save();
  toast(`Request sent to ${P(P("me").mgr).name}`); render();
  return null;
}

    <section class="panel"><h2>Team budget this quarter</h2>
      <div class="row"><span class="big">${money(spent)}</span><span class="muted">of ${money(S.budget.quarter)}</span></div>
      <div class="meter"><i style="width:${Math.min(100,spent/S.budget.quarter*100)}%"></i></div>
      <p class="faint">Includes approved team expenses. Pending claims aren't counted yet.</p>
    </section>
    <section class="panel"><h2>Celebrate</h2>
      ${annivs.length ? `<div class="list">${annivs.map(p => `<div class="row">${av(p.id,"sm")}<div class="grow"><b>${esc(p.name)}</b><div class="faint">${TODAY.getFullYear()-parse(p.start).getFullYear()} years on ${fmt(p.start)}</div></div><button class="btn sm" data-act="person" data-id="${p.id}">Send kudos</button></div>`).join("")}</div>` : `<p class="muted">No work anniversaries in the next 30 days.</p>`}
    </section>
  </div>`;
}

/* ---------- Work queue ---------- */
let qTab = "needs", pastFilter = "all", actFilter = "all";
const KIND = {leave:"Time off", expense:"Expense", ticket:"Ticket", approval:"Approval", ack:"Policy", reply:"Ticket"};
const TSTATUS = {open:["pending","Open"], "in-progress":["pending","In progress"], "needs-info":["needs","Needs your reply"], resolved:["resolved","Resolved"]};
const TPFX = {IT:"IT", Facilities:"FAC", "People Ops":"PPL", Finance:"FIN"};
const daysAgo = s => Math.round((TODAY - parse(s.slice(0,10))) / DAY);
const age = s => { const n = daysAgo(s); return n <= 0 ? "since today" : n === 1 ? "1 day" : n + " days"; };
const whoName = w => w === "me" ? "You" : P(w).name;
const nowAt = () => { const n = new Date(); return `${iso(n)}T${pad(n.getHours())}:${pad(n.getMinutes())}`; };
const fmtTime = a => { const [h, m] = a.slice(11,16).split(":").map(Number); return `${(h % 12) || 12}:${pad(m)} ${h < 12 ? "am" : "pm"}`; };
function log(text, o = {}){ S.activity.unshift({at:nowAt(), who:o.who || "me", text, scope:o.scope || "mine", ref:o.ref || ""}); S.activity = S.activity.slice(0, 300); }

function needsMe(){
  const items = [];
  if (isMgr()) pendingReqs().forEach(r => items.push({kind:"approval", r, date:r.submitted}));
  S.tickets.filter(t => t.status === "needs-info").forEach(t => items.push({kind:"reply", t, date:t.updated}));
  unacked().forEach(n => items.push({kind:"ack", n, date:n.date}));
  return items;
}
function waitingOn(){
  const mgr = P("me").mgr, items = [];
  S.myLeave.filter(l => l.status === "pending").forEach(l => items.push({kind:"leave", id:l.id, title:`${LEAVE[l.type].label}, ${fmtRange(l.start,l.end)}`, on:mgr, step:"Waiting for approval", date:l.submitted || todayIso}));
  S.expenses.filter(e => e.status === "submitted").forEach(e => items.push({kind:"expense", id:e.id, title:`${money(e.amount)} · ${e.merchant}`, on:mgr, step:"Waiting for approval", date:e.date}));
  S.expenses.filter(e => e.status === "approved").forEach(e => items.push({kind:"expense", id:e.id, title:`${money(e.amount)} · ${e.merchant}`, on:"sofia", step:"Approved, paid next Friday", date:e.date}));
  S.tickets.filter(t => t.status === "open" || t.status === "in-progress").forEach(t => items.push({kind:"ticket", id:t.id, title:t.subject, on:t.assignee || t.team, step:TSTATUS[t.status][1], date:t.opened}));
  return items.sort((a,b) => a.date < b.date ? -1 : 1);
}
function pastItems(){
  const items = [];
  S.myLeave.filter(l => l.status !== "pending").forEach(l => items.push({kind:"leave", id:l.id, title:`${LEAVE[l.type].label}, ${fmtRange(l.start,l.end)}`, status:l.status, date:l.decided || l.start}));
  S.expenses.filter(e => e.status === "paid").forEach(e => items.push({kind:"expense", id:e.id, title:`${money(e.amount)} · ${e.merchant}`, status:"paid", date:e.date}));
  S.tickets.filter(t => t.status === "resolved").forEach(t => items.push({kind:"ticket", id:t.id, title:`${t.team}: ${t.subject}`, status:"resolved", date:t.updated}));
  if (isMgr()) S.requests.filter(r => r.status !== "pending").forEach(r => items.push({kind:"approval", id:r.id, title:`${P(r.person).name}: ${r.kind === "leave" ? LEAVE[r.type].label + ", " + fmtRange(r.start,r.end) : money(r.amount) + " " + r.category}`, status:r.status, date:r.decided || r.submitted, reason:r.reason}));
  return items.sort((a,b) => a.date < b.date ? 1 : -1);
}

function approvalCard(r){
  const who = P(r.person);
  let detail, flags = "";
  if (r.kind === "leave"){
    const n = workdays(r.start, r.end);
    detail = `<b>${LEAVE[r.type].label}</b> · ${fmtRange(r.start,r.end)} · ${n} day${n===1?"":"s"}`;
    const clash = outBetween(r.start, r.end, r.person).filter(e => e.status === "approved");
    if (clash.length) flags = `<div class="hint warn">Also out: ${clash.map(e => esc(e.person==="me"?"You":P(e.person).name) + " (" + fmtRange(e.start,e.end) + ")").join(", ")}</div>`;
  } else {
    detail = `<b>${money(r.amount)}</b> · ${esc(r.category)} · ${esc(r.merchant)}`;
    if (r.category === "Equipment") flags = `<div class="hint">Equipment over $150 usually goes through IT. Tomás says IT has no stock.</div>`;
  }
  return `<section class="panel" id="req-${r.id}">
    <div class="label">Needs your approval · ${age(r.submitted)}</div>
    <div class="row">${av(r.person)}<div class="grow"><b>${esc(who.name)}</b><div class="faint">${r.kind === "leave" ? "Time off" : "Expense claim"} · sent ${fmt(r.submitted)}</div></div><span class="mono faint">${r.id}</span></div>
    <div>${detail}</div>${r.note ? `<div class="muted">“${esc(r.note)}”</div>` : ""}${flags}
    <div class="row" data-decide="${r.id}"><button class="btn primary sm" data-act="approve" data-id="${r.id}">Approve</button><button class="btn sm" data-act="decline" data-id="${r.id}">Decline</button></div>
  </section>`;
}
function needCard(it){
  if (it.kind === "approval") return approvalCard(it.r);
  if (it.kind === "reply"){ const t = it.t, last = t.history[t.history.length-1];
    return `<section class="panel"><div class="label">Ticket needs your reply · ${age(t.updated)}</div>
      <div class="row"><b class="grow">${esc(t.subject)}</b><span class="mono faint">${t.id}</span></div>
      <div class="row" style="align-items:flex-start">${av(last.who,"sm")}<div class="grow muted">“${esc(last.text)}”</div></div>
      <div class="row"><button class="btn primary sm" data-act="ticket" data-id="${t.id}">Reply</button></div></section>`; }
  const n = it.n;
  return `<section class="panel"><div class="label">Please acknowledge · ${age(n.date)}</div>
    <div class="row">${av(n.author,"sm")}<b class="grow">${esc(n.title)}</b></div>
    <p class="muted">${esc(n.body)}</p>
    <div class="row"><button class="btn primary sm" data-act="ack" data-id="${n.id}">I've read it</button><a class="btn sm quiet" href="#news">Open in News</a></div></section>`;
}
function activityHtml(){
  const f = S.activity.filter(a => actFilter === "all" || a.scope === actFilter).sort((a,b) => a.at < b.at ? 1 : -1);
  const groups = {}; f.forEach(a => (groups[a.at.slice(0,10)] = groups[a.at.slice(0,10)] || []).push(a));
  const dayName = d => d === todayIso ? "Today" : d === addDays(todayIso,-1) ? "Yesterday" : fmtDay(d);
  const filters = [["all","Everything"],["mine","Mine"], ...(isMgr() ? [["team","My team"]] : []), ["company","Company"]];
  return `<div class="chips">${filters.map(([k,l]) => `<button class="chip" data-act="actf" data-k="${k}" aria-pressed="${actFilter===k}">${l}</button>`).join("")}</div>
  <section class="panel">${Object.keys(groups).map(d => `<div class="day-group"><div class="label">${dayName(d)}</div><div class="list">${groups[d].map(a => `
    <div class="row">${av(a.who,"sm")}<div class="grow"><b>${esc(whoName(a.who))}</b> ${esc(a.text)}${a.ref ? ` <button class="linkbtn mono" style="color:var(--accent)" data-act="ref" data-id="${esc(a.ref)}">${esc(a.ref)}</button>` : ""}</div><span class="faint num">${fmtTime(a.at)}</span></div>`).join("")}</div></div>`).join("") || `<p class="muted">No activity yet.</p>`}</section>`;
}
function vQueue(){
  const needs = needsMe(), wait = waitingOn(), past = pastItems();
  const tabs = [["needs","Needs you",needs.length],["waiting","Waiting on others",wait.length],["past","Past",0],["activity","Activity log",0]];
  let body = "";
  if (qTab === "needs") body = needs.length ? `<div class="cols">${needs.map(needCard).join("")}</div>` : `<section class="panel"><p class="muted">Nothing needs you right now.</p></section>`;
  if (qTab === "waiting") body = `<section class="panel">${wait.length ? `<div class="list">${wait.map(w => `
    <div class="qrow"><span class="qkind">${KIND[w.kind]}</span><div class="grow"><b>${esc(w.title)}</b><div class="faint"><span class="mono">${w.id}</span> · ${esc(w.step)} · with ${esc(whoName(w.on))} · ${age(w.date)}</div></div>
      <div class="row">${w.kind === "ticket" ? `<button class="btn sm" data-act="ticket" data-id="${w.id}">Open</button>` : ""}<button class="btn sm quiet" data-act="nudge" data-id="${w.id}" data-on="${esc(w.on)}">Send reminder</button></div></div>`).join("")}</div>` : `<p class="muted">You're not waiting on anyone.</p>`}</section>`;
  if (qTab === "past"){
    const f = past.filter(x => pastFilter === "all" || x.kind === pastFilter);
    const filters = [["all","All"],["ticket","Tickets"],["leave","Time off"],["expense","Expenses"], ...(isMgr() ? [["approval","Your decisions"]] : [])];
    body = `<div class="chips">${filters.map(([k,l]) => `<button class="chip" data-act="pastf" data-k="${k}" aria-pressed="${pastFilter===k}">${l}</button>`).join("")}</div>
    <section class="panel">${f.length ? `<div class="list">${f.map(x => `<div class="qrow"><span class="qkind">${KIND[x.kind]}</span><div class="grow"><b>${esc(x.title)}</b><div class="faint"><span class="mono">${x.id}</span> · ${fmt(x.date)}${x.reason ? " · " + esc(x.reason) : ""}</div></div>${pill(x.status)}${x.kind === "ticket" ? `<button class="btn sm quiet" data-act="ticket" data-id="${x.id}">View</button>` : ""}</div>`).join("")}</div>` : `<p class="muted">Nothing here yet.</p>`}</section>`;
  }
  if (qTab === "activity") body = activityHtml();
  return `
  <div class="page-head"><div><h1>Work queue</h1><p class="muted">${needs.length ? `${needs.length} need${needs.length === 1 ? "s" : ""} you` : "Nothing needs you"} · ${wait.length} waiting on others</p></div>
    <div class="row">${needs.length ? `<button class="btn" data-act="suggest" data-q="Go through my work queue and tell me what to do first, and flag anything unusual">${ico("spark")}What first?</button>` : ""}<button class="btn primary" data-act="new-ticket">${ico("plus")}New request</button></div></div>
  <div class="tabs" role="tablist">${tabs.map(([k,l,n]) => `<button role="tab" data-act="qtab" data-k="${k}" aria-selected="${qTab===k}">${l}${n ? `<span class="tcount">${n}</span>` : ""}</button>`).join("")}</div>
  ${body}`;
}
function openTicket(id){
  const t = S.tickets.find(x => x.id === id); if (!t) return;
  modal(`<div class="row" style="align-items:flex-start"><div class="grow"><div class="label">${esc(t.team)} · <span class="mono">${t.id}</span></div><h2>${esc(t.subject)}</h2></div><button class="btn quiet sm" data-act="close" aria-label="Close">${ico("x")}</button></div>
    <div class="row">${pill(TSTATUS[t.status][0], TSTATUS[t.status][1])}<span class="faint">Opened ${fmt(t.opened)} · ${t.assignee ? "with " + esc(P(t.assignee).name) : "not assigned yet"}</span></div>
    <div class="thread">${t.history.map(h => `<div class="row" style="align-items:flex-start">${av(h.who,"sm")}<div class="grow"><b>${esc(whoName(h.who))}</b> <span class="faint">${fmt(h.at.slice(0,10))}, ${fmtTime(h.at)}</span><div>${esc(h.text)}</div></div></div>`).join("")}</div>
    ${t.status !== "resolved" ? `<form id="tReply" class="stack"><label class="field"><span>Reply</span><textarea id="tReplyText" required></textarea></label>
      <div class="row"><button class="btn primary" type="submit">Send reply</button><button class="btn quiet" type="button" data-act="ticket-close" data-id="${t.id}">Mark as resolved</button></div></form>` : ""}`,
  m => { const f = m.querySelector("#tReply"); f && f.addEventListener("submit", e => { e.preventDefault(); const v = m.querySelector("#tReplyText").value.trim(); if (!v) return;
    t.history.push({at:nowAt(), who:"me", text:v}); if (t.status === "needs-info") t.status = "in-progress"; t.updated = todayIso;
    log("replied on a ticket", {ref:t.id}); save(); closeModal(); toast(`Reply sent to ${t.assignee ? P(t.assignee).name : t.team}`); render(); }); });
}
function newTicket(pre = {}){
  modal(`<div class="row"><h2 class="grow">New request</h2><button class="btn quiet sm" data-act="close" aria-label="Close">${ico("x")}</button></div>
    <form id="tNew" class="stack">
      <label class="field"><span>Who can help?</span><select id="tTeam">${Object.keys(TPFX).map(x => `<option ${x === pre.team ? "selected" : ""}>${x}</option>`).join("")}</select></label>
      <label class="field"><span>What do you need?</span><input type="text" id="tSubj" value="${esc(pre.subject || "")}" required></label>
      <label class="field"><span>Details</span><textarea id="tBody">${esc(pre.details || "")}</textarea></label>
      <div class="row"><button class="btn primary" type="submit">Send request</button><button class="btn quiet" type="button" data-act="close">Cancel</button></div>
    </form>`, m => m.querySelector("#tNew").addEventListener("submit", e => { e.preventDefault();
      const err = submitTicket(m.querySelector("#tTeam").value, m.querySelector("#tSubj").value.trim(), m.querySelector("#tBody").value.trim());
      if (err) toast(err); else closeModal(); }));
}
function submitTicket(team, subject, details){
  if (!subject) return "Say what you need first.";
  if (!TPFX[team]) team = "IT";
  const id = TPFX[team] + "-" + (4500 + S.tickets.length);
  S.tickets.unshift({id, team, subject, status:"open", assignee:null, opened:todayIso, updated:todayIso, history:[{at:nowAt(), who:"me", text:details || subject}]});
  log(`opened a ticket: ${subject}`, {ref:id}); save(); toast(`${id} sent to ${team}`); qTab = "waiting"; render(); return null;
}
function decide(id, decision, reason){
  const r = S.requests.find(x => x.id === id); if (!r || r.status !== "pending") return "That request was already decided.";
  r.status = decision; r.reason = reason || ""; r.decided = todayIso;
  log(`${decision} ${P(r.person).name}'s ${r.kind === "leave" ? LEAVE[r.type].label.toLowerCase() : "claim"}`, {scope:"team", ref:id}); save();
  toast(`${decision === "approved" ? "Approved" : "Declined"}. ${P(r.person).name} has been notified.`); render(); return null;
}

/* ---------- Render + mount ---------- */
const VIEWS = {home:vHome, queue:vQueue, news:vNews, people:vPeople, "time-off":vTimeOff, expenses:vExpenses, profile:vProfile, team:vTeam};
function render(){
  const r = route();
  renderRail();
  const v = document.getElementById("view");
  const scroll = window.scrollY;
  v.innerHTML = VIEWS[r]();
  mount(r);
  window.scrollTo(0, scroll);
}
function mount(r){
  if (r === "home"){
    document.getElementById("heroAsk").addEventListener("submit", e => { e.preventDefault(); const q = document.getElementById("heroInput").value.trim(); if (q) openAI(q); });
  }
  if (r === "people"){
    renderPeopleGrid();
    document.getElementById("peopleQ").addEventListener("input", e => { peopleQ = e.target.value; renderPeopleGrid(); });
  }
  if (r === "news"){
    document.getElementById("postForm").addEventListener("submit", e => { e.preventDefault();
      const t = document.getElementById("postTitle").value.trim(), b = document.getElementById("postBody").value.trim(); if (!t || !b) return;
      S.news.unshift({id:uid("n"), author:"me", date:todayIso, title:t, body:b, mustAck:false, r:{clap:0,heart:0,idea:0}, mine:null});
      if (/kai/i.test(t+b)) S.onboarding.find(o => o.id === "o5").done = true;
      S.draftTitle = S.draftBody = ""; log(`posted “${t}”`, {scope:"company"}); save(); toast("Posted to News"); render(); });
  }
  if (r === "time-off"){
    const upd = () => { document.getElementById("lvSum").innerHTML = leaveSummary(lvType.value, lvStart.value, lvEnd.value); };
    const lvType = document.getElementById("lvType"), lvStart = document.getElementById("lvStart"), lvEnd = document.getElementById("lvEnd");
    lvStart.addEventListener("change", () => { if (lvEnd.value < lvStart.value) lvEnd.value = lvStart.value; upd(); });
    [lvType, lvEnd].forEach(x => x.addEventListener("change", upd)); upd();
    document.getElementById("leaveForm").addEventListener("submit", e => { e.preventDefault();
      const err = submitLeave(lvType.value, lvStart.value, lvEnd.value, document.getElementById("lvNote").value.trim()); if (err) toast(err); });
  }
  if (r === "expenses"){
    let receipt = "";
    const g = id => document.getElementById(id);
    const upd = () => g("exHint").innerHTML = expenseHints(g("exCat").value, Number(g("exAmt").value||0), !!receipt);
    ["exCat","exAmt"].forEach(id => g(id).addEventListener("input", upd));
    g("exReceipt").addEventListener("change", async e => {
      const file = e.target.files[0]; if (!file) return; receipt = file.name; g("exFile").textContent = "Receipt: " + file.name; upd();
      scanReceipt(file);
    });
    g("expForm").addEventListener("submit", e => { e.preventDefault();
      const err = submitExpense({date:g("exDate").value, amount:Number(g("exAmt").value), category:g("exCat").value, merchant:g("exMer").value.trim(), note:g("exNote").value.trim(), receipt});
      if (err) toast(err); });
  }
  if (r === "profile"){
    document.getElementById("profileForm").addEventListener("submit", e => { e.preventDefault();
      Object.keys(S.profile).forEach(k => { const el = document.getElementById("pf-"+k); if (el) S.profile[k] = el.value.trim(); });
      if (S.profile.loc) P("me").loc = S.profile.loc; log("updated your profile"); save(); toast("Profile saved"); render(); });
    document.getElementById("newSkill").addEventListener("keydown", e => { if (e.key !== "Enter") return; e.preventDefault();
      const v = e.target.value.trim(); if (v && !P("me").skills.includes(v)){ P("me").skills.push(v); save(); stashProfile(); render(); document.getElementById("newSkill").focus(); } });
  }
}
function stashProfile(){ Object.keys(S.profile).forEach(k => { const el = document.getElementById("pf-"+k); if (el) S.profile[k] = el.value; }); }

/* ---------- Click actions ---------- */

  "rm-skill"(el){ stashProfile(); P("me").skills.splice(Number(el.dataset.i), 1); save(); render(); },
  qtab(el){ qTab = el.dataset.k; render(); },
  pastf(el){ pastFilter = el.dataset.k; render(); },
  actf(el){ actFilter = el.dataset.k; render(); },
  ticket(el){ openTicket(el.dataset.id); },
  "new-ticket"(){ newTicket(); },
  "ticket-close"(el){ const t = S.tickets.find(x => x.id === el.dataset.id); t.status = "resolved"; t.updated = todayIso;
    t.history.push({at:nowAt(), who:"me", text:"Marked as resolved."}); log("resolved a ticket", {ref:t.id}); save(); closeModal(); toast(`${t.id} resolved`); render(); },
  nudge(el){ if (el.dataset.done) return; el.dataset.done = "1"; el.disabled = true; el.textContent = "Reminder sent";

    document.getElementById("why-"+el.dataset.id).focus(); },
  "decline-go"(el){ const why = document.getElementById("why-"+el.dataset.id).value.trim(); if (!why){ toast("Add a short reason so they know what to change."); return; } decide(el.dataset.id, "declined", why); },
  redraw(){ render(); },
  onb(el){ const o = S.onboarding.find(x => x.id === el.dataset.id); o.done = el.checked; if (o.done) log(`completed “${o.t}” for Kai Nakamura`, {scope:"team"}); save(); render(); },

async function askAI(q){
  addMsg("user", q);
  if (!sampleFn) { localAssist(q); return; }
  turns.push({role:"user", content:q}); turns = turns.slice(-10);
  const think = addMsg("status", "Thinking…");
  const send = document.getElementById("aiSend"), stop = document.getElementById("aiStop");
  send.hidden = true; stop.hidden = false; aiCtl = new AbortController();
  let bubble = null;
  try {
    const res = await sampleFn([{role:"user", content:RULES()}, ...turns], {
      modelTier:"quick", cache:false, signal:aiCtl.signal, tools:TOOLS,
      onText: ({text}) => { if (!bubble){ think.remove(); bubble = bot(""); } bubble.textContent = text; aiLog.scrollTop = aiLog.scrollHeight; },
    });
    turns.push({role:"assistant", content:res.text});
  } catch(e){
    think.remove();
    if (e && e.code === "cancelled") { if (!bubble) addMsg("status", "Stopped."); }
    else if (e && (e.code === "not_granted" || e.code === "sampling_disabled" || e.code === "tools_unavailable" || e.code === "capability_disabled" || e.code === "not_declared")) {
      sampleFn = null; setMode(); turns = []; addMsg("status", "Claude isn't available here, so I'm using the built-in demo assistant."); localAssist(q);
    }
    else if (e && e.code === "rate_limited") addMsg("status", "Too many requests right now. Try again in a minute.");
    else addMsg("status", "Something went wrong reaching Claude. Try again.");
  } finally { send.hidden = false; stop.hidden = true; aiCtl = null; }
}

/* Built-in demo assistant: used when Claude isn't available (for example, the file opened outside claude.ai). */
const WEEKDAYS = ["sunday","monday","tuesday","wednesday","thursday","friday","saturday"];
function findDates(q){
  const s = q.toLowerCase(); const out = [];
  (s.match(/\d{4}-\d{2}-\d{2}/g) || []).forEach(d => out.push(d));
  if (/\btomorrow\b/.test(s)) out.push(addDays(todayIso,1));
  if (/\btoday\b/.test(s)) out.push(todayIso);
  if (/\byesterday\b/.test(s)) out.push(addDays(todayIso,-1));
  const m = s.match(/\b(next|this)?\s*(monday|tuesday|wednesday|thursday|friday)\b/);
  if (m){ const target = WEEKDAYS.indexOf(m[2]); let n = (target - TODAY.getDay() + 7) % 7 || 7; if (m[1] === "next" && n < 7 && TODAY.getDay() < target && TODAY.getDay() !== 0) n += 7; out.push(addDays(todayIso, n)); }
  const mon = s.match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+(\d{1,2})\b/g);
  (mon || []).forEach(t => { const [mm, dd] = t.split(/\s+/); const mi = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"].indexOf(mm.slice(0,3)); let y = TODAY.getFullYear(); const c = new Date(y, mi, Number(dd)); if (c < TODAY) y++; out.push(iso(new Date(y, mi, Number(dd)))); });
  return out;
}
function localAssist(q){
  const s = q.toLowerCase();
  setTimeout(() => {
    if (/(broken|not working|doesn.?t work|flicker|wifi|wi-fi|printer|projector|password|locked out|help desk|ticket|benefits|payroll)/.test(s) && !/(status|where)/.test(s)){
      const team = /(projector|room|heat|cold|light|chair|desk|door|parking|clean)/.test(s) ? "Facilities" : /(benefit|payroll|pay stub|t4|beneficiary)/.test(s) ? "People Ops" : /(invoice|reimburs|payment)/.test(s) ? "Finance" : "IT";
      bot(`I've drafted a request for ${team}. Add any details and send it.`);
      proposal("ticket", {team, subject:q.replace(/^(please|can you|help)\s+/i,""), details:""}); return;
    }
    if (/(approv|needs my)/.test(s)){
      if (!isMgr()){ bot("Only managers approve requests. Your own requests are in Work queue under Waiting on others."); return; }
      const p = pendingReqs(); bot(p.length ? `${p.length} waiting for you:\n` + p.map(r => `• ${P(r.person).name}: ${r.kind==="leave" ? `${LEAVE[r.type].label}, ${fmtRange(r.start,r.end)}` : `${money(r.amount)} ${r.category}`}`).join("\n") + "\nTomás's keyboard is over the usual $150 IT limit." : "Nothing is waiting for you.");
      if (p.length) bot("Open Work queue to decide, or tell me which one to approve."); return;
    }
    if (/(where.?s my|where is my|status|waiting on|hear back|stuck)/.test(s)){
      const w = waitingOn().filter(x => !/claim|expense/.test(s) || x.kind === "expense").filter(x => !/ticket|request/.test(s) || x.kind === "ticket");
      bot(w.length ? w.map(x => `• ${x.id} ${x.title}: ${x.step.toLowerCase()}, with ${whoName(x.on)} (${age(x.date)})`).join("\n") : "Nothing of yours is waiting on anyone."); return;
    }
    if (/(what first|work queue|to do|todo)/.test(s)){
      const n = needsMe(); bot(n.length ? "Start with these:\n" + n.map(i => i.kind === "approval" ? `• Decide ${P(i.r.person).name}'s ${i.r.kind === "leave" ? "time off" : "claim"} (${i.r.id})` : i.kind === "reply" ? `• Reply to ${P(i.t.assignee).name} on ${i.t.id}: ${i.t.subject}` : `• Acknowledge “${i.n.title}”`).join("\n") : "Nothing needs you right now."); return;
    }
    if (/(activity|what happened|history|recent)/.test(s)){
      bot(S.activity.slice(0,6).map(a => `• ${whoName(a.who)} ${a.text}${a.ref ? " (" + a.ref + ")" : ""}`).join("\n")); return;
    }
    if (/(time off|day off|days off|vacation|holiday|book|leave|sick|personal day)/.test(s) && !/policy/.test(s)){
      const ds = findDates(q).sort(); const start = ds[0] || wd(1), end = ds[ds.length-1] || start;
      const type = /sick/.test(s) ? "sick" : /personal/.test(s) ? "personal" : "vacation";
      bot(`I've prepared a ${LEAVE[type].label.toLowerCase()} request. Check the dates and send it when you're ready.`);
      proposal("leave", {type, start, end, note:""}); return;
    }
    if (/(expense|claim|receipt|reimburs|\$\s?\d)/.test(s) && !/(limit|cap|policy|can i)/.test(s)){
      const amt = Number((s.match(/\$\s?(\d+(?:\.\d{1,2})?)/) || s.match(/(\d+(?:\.\d{1,2})?)\s?(?:dollars|usd)/) || [])[1] || 0);
      const cat = /taxi|uber|lyft|train|flight|parking|mileage/.test(s) ? "Travel" : /lunch|dinner|coffee|meal|breakfast/.test(s) ? "Meals" : /hotel|airbnb/.test(s) ? "Lodging" : /course|conference|book/.test(s) ? "Training" : /software|license|subscription/.test(s) ? "Software" : "Other";
      const mer = (q.match(/\b(taxi|uber|lyft|hotel|lunch|dinner|coffee|parking|train)\b/i) || [""])[0];
      bot(`Here's a draft claim. Add the merchant and attach a receipt from Expenses if it's over ${money(POLICY.receiptOver)}.`);
      proposal("expense", {date:findDates(q)[0] || todayIso, merchant:mer ? mer[0].toUpperCase()+mer.slice(1) : "", category:cat, amount:amt, note:""}); return;
    }
    if (/(who.?s|who is|anyone) (out|off|away)/.test(s)){
      const out = outBetween(todayIso, addDays(todayIso, /next week/.test(s) ? 13 : 6));
      bot(out.length ? out.map(e => `${e.person==="me"?"You":P(e.person).name}: ${fmtRange(e.start,e.end)}${e.status==="pending"?" (waiting for approval)":""}`).join("\n") : "No one on your team is out."); return;
    }
    if (/(meal|limit|cap|policy|receipt|coworking|alcohol)/.test(s)){
      bot(`Meals are capped at ${money(POLICY.mealCap)} a day. Claims over ${money(POLICY.receiptOver)} need a receipt. Coworking day passes are fine under Other when you're travelling, up to $40. Alcohol isn't reimbursed. For anything else, ask Sofia Márquez in Finance.`); return;
    }
    if (/welcome/.test(s) && /kai/.test(s)){
      bot("Here's a draft you can move into News.");
      proposal("post", {title:"Welcome Kai Nakamura to Product Design", body:`Kai joins us as a Product Designer on ${fmtDay(P("kai").start)}, working from Vancouver. Kai brings a sharp eye for visual design and will start on the onboarding flow with Lena. Say hello and share your favourite tip for a first week here.`}); return;
    }
    const terms = s.replace(/who (knows|is|speaks)|find|anyone|someone|\?|that|about|the/g," ").trim().split(/\s+/).filter(w => w.length > 2);
    const hits = S.people.filter(p => terms.some(t => [p.name,p.title,p.dept,p.loc,...(p.skills||[])].join(" ").toLowerCase().includes(t)));
    if (hits.length && hits.length < S.people.length){ bot(hits.slice(0,5).map(p => `${p.name}, ${p.title} (${p.loc})${p.skills.length ? ". Knows " + p.skills.join(", ") : ""}`).join("\n")); return; }
    bot("In this demo I can book time off, start an expense claim, open a help request, check what you're waiting on, list who's out, explain the expense policy, find people by skill and go through your work queue. Open OC Connect in Claude for full answers.");
  }, 350);
}

/* Small AI helpers on pages */
async function catchUp(){
  const box = document.getElementById("catchup"); box.hidden = false; box.className = "catchup muted"; box.textContent = "Reading the latest updates…";
  const local = () => { box.textContent = [unacked().length ? `• Action: acknowledge “${unacked()[0].title}” (meals now capped at $75/day).` : null, "• Q3 closed at 112% of target and 2027 planning starts next week.", "• Laptops from 2022 or earlier can be swapped at the IT desk."].filter(Boolean).join("\n"); };
  if (!sampleFn) { setTimeout(local, 300); return; }
  try {
    const {text} = await sampleFn(`Summarize these intranet updates for ${P("me").name} in at most 3 short bullet lines starting with "• ". Lead with anything they must act on. Plain text only.\n\n${JSON.stringify(S.news.slice(0,5).map(n => ({title:n.title, by:P(n.author).name, mustAcknowledge:n.mustAck && !n.acked, body:n.body})))}`,
      {modelTier:"quick", onText:({text}) => box.textContent = text});
    box.textContent = text;
  } catch(e){ local(); }
}
async function polishPost(){
  const t = document.getElementById("postTitle"), b = document.getElementById("postBody");
  if (!b.value.trim()){ toast("Write a rough message first, then polish it."); return; }
  if (!sampleFn){ toast("Polishing needs Claude. Open OC Connect in Claude to use it."); return; }
  const old = b.value; b.value = "Polishing…"; b.disabled = true;
  try {
    const out = await sampleFn.json(`Rewrite this internal company update so it is clear, warm and brief (under 90 words). Keep every fact. Reply with only JSON {"title": string, "body": string}.\nTitle: ${t.value}\nMessage: ${old}`, {modelTier:"quick"});
    t.value = String(out.title || t.value); b.value = String(out.body || old); toast("Polished. Edit anything before posting.");
  } catch(e){ b.value = old; toast("Couldn't polish that right now."); }
  finally { b.disabled = false; }
}
async function draftBio(){
  const el = document.getElementById("pf-bio"); const p = P("me");
  const fallback = `${p.title} on the ${p.dept} team in ${S.profile.loc || p.loc}. I work on ${p.skills.slice(0,2).join(" and ").toLowerCase()}. Message me any time, or catch me in the office ${S.profile.pattern.replace(/^.*in office\s*/i,"") || "most days"}.`;
  if (!sampleFn){ el.value = fallback; toast("Draft added. Edit it, then save."); return; }
  el.value = "Drafting…";
  try { const {text} = await sampleFn(`Write a two-sentence intranet bio in the first person for ${p.name}, ${p.title} on ${p.dept}, based in ${p.loc}, skills: ${p.skills.join(", ")}, work pattern: ${S.profile.pattern}. Friendly and specific. Plain text only.`, {modelTier:"quick", cache:false});
    el.value = text.trim(); toast("Draft added. Edit it, then save."); }
  catch(e){ el.value = fallback; }
}
async function scanReceipt(file){
  const box = document.getElementById("exScan");
  if (!sampleFn || !file.type.startsWith("image/")){ box.innerHTML = `<div class="hint">Receipt attached. ${sampleFn ? "" : "Reading receipts automatically needs Claude."}</div>`; return; }
  let caps = null; try { caps = await sampleFn.limits(); } catch(e){}
  if (!caps || !caps.images){ box.innerHTML = `<div class="hint">Receipt attached.</div>`; return; }
  box.innerHTML = `<div class="hint ai">Reading your receipt…</div>`;
  try {
    const r = await sampleFn.json(`This image is a receipt. Reply with only JSON {"merchant": string, "date": "YYYY-MM-DD" or "", "amount": number (the total paid), "category": one of ${JSON.stringify(CATS)}}. Today is ${todayIso}.`, {modelTier:"quick", images:file});
    const g = id => document.getElementById(id);
    if (r.merchant) g("exMer").value = String(r.merchant);
    if (/^\d{4}-\d{2}-\d{2}$/.test(r.date || "")) g("exDate").value = r.date;
    if (Number(r.amount) > 0) g("exAmt").value = Number(r.amount).toFixed(2);
    if (CATS.includes(r.category)) g("exCat").value = r.category;
    g("exAmt").dispatchEvent(new Event("input"));
    box.innerHTML = `<div class="hint ai">Filled in from your receipt. Check the details before you submit.</div>`;
  } catch(e){ box.innerHTML = `<div class="hint">Receipt attached. I couldn't read it, so fill in the details below.</div>`; }
}

render();
</script>
